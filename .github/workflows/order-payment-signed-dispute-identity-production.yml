name: Order Payment Signed Dispute Identity Production Compatibility

on:
  workflow_dispatch:
    inputs:
      release_commit:
        description: Exact 40-character reviewed main commit
        required: true
        type: string
      main_ci_run_id:
        description: Successful full CI run for the exact main commit
        required: true
        type: string
      confirmation:
        description: Type apply-reviewed-order-payment-signed-dispute-identity-compatibility
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: production-database-migrations
  cancel-in-progress: false

jobs:
  apply:
    name: Apply signed-dispute identity compatibility only
    if: github.repository == 'Drewyoung910/grainline' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: Production
    env:
      MIGRATION_DB_ROLE: neondb_owner
      PRODUCTION_MIGRATION_CONFIRM: run-reviewed-production-migrations-from-main
      PRODUCTION_MIGRATION_DIRECT_URL_SHA256: ${{ vars.PRODUCTION_MIGRATION_DIRECT_URL_SHA256 }}
      PRODUCTION_MIGRATION_RELEASE_COMMIT: ${{ inputs.release_commit }}
      RUNTIME_DB_ROLE: grainline_app_runtime
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify exact successful main CI
        uses: actions/github-script@v7
        env:
          REVIEWED_CONFIRMATION: ${{ inputs.confirmation }}
          REVIEWED_MAIN_CI_RUN_ID: ${{ inputs.main_ci_run_id }}
          REVIEWED_RELEASE_COMMIT: ${{ inputs.release_commit }}
        with:
          script: |
            const runIdValue = process.env.REVIEWED_MAIN_CI_RUN_ID;
            if (!/^[1-9][0-9]{0,19}$/.test(runIdValue ?? '')) {
              throw new Error('REVIEWED_MAIN_CI_RUN_ID is not one positive run id');
            }
            const runId = Number(runIdValue);
            const releaseCommit = process.env.REVIEWED_RELEASE_COMMIT;
            if (
              !Number.isSafeInteger(runId)
              || releaseCommit !== context.sha
              || !/^[0-9a-f]{40}$/.test(releaseCommit ?? '')
              || process.env.REVIEWED_CONFIRMATION
                !== 'apply-reviewed-order-payment-signed-dispute-identity-compatibility'
            ) {
              throw new Error('Signed-dispute identity production bindings drifted');
            }
            const { data: run } = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
            });
            if (
              run.id !== runId
              || run.name !== 'CI'
              || run.event !== 'push'
              || run.head_branch !== 'main'
              || run.head_sha !== releaseCommit
              || run.status !== 'completed'
              || run.conclusion !== 'success'
            ) {
              throw new Error(`Reviewed CI run ${runId} drifted`);
            }
      - name: Verify exact source, owner connection, and role posture
        run: node scripts/guard-production-migration-runner.mjs
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
      - name: Refuse an unreviewed migration successor
        shell: bash
        run: |
          set -euo pipefail
          latest="$(find prisma/migrations -mindepth 1 -maxdepth 1 -type d -print | LC_ALL=C sort | tail -n 1)"
          test "$latest" = "prisma/migrations/20260828020000_correct_order_payment_signed_dispute_identity"
      - name: Verify signed-dispute identity migration bytes
        run: npm run audit:order-payment-signed-dispute-identity-release
      - name: Inspect exact restart scope read-only
        id: scope
        shell: bash
        env:
          ORDER_PAYMENT_SIGNED_DISPUTE_IDENTITY_SCOPE_STAGE: restart
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
        run: |
          set -euo pipefail
          scope_json="$(npm run --silent audit:order-payment-signed-dispute-identity-production-scope)"
          printf '%s\n' "$scope_json"
          node -e '
            const value = JSON.parse(process.argv[1]);
            const states = new Set([
              "signed-dispute-identity-predecessor",
              "signed-dispute-identity-compatible",
            ]);
            if (!states.has(value.state)) {
              throw new Error("invalid signed-dispute identity restart state");
            }
            process.stdout.write(`state=${value.state}\n`);
          ' "$scope_json" >> "$GITHUB_OUTPUT"
      - name: Isolate candidate while proving the sealed predecessor tree
        run: >-
          mv
          prisma/migrations/20260828020000_correct_order_payment_signed_dispute_identity
          "$RUNNER_TEMP/order-payment-signed-dispute-identity-release"
      - name: Verify signed-refund identity predecessor
        run: npm run audit:order-payment-signed-refund-identity-release
      - name: Verify predecessor production migration status
        if: steps.scope.outputs.state == 'signed-dispute-identity-predecessor'
        run: npx prisma migrate status
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
      - name: Restore candidate migration
        run: >-
          mv
          "$RUNNER_TEMP/order-payment-signed-dispute-identity-release"
          prisma/migrations/20260828020000_correct_order_payment_signed_dispute_identity
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Apply signed-dispute identity compatibility
        if: steps.scope.outputs.state == 'signed-dispute-identity-predecessor'
        run: npx prisma migrate deploy
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
      - name: Verify production migration status
        run: npx prisma migrate status
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
      - name: Audit runtime grants and global RLS catalog
        run: npm run audit:db-grants -- --require-direct-url
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
      - name: Prove exact post-application scope read-only
        run: npm run audit:order-payment-signed-dispute-identity-production-scope
        env:
          ORDER_PAYMENT_SIGNED_DISPUTE_IDENTITY_SCOPE_STAGE: after
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
