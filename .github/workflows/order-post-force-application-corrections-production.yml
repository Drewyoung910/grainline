name: Order Post-Force Application Corrections Production

on:
  workflow_dispatch:
    inputs:
      release_commit:
        description: Exact reviewed main commit
        required: true
        type: string
      main_ci_run_id:
        description: Successful full push CI run for that exact main commit
        required: true
        type: string
      confirmation:
        description: Type apply-reviewed-order-post-force-application-corrections
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: production-database-migrations
  cancel-in-progress: false

jobs:
  apply:
    name: Apply reviewed Order post-FORCE application corrections
    if: >-
      github.repository == 'Drewyoung910/grainline' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      github.run_attempt == 1 &&
      inputs.confirmation == 'apply-reviewed-order-post-force-application-corrections'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: Production
    env:
      MIGRATION_DB_ROLE: neondb_owner
      PRODUCTION_MIGRATION_CONFIRM: run-reviewed-production-migrations-from-main
      PRODUCTION_MIGRATION_DIRECT_URL_SHA256: ${{ vars.PRODUCTION_MIGRATION_DIRECT_URL_SHA256 }}
      PRODUCTION_MIGRATION_RELEASE_COMMIT: ${{ inputs.release_commit }}
      RUNTIME_DB_ROLE: grainline_app_runtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.2"
          architecture: x64
          check-latest: false
          package-manager-cache: false
          token: ""
      - run: npm ci --ignore-scripts
      - name: Verify exact main and completed CI before credential access
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          REVIEWED_RELEASE_COMMIT: ${{ inputs.release_commit }}
          REVIEWED_MAIN_CI_RUN_ID: ${{ inputs.main_ci_run_id }}
        with:
          script: |
            const sha = process.env.REVIEWED_RELEASE_COMMIT;
            const value = process.env.REVIEWED_MAIN_CI_RUN_ID;
            if (!/^[0-9a-f]{40}$/.test(sha ?? '') || sha !== context.sha ||
                !/^[1-9][0-9]{0,19}$/.test(value ?? '')) {
              throw new Error('Order post-FORCE release binding drifted');
            }
            const runId = Number(value);
            if (!Number.isSafeInteger(runId)) throw new Error('CI run id is unsafe');
            const [{data: main}, {data: run}] = await Promise.all([
              github.rest.repos.getBranch({...context.repo, branch: 'main'}),
              github.rest.actions.getWorkflowRun({...context.repo, run_id: runId}),
            ]);
            if (main.commit.sha !== sha || run.name !== 'CI' ||
                run.event !== 'push' || run.head_branch !== 'main' ||
                run.head_sha !== sha || run.status !== 'completed' ||
                run.conclusion !== 'success') {
              throw new Error('Order post-FORCE main/CI readback drifted');
            }
      - name: Verify exact migration source and focused behavior
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t latest < <(
            find prisma/migrations -mindepth 1 -maxdepth 1 -type d -print \
              | LC_ALL=C sort | tail -n 2
          )
          test "${#latest[@]}" = "2"
          test "${latest[0]}" = "prisma/migrations/20260930030000_bound_listing_fulfillment_days"
          test "${latest[1]}" = "prisma/migrations/20260930031000_mark_paid_private_listing_sold"
          printf '%s\n' \
            "ceef219897013aa84bec0155f23e0ce01d8c48472d6e8bcb166e713d1e4edd96  prisma/migrations/20260930030000_bound_listing_fulfillment_days/migration.sql" \
            "0a1cb4828cce4d05abf783b12d790c13581fb7698f8063aaeaf92b5fa8c6bee1  prisma/migrations/20260930031000_mark_paid_private_listing_sold/migration.sql" \
            | sha256sum --check --status
          node --test \
            tests/listing-fulfillment-bounds.test.mjs \
            tests/private-custom-listing-paid-state.test.mjs \
            tests/listing-visibility.test.mjs \
            tests/order-paid-checkout-authority-postgres.test.mjs
      - name: Verify owner connection boundary
        run: node scripts/guard-production-migration-runner.mjs
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
      - name: Capture restart state and require compatible Listing data
        id: preflight
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
        run: |
          node --input-type=module - <<'NODE'
          import assert from 'node:assert/strict';
          import {appendFileSync, writeFileSync} from 'node:fs';
          import pg from 'pg';

          const migrations = [
            {
              name: '20260930030000_bound_listing_fulfillment_days',
              checksum: 'ceef219897013aa84bec0155f23e0ce01d8c48472d6e8bcb166e713d1e4edd96',
            },
            {
              name: '20260930031000_mark_paid_private_listing_sold',
              checksum: '0a1cb4828cce4d05abf783b12d790c13581fb7698f8063aaeaf92b5fa8c6bee1',
            },
          ];
          const client = new pg.Client({connectionString: process.env.DIRECT_URL});
          const postureSql = `
            SELECT relation.relname AS table_name,
                   relation.relrowsecurity AS rls_enabled,
                   relation.relforcerowsecurity AS force_enabled,
                   relation.relacl::text AS table_acl,
                   COALESCE((
                     SELECT jsonb_agg(jsonb_build_object(
                       'name', policy.polname,
                       'command', policy.polcmd,
                       'permissive', policy.polpermissive,
                       'roles', policy.polroles::text,
                       'using', pg_catalog.pg_get_expr(policy.polqual, policy.polrelid),
                       'check', pg_catalog.pg_get_expr(policy.polwithcheck, policy.polrelid)
                     ) ORDER BY policy.polname)
                       FROM pg_catalog.pg_policy AS policy
                      WHERE policy.polrelid = relation.oid
                   ), '[]'::jsonb) AS policies
              FROM pg_catalog.pg_class AS relation
             WHERE relation.oid = ANY(ARRAY[
               'public."Listing"'::regclass,
               'public."Order"'::regclass,
               'public."OrderItem"'::regclass,
               'public."OrderShippingRateQuote"'::regclass
             ])
             ORDER BY relation.relname`;
          try {
            await client.connect();
            await client.query('BEGIN READ ONLY');
            const ledger = await client.query(`SELECT migration_name, checksum,
              finished_at, rolled_back_at, applied_steps_count
              FROM public._prisma_migrations
              WHERE migration_name = ANY($1::text[]) ORDER BY migration_name`,
              [migrations.map(({name}) => name)]);
            const rows = new Map(ledger.rows.map((row) => [row.migration_name, row]));
            for (const migration of migrations) {
              const row = rows.get(migration.name);
              if (!row) continue;
              assert.equal(row.checksum, migration.checksum);
              assert.ok(row.finished_at);
              assert.equal(row.rolled_back_at, null);
              assert.equal(Number(row.applied_steps_count), 1);
            }
            assert.ok(
              rows.has(migrations[0].name) || !rows.has(migrations[1].name),
              'paid custom successor cannot precede fulfillment bounds',
            );

            const invalid = await client.query(`SELECT pg_catalog.count(*)::integer AS count
              FROM public."Listing"
              WHERE "shipsWithinDays" IS NOT NULL
                AND ("shipsWithinDays" < 1 OR "shipsWithinDays" > 365)`);
            assert.equal(invalid.rows[0].count, 0,
              'existing Listing shipsWithinDays values violate the reviewed bound');

            const constraint = await client.query(`SELECT convalidated,
              pg_catalog.pg_get_constraintdef(oid) AS definition
              FROM pg_catalog.pg_constraint
              WHERE conrelid = 'public."Listing"'::regclass
                AND conname = 'Listing_ships_within_days_valid_chk'`);
            if (rows.has(migrations[0].name)) {
              assert.equal(constraint.rows.length, 1);
              assert.equal(constraint.rows[0].convalidated, true);
            } else {
              assert.equal(constraint.rows.length, 0);
            }

            const posture = await client.query(postureSql);
            assert.equal(posture.rows.length, 4);
            writeFileSync(`${process.env.RUNNER_TEMP}/order-post-force-posture.json`,
              JSON.stringify(posture.rows), {mode: 0o600, flag: 'wx'});
            appendFileSync(process.env.GITHUB_OUTPUT,
              `bounds=${rows.has(migrations[0].name) ? 'applied' : 'pending'}\n` +
              `custom=${rows.has(migrations[1].name) ? 'applied' : 'pending'}\n`);
          } finally {
            try { await client.query('ROLLBACK'); } catch {}
            await client.end();
          }
          NODE
      - name: Require every predecessor applied and no other pending migration
        shell: bash
        env:
          BOUNDS_STATE: ${{ steps.preflight.outputs.bounds }}
          CUSTOM_STATE: ${{ steps.preflight.outputs.custom }}
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
        run: |
          set -euo pipefail
          bounds=20260930030000_bound_listing_fulfillment_days
          custom=20260930031000_mark_paid_private_listing_sold
          restore() {
            for migration in "$bounds" "$custom"; do
              if [[ -d "$RUNNER_TEMP/$migration" ]]; then
                mv "$RUNNER_TEMP/$migration" "prisma/migrations/$migration"
              fi
            done
          }
          trap restore EXIT
          if [[ "$BOUNDS_STATE" == "pending" ]]; then
            mv "prisma/migrations/$bounds" "$RUNNER_TEMP/$bounds"
          elif [[ "$BOUNDS_STATE" != "applied" ]]; then
            echo "Unexpected fulfillment-bounds migration state" >&2
            exit 1
          fi
          if [[ "$CUSTOM_STATE" == "pending" ]]; then
            mv "prisma/migrations/$custom" "$RUNNER_TEMP/$custom"
          elif [[ "$CUSTOM_STATE" != "applied" ]]; then
            echo "Unexpected private-custom migration state" >&2
            exit 1
          fi
          npx prisma migrate status
          restore
          trap - EXIT
      - name: Apply only the reviewed post-FORCE migrations
        if: >-
          steps.preflight.outputs.bounds == 'pending' ||
          steps.preflight.outputs.custom == 'pending'
        run: npx prisma migrate deploy
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
      - name: Read back exact ledger, schema, authority and unchanged RLS posture
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
        run: |
          node --input-type=module - <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          import pg from 'pg';

          const migrations = new Map([
            ['20260930030000_bound_listing_fulfillment_days',
              'ceef219897013aa84bec0155f23e0ce01d8c48472d6e8bcb166e713d1e4edd96'],
            ['20260930031000_mark_paid_private_listing_sold',
              '0a1cb4828cce4d05abf783b12d790c13581fb7698f8063aaeaf92b5fa8c6bee1'],
          ]);
          const customSql = readFileSync(
            'prisma/migrations/20260930031000_mark_paid_private_listing_sold/migration.sql',
            'utf8',
          );
          const delimiter = '$grainline_stripe_checkout_order_create$';
          const bodyStart = customSql.indexOf(`AS ${delimiter}`) + `AS ${delimiter}`.length;
          const expectedSource = customSql.slice(
            bodyStart,
            customSql.indexOf(`${delimiter};`, bodyStart),
          );
          const before = JSON.parse(readFileSync(
            `${process.env.RUNNER_TEMP}/order-post-force-posture.json`, 'utf8'));
          const client = new pg.Client({connectionString: process.env.DIRECT_URL});
          const postureSql = `
            SELECT relation.relname AS table_name,
                   relation.relrowsecurity AS rls_enabled,
                   relation.relforcerowsecurity AS force_enabled,
                   relation.relacl::text AS table_acl,
                   COALESCE((
                     SELECT jsonb_agg(jsonb_build_object(
                       'name', policy.polname,
                       'command', policy.polcmd,
                       'permissive', policy.polpermissive,
                       'roles', policy.polroles::text,
                       'using', pg_catalog.pg_get_expr(policy.polqual, policy.polrelid),
                       'check', pg_catalog.pg_get_expr(policy.polwithcheck, policy.polrelid)
                     ) ORDER BY policy.polname)
                       FROM pg_catalog.pg_policy AS policy
                      WHERE policy.polrelid = relation.oid
                   ), '[]'::jsonb) AS policies
              FROM pg_catalog.pg_class AS relation
             WHERE relation.oid = ANY(ARRAY[
               'public."Listing"'::regclass,
               'public."Order"'::regclass,
               'public."OrderItem"'::regclass,
               'public."OrderShippingRateQuote"'::regclass
             ])
             ORDER BY relation.relname`;
          try {
            await client.connect();
            await client.query('BEGIN READ ONLY');
            const ledger = await client.query(`SELECT migration_name, checksum,
              finished_at, rolled_back_at, applied_steps_count
              FROM public._prisma_migrations
              WHERE migration_name = ANY($1::text[]) ORDER BY migration_name`,
              [[...migrations.keys()]]);
            assert.equal(ledger.rows.length, migrations.size);
            for (const row of ledger.rows) {
              assert.equal(row.checksum, migrations.get(row.migration_name));
              assert.ok(row.finished_at);
              assert.equal(row.rolled_back_at, null);
              assert.equal(Number(row.applied_steps_count), 1);
            }

            const invalid = await client.query(`SELECT pg_catalog.count(*)::integer AS count
              FROM public."Listing"
              WHERE "shipsWithinDays" IS NOT NULL
                AND ("shipsWithinDays" < 1 OR "shipsWithinDays" > 365)`);
            assert.equal(invalid.rows[0].count, 0);
            const constraint = await client.query(`SELECT convalidated,
              pg_catalog.pg_get_constraintdef(oid) AS definition
              FROM pg_catalog.pg_constraint
              WHERE conrelid = 'public."Listing"'::regclass
                AND conname = 'Listing_ships_within_days_valid_chk'`);
            assert.equal(constraint.rows.length, 1);
            assert.equal(constraint.rows[0].convalidated, true);
            assert.match(constraint.rows[0].definition,
              /shipsWithinDays.*>= 1.*shipsWithinDays.*<= 365/);

            const authority = await client.query(`SELECT procedure.prosrc,
              pg_catalog.pg_get_userbyid(procedure.proowner) AS owner,
              procedure.provolatile, procedure.prosecdef, procedure.proconfig,
              pg_catalog.has_function_privilege(
                'grainline_app_runtime', procedure.oid, 'EXECUTE') AS runtime_execute,
              EXISTS (SELECT 1 FROM pg_catalog.aclexplode(COALESCE(procedure.proacl,
                pg_catalog.acldefault('f', procedure.proowner))) AS acl
                WHERE acl.grantee = 0 AND acl.privilege_type = 'EXECUTE') AS public_execute
              FROM pg_catalog.pg_proc AS procedure
              WHERE procedure.oid =
                'public.grainline_stripe_checkout_order_create(text,bigint,text,text,timestamp without time zone,jsonb)'::regprocedure`);
            assert.equal(authority.rows.length, 1);
            assert.equal(authority.rows[0].prosrc, expectedSource);
            assert.equal(authority.rows[0].owner, 'neondb_owner');
            assert.equal(authority.rows[0].provolatile, 'v');
            assert.equal(authority.rows[0].prosecdef, true);
            assert.deepEqual(authority.rows[0].proconfig, ['search_path=pg_catalog']);
            assert.equal(authority.rows[0].runtime_execute, true);
            assert.equal(authority.rows[0].public_execute, false);

            const after = await client.query(postureSql);
            assert.deepEqual(after.rows, before);
          } finally {
            try { await client.query('ROLLBACK'); } catch {}
            await client.end();
          }
          NODE
