name: Order zero-direct toolchain attestation

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/order-zero-direct-toolchain-attestation.yml'
      - '.github/workflows/order-zero-direct-production.yml'
      - 'scripts/order-zero-direct-toolchain-attestation.mjs'
      - 'scripts/order-zero-direct-toolchain-preflight.mjs'
      - 'docs/order-toolchain-variable-candidates-20260923.json'
      - 'docs/order-handoff-toolchain-pins.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/order-zero-direct-toolchain-attestation.yml'
      - '.github/workflows/order-zero-direct-production.yml'
      - 'scripts/order-zero-direct-toolchain-attestation.mjs'
      - 'scripts/order-zero-direct-toolchain-preflight.mjs'
      - 'docs/order-toolchain-variable-candidates-20260923.json'
      - 'docs/order-handoff-toolchain-pins.json'

permissions:
  contents: read

jobs:
  attest:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          architecture: x64
          check-latest: false
          package-manager-cache: false
          token: ''
      - name: Attest hosted Node/npm placement and bytes
        run: node scripts/order-zero-direct-toolchain-attestation.mjs
