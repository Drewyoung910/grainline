name: Blocked Checkout Refund Witness Inventory Production

on:
  workflow_dispatch:
    inputs:
      release_commit:
        description: Exact reviewed main commit
        required: true
        type: string
      main_ci_run_id:
        description: Successful full push CI run for that exact main commit
        required: true
        type: string
      confirmation:
        description: Type run-read-only-blocked-checkout-refund-witness-inventory
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: production-database-inspections
  cancel-in-progress: false

jobs:
  inspect:
    name: Inventory blocked-checkout witness backfill read-only
    if: >-
      github.repository == 'Drewyoung910/grainline' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      github.run_attempt == 1 &&
      inputs.confirmation == 'run-read-only-blocked-checkout-refund-witness-inventory'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: Production
    env:
      MIGRATION_DB_ROLE: neondb_owner
      PRODUCTION_MIGRATION_CONFIRM: run-reviewed-production-migrations-from-main
      PRODUCTION_MIGRATION_DIRECT_URL_SHA256: ${{ vars.PRODUCTION_MIGRATION_DIRECT_URL_SHA256 }}
      PRODUCTION_MIGRATION_RELEASE_COMMIT: ${{ inputs.release_commit }}
      RUNTIME_DB_ROLE: grainline_app_runtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.2"
          architecture: x64
          check-latest: false
          package-manager-cache: false
          token: ""
      - run: npm ci --ignore-scripts
      - name: Bind inspection to exact main and completed push CI
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          REVIEWED_RELEASE_COMMIT: ${{ inputs.release_commit }}
          REVIEWED_MAIN_CI_RUN_ID: ${{ inputs.main_ci_run_id }}
        with:
          script: |
            const sha = process.env.REVIEWED_RELEASE_COMMIT;
            const value = process.env.REVIEWED_MAIN_CI_RUN_ID;
            if (!/^[0-9a-f]{40}$/.test(sha ?? '') || sha !== context.sha ||
                !/^[1-9][0-9]{0,19}$/.test(value ?? '')) {
              throw new Error('Blocked-checkout witness inventory binding drifted');
            }
            const runId = Number(value);
            if (!Number.isSafeInteger(runId)) throw new Error('CI run id is unsafe');
            const [{data: main}, {data: run}] = await Promise.all([
              github.rest.repos.getBranch({...context.repo, branch: 'main'}),
              github.rest.actions.getWorkflowRun({...context.repo, run_id: runId}),
            ]);
            if (main.commit.sha !== sha || run.name !== 'CI' ||
                run.event !== 'push' || run.head_branch !== 'main' ||
                run.head_sha !== sha || run.status !== 'completed' ||
                run.conclusion !== 'success') {
              throw new Error('Blocked-checkout witness inventory main/CI readback drifted');
            }
            const exactPushRuns = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              {...context.repo, branch: 'main', event: 'push', head_sha: sha, per_page: 100},
            );
            const latestByWorkflow = new Map();
            for (const exactRun of exactPushRuns) {
              if (exactRun.head_sha !== sha || exactRun.head_branch !== 'main' ||
                  exactRun.event !== 'push') continue;
              const key = exactRun.path || exactRun.name;
              const previous = latestByWorkflow.get(key);
              if (!previous || Number(exactRun.id) > Number(previous.id)) {
                latestByWorkflow.set(key, exactRun);
              }
            }
            const required = new Set([
              '.github/workflows/ci.yml',
              '.github/workflows/account-deletion-worker-bootstrap-proof.yml',
              '.github/workflows/order-staff-bootstrap-proof.yml',
              '.github/workflows/order-paid-repair-lock-proof.yml',
              '.github/workflows/order-account-deletion-concurrency-proof.yml',
            ]);
            const missing = [...required].filter((path) => !latestByWorkflow.has(path));
            if (missing.length !== 0) {
              throw new Error(`Required exact-main push workflows are absent: ${missing.join(', ')}`);
            }
            const unacceptable = [...latestByWorkflow.values()].filter((exactRun) =>
              exactRun.status !== 'completed' || exactRun.conclusion !== 'success');
            if (unacceptable.length !== 0) {
              throw new Error(`Exact-main push workflows are not all green: ${unacceptable
                .map((exactRun) => `${exactRun.name}:${exactRun.status}/${exactRun.conclusion}`)
                .join(', ')}`);
            }
      - name: Verify exact aggregate-only inventory source and behavior
        shell: bash
        run: |
          set -euo pipefail
          echo "b0aeb747fff4c627c09077e853ab91392378e6afdea2dbab25f45f81f3ca4828  scripts/blocked-checkout-refund-witness-production-inventory.sql" \
            | sha256sum --check --status
          echo "848f8843ea59e9cb4d1da303f4d6fcef7dc83d28bd9573bade5c9efd971a0f06  scripts/blocked-checkout-refund-witness-production-inventory.mjs" \
            | sha256sum --check --status
          node --test tests/blocked-checkout-refund-witness-production.test.mjs
      - name: Verify owner connection boundary
        run: node scripts/guard-production-migration-runner.mjs
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
      - name: Run aggregate-only blocked-checkout witness inventory read-only
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
          BLOCKED_CHECKOUT_WITNESS_INVENTORY_CONFIRM: read-only-blocked-checkout-refund-witness-inventory
          BLOCKED_CHECKOUT_WITNESS_INVENTORY_EVIDENCE_PATH: ${{ runner.temp }}/blocked-checkout-refund-witness-inventory.json
          BLOCKED_CHECKOUT_WITNESS_INVENTORY_RELEASE_COMMIT: ${{ inputs.release_commit }}
        run: node scripts/blocked-checkout-refund-witness-production-inventory.mjs
      - name: Preserve private-safe aggregate inventory evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: blocked-checkout-refund-witness-inventory-${{ github.run_id }}
          path: ${{ runner.temp }}/blocked-checkout-refund-witness-inventory.json
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: false
