name: Core Order FORCE production (protected)

on:
  workflow_dispatch:
    inputs:
      release_commit:
        description: Exact reviewed main commit
        required: true
        type: string
      main_ci_run_id:
        description: Successful full push CI run for that exact main commit
        required: true
        type: string
      runtime_lock_run_id:
        description: Successful Order item/quote runtime-lock Production run
        required: true
        type: string
      production_deployment_id:
        description: Exact live zero-direct Order deployment
        required: true
        type: string
      confirmation:
        description: Type force-reviewed-core-order-rls
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: production-database-migrations
  cancel-in-progress: false

jobs:
  force_core_order:
    name: Force policyless Core Order RLS
    if: >-
      github.repository == 'Drewyoung910/grainline' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      github.run_attempt == 1 &&
      inputs.confirmation == 'force-reviewed-core-order-rls'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: Production
    env:
      MIGRATION_DB_ROLE: neondb_owner
      PRODUCTION_MIGRATION_CONFIRM: run-reviewed-production-migrations-from-main
      PRODUCTION_MIGRATION_DIRECT_URL_SHA256: ${{ vars.PRODUCTION_MIGRATION_DIRECT_URL_SHA256 }}
      PRODUCTION_MIGRATION_RELEASE_COMMIT: ${{ inputs.release_commit }}
      RUNTIME_DB_ROLE: grainline_app_runtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.2"
          architecture: x64
          check-latest: false
          package-manager-cache: false
          token: ""
      - run: npm ci --ignore-scripts
      - name: Bind FORCE to exact main, CI, and completed runtime lock
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          REVIEWED_RELEASE_COMMIT: ${{ inputs.release_commit }}
          REVIEWED_MAIN_CI_RUN_ID: ${{ inputs.main_ci_run_id }}
          REVIEWED_RUNTIME_LOCK_RUN_ID: ${{ inputs.runtime_lock_run_id }}
          REVIEWED_PRODUCTION_DEPLOYMENT_ID: ${{ inputs.production_deployment_id }}
        with:
          script: |
            const sha = process.env.REVIEWED_RELEASE_COMMIT;
            const ciValue = process.env.REVIEWED_MAIN_CI_RUN_ID;
            const lockValue = process.env.REVIEWED_RUNTIME_LOCK_RUN_ID;
            const deploymentId = process.env.REVIEWED_PRODUCTION_DEPLOYMENT_ID;
            if (!/^[0-9a-f]{40}$/.test(sha ?? '') || sha !== context.sha ||
                !/^[1-9][0-9]{0,19}$/.test(ciValue ?? '') ||
                !/^[1-9][0-9]{0,19}$/.test(lockValue ?? '') ||
                !/^dpl_[A-Za-z0-9]{20,64}$/.test(deploymentId ?? '')) {
              throw new Error('Core Order FORCE binding drifted');
            }
            const ciRunId = Number(ciValue);
            const lockRunId = Number(lockValue);
            if (!Number.isSafeInteger(ciRunId) || !Number.isSafeInteger(lockRunId)) {
              throw new Error('Core Order FORCE run id is unsafe');
            }
            const [{data: main}, {data: ci}, {data: runtimeLock}] = await Promise.all([
              github.rest.repos.getBranch({...context.repo, branch: 'main'}),
              github.rest.actions.getWorkflowRun({...context.repo, run_id: ciRunId}),
              github.rest.actions.getWorkflowRun({...context.repo, run_id: lockRunId}),
            ]);
            if (main.commit.sha !== sha ||
                ci.name !== 'CI' || ci.event !== 'push' ||
                ci.head_branch !== 'main' || ci.head_sha !== sha ||
                ci.status !== 'completed' || ci.conclusion !== 'success' ||
                runtimeLock.name !== 'Order Item and Shipping Quote Runtime Lock Production' ||
                runtimeLock.event !== 'workflow_dispatch' ||
                runtimeLock.head_branch !== 'main' ||
                runtimeLock.status !== 'completed' || runtimeLock.conclusion !== 'success') {
              throw new Error('Core Order FORCE main/run readback drifted');
            }
      - name: Verify live zero-direct application boundary
        env:
          REVIEWED_PRODUCTION_DEPLOYMENT_ID: ${{ inputs.production_deployment_id }}
        run: node scripts/verify-order-email-free-deployment-surface.mjs
      - name: Verify exact FORCE release bytes and predecessor boundary
        shell: bash
        run: |
          set -euo pipefail
          latest="$(find prisma/migrations -mindepth 1 -maxdepth 1 -type d -print | LC_ALL=C sort | tail -n 1)"
          test "$latest" = "prisma/migrations/20260929160000_force_order_rls"
          node scripts/verify-order-core-force-release.mjs
      - name: Verify owner connection boundary
        run: node scripts/guard-production-migration-runner.mjs
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
      - name: Read exact predecessor or restart ledger and catalog state
        id: force_scope
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
        run: |
          node --input-type=module - <<'NODE'
          import assert from 'node:assert/strict';
          import {appendFileSync} from 'node:fs';
          import pg from 'pg';
          const releases = Object.freeze({
            enable: Object.freeze({
              name: '20260927090000_enable_order_rls',
              checksum: '350567d0141601fd858dcc2df99f59b085d1f66573560b027148e66278a1eec8',
            }),
            runtimeLock: Object.freeze({
              name: '20260929130000_revoke_order_item_shipping_quote_runtime_access',
              checksum: '32c085b262400201864e6bfb7d32829b886b99a48771f62da141352c1c8bab99',
            }),
            force: Object.freeze({
              name: '20260929160000_force_order_rls',
              checksum: '1f48553466fd1ee0373d48036e5e193cedbb6d4ff094ad1fba753e8c75e7e139',
            }),
          });
          const client = new pg.Client({connectionString: process.env.DIRECT_URL});
          const accepted = (row, release) => row && row.checksum === release.checksum &&
            row.finished_at && row.rolled_back_at === null &&
            Number(row.applied_steps_count) === 1;
          try {
            await client.connect();
            await client.query('BEGIN READ ONLY');
            const ledger = await client.query(`
              SELECT migration_name, checksum, finished_at, rolled_back_at,
                     applied_steps_count
                FROM public._prisma_migrations
               WHERE migration_name = ANY($1::text[])
               ORDER BY migration_name
            `, [Object.values(releases).map(release => release.name)]);
            const rows = new Map(ledger.rows.map(row => [row.migration_name, row]));
            assert.equal(rows.size, ledger.rows.length);
            assert.equal(accepted(rows.get(releases.enable.name), releases.enable), true);
            assert.equal(accepted(rows.get(releases.runtimeLock.name), releases.runtimeLock), true);
            const forceRow = rows.get(releases.force.name);
            if (forceRow) assert.equal(accepted(forceRow, releases.force), true);
            assert.equal(ledger.rows.length, forceRow ? 3 : 2);
            const state = forceRow ? 'restart' : 'predecessor';
            const order = await client.query(`
              SELECT pg_catalog.pg_get_userbyid(class.relowner) AS owner,
                     class.relrowsecurity AS enabled,
                     class.relforcerowsecurity AS forced,
                     (SELECT count(*)::integer FROM pg_catalog.pg_policy AS policy
                       WHERE policy.polrelid = class.oid) AS policy_count,
                     pg_catalog.has_table_privilege(
                       'grainline_app_runtime', class.oid,
                       'SELECT,INSERT,UPDATE,DELETE,TRUNCATE,REFERENCES,TRIGGER'
                     ) AS runtime_table,
                     pg_catalog.has_any_column_privilege(
                       'grainline_app_runtime', class.oid,
                       'SELECT,INSERT,UPDATE,REFERENCES'
                     ) AS runtime_column,
                     (
                       (SELECT count(*)
                          FROM pg_catalog.aclexplode(
                            COALESCE(class.relacl,
                                     pg_catalog.acldefault('r', class.relowner))
                          ) AS acl
                         WHERE acl.grantee <> class.relowner
                           AND acl.privilege_type IN (
                             'SELECT','INSERT','UPDATE','DELETE',
                             'TRUNCATE','REFERENCES','TRIGGER'
                           ))
                       +
                       (SELECT count(*)
                          FROM pg_catalog.pg_attribute AS attribute
                          CROSS JOIN LATERAL
                            pg_catalog.aclexplode(attribute.attacl) AS acl
                         WHERE attribute.attrelid = class.oid
                           AND attribute.attnum > 0
                           AND NOT attribute.attisdropped
                           AND acl.grantee <> class.relowner
                           AND acl.privilege_type IN (
                             'SELECT','INSERT','UPDATE','REFERENCES'
                           ))
                     )::integer AS invalid_acl_count
                FROM pg_catalog.pg_class AS class
               WHERE class.oid = 'public."Order"'::regclass
            `);
            assert.deepEqual(order.rows, [{
              owner: 'neondb_owner', enabled: true, forced: state === 'restart',
              policy_count: 0, runtime_table: false, runtime_column: false,
              invalid_acl_count: 0,
            }]);
            const children = await client.query(`
              SELECT class.relname AS table_name,
                     class.relrowsecurity AS enabled,
                     class.relforcerowsecurity AS forced,
                     (SELECT count(*)::integer FROM pg_catalog.pg_policy AS policy
                       WHERE policy.polrelid = class.oid) AS policy_count,
                     pg_catalog.has_table_privilege(
                       'grainline_app_runtime', class.oid,
                       'SELECT,INSERT,UPDATE,DELETE,TRUNCATE,REFERENCES,TRIGGER'
                     ) AS runtime_table,
                     pg_catalog.has_any_column_privilege(
                       'grainline_app_runtime', class.oid,
                       'SELECT,INSERT,UPDATE,REFERENCES'
                     ) AS runtime_column,
                     (
                       (SELECT count(*)
                          FROM pg_catalog.aclexplode(
                            COALESCE(class.relacl,
                                     pg_catalog.acldefault('r', class.relowner))
                          ) AS acl
                         WHERE acl.grantee <> class.relowner
                           AND acl.privilege_type IN (
                             'SELECT','INSERT','UPDATE','DELETE',
                             'TRUNCATE','REFERENCES','TRIGGER'
                           ))
                       +
                       (SELECT count(*)
                          FROM pg_catalog.pg_attribute AS attribute
                          CROSS JOIN LATERAL
                            pg_catalog.aclexplode(attribute.attacl) AS acl
                         WHERE attribute.attrelid = class.oid
                           AND attribute.attnum > 0
                           AND NOT attribute.attisdropped
                           AND acl.grantee <> class.relowner
                           AND acl.privilege_type IN (
                             'SELECT','INSERT','UPDATE','REFERENCES'
                           ))
                     )::integer AS invalid_acl_count
                FROM pg_catalog.pg_class AS class
               WHERE class.oid = ANY(ARRAY[
                 'public."OrderItem"'::regclass,
                 'public."OrderShippingRateQuote"'::regclass
               ])
               ORDER BY class.relname
            `);
            assert.deepEqual(children.rows, [
              {table_name: 'OrderItem', enabled: false, forced: false,
                policy_count: 0, runtime_table: false, runtime_column: false,
                invalid_acl_count: 0},
              {table_name: 'OrderShippingRateQuote', enabled: false, forced: false,
                policy_count: 0, runtime_table: false, runtime_column: false,
                invalid_acl_count: 0},
            ]);
            appendFileSync(process.env.GITHUB_OUTPUT, `state=${state}\n`);
          } finally {
            try { await client.query('ROLLBACK'); } catch {}
            await client.end();
          }
          NODE
      - name: Require every predecessor applied and no other pending migration
        shell: bash
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
          FORCE_STATE: ${{ steps.force_scope.outputs.state }}
        run: |
          set -euo pipefail
          migration=20260929160000_force_order_rls
          if [[ "$FORCE_STATE" == "predecessor" ]]; then
            holding="$RUNNER_TEMP/$migration"
            mv "prisma/migrations/$migration" "$holding"
            trap 'if [[ -d "$holding" ]]; then mv "$holding" "prisma/migrations/$migration"; fi' EXIT
            npx prisma migrate status
            mv "$holding" "prisma/migrations/$migration"
            trap - EXIT
          elif [[ "$FORCE_STATE" == "restart" ]]; then
            npx prisma migrate status
          else
            echo "Unexpected Core Order FORCE state" >&2
            exit 1
          fi
      - name: Apply only Core Order FORCE
        if: steps.force_scope.outputs.state == 'predecessor'
        run: npx prisma migrate deploy
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
      - name: Verify FORCE ledger and owner-visible posture
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
        run: |
          node --input-type=module - <<'NODE'
          import assert from 'node:assert/strict';
          import pg from 'pg';
          const migration = '20260929160000_force_order_rls';
          const checksum = '1f48553466fd1ee0373d48036e5e193cedbb6d4ff094ad1fba753e8c75e7e139';
          const client = new pg.Client({connectionString: process.env.DIRECT_URL});
          try {
            await client.connect();
            await client.query('BEGIN READ ONLY');
            const ledger = await client.query(`SELECT checksum, finished_at, rolled_back_at,
              applied_steps_count FROM public._prisma_migrations WHERE migration_name = $1`, [migration]);
            assert.equal(ledger.rows.length, 1);
            assert.equal(ledger.rows[0].checksum, checksum);
            assert.ok(ledger.rows[0].finished_at);
            assert.equal(ledger.rows[0].rolled_back_at, null);
            assert.equal(Number(ledger.rows[0].applied_steps_count), 1);
            const posture = await client.query(`
              SELECT current_user::text AS actor, session_user::text AS login,
                     pg_catalog.pg_get_userbyid(class.relowner) AS owner,
                     class.relrowsecurity AS enabled,
                     class.relforcerowsecurity AS forced,
                     (SELECT count(*)::integer FROM pg_catalog.pg_policy AS policy
                       WHERE policy.polrelid = class.oid) AS policy_count,
                     pg_catalog.has_table_privilege(
                       'grainline_app_runtime', class.oid,
                       'SELECT,INSERT,UPDATE,DELETE,TRUNCATE,REFERENCES,TRIGGER'
                     ) AS runtime_table,
                     pg_catalog.has_any_column_privilege(
                       'grainline_app_runtime', class.oid,
                       'SELECT,INSERT,UPDATE,REFERENCES'
                     ) AS runtime_column,
                     (
                       (SELECT count(*)
                          FROM pg_catalog.aclexplode(
                            COALESCE(class.relacl,
                                     pg_catalog.acldefault('r', class.relowner))
                          ) AS acl
                         WHERE acl.grantee <> class.relowner
                           AND acl.privilege_type IN (
                             'SELECT','INSERT','UPDATE','DELETE',
                             'TRUNCATE','REFERENCES','TRIGGER'
                           ))
                       +
                       (SELECT count(*)
                          FROM pg_catalog.pg_attribute AS attribute
                          CROSS JOIN LATERAL
                            pg_catalog.aclexplode(attribute.attacl) AS acl
                         WHERE attribute.attrelid = class.oid
                           AND attribute.attnum > 0
                           AND NOT attribute.attisdropped
                           AND acl.grantee <> class.relowner
                           AND acl.privilege_type IN (
                             'SELECT','INSERT','UPDATE','REFERENCES'
                           ))
                     )::integer AS invalid_acl_count
                FROM pg_catalog.pg_class AS class
               WHERE class.oid = 'public."Order"'::regclass
            `);
            assert.deepEqual(posture.rows, [{
              actor: 'neondb_owner', login: 'neondb_owner', owner: 'neondb_owner',
              enabled: true, forced: true, policy_count: 0,
              runtime_table: false, runtime_column: false,
              invalid_acl_count: 0,
            }]);
          } finally {
            try { await client.query('ROLLBACK'); } catch {}
            await client.end();
          }
          NODE
      - name: Audit post-FORCE runtime grants and global RLS catalog
        run: npm run audit:db-grants -- --require-direct-url
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
      - name: Verify final Prisma migration status
        run: npx prisma migrate status
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
