name: Conversation and Message RLS FORCE Proof

on:
  push:
    branches:
      - agent/conversation-message-force-20260726
      - main
    paths:
      - .github/workflows/conversation-message-force-proof.yml
      - package.json
      - package-lock.json
      - prisma/**
      - scripts/audit-runtime-db-grants.mjs
      - scripts/conversation-message-force-rollback-proof.mjs
      - scripts/conversation-message-recipient-rls-proof.mjs
      - scripts/guard-saved-search-rls-deploy.mjs
      - scripts/prepare-ci-rls-runtime-role.sql
      - scripts/provision-direct-upload-cleanup-role.sql
      - scripts/provision-runtime-db-role.sql
      - scripts/verify-conversation-message-activation-release.mjs
      - scripts/verify-conversation-message-force-release.mjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: grainline_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d grainline_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/grainline_ci?sslmode=disable
      DIRECT_URL: postgresql://ci:ci@localhost:5432/grainline_ci?sslmode=disable
      CONVERSATION_MESSAGE_FORCE_ROLLBACK_PROOF_DATABASE_URL: postgresql://ci:ci@localhost:5432/grainline_ci?sslmode=disable
      CONVERSATION_MESSAGE_RECIPIENT_RLS_PROOF_DATABASE_URL: postgresql://ci:ci@localhost:5432/grainline_ci?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prisma generate
      - name: Verify committed Conversation and Message activation release
        run: npm run audit:rls-conversation-message-activation-release
      - name: Verify committed Conversation and Message FORCE release
        run: npm run audit:rls-conversation-message-force-release
      - name: Prepare CI runtime policy role
        run: psql "$DIRECT_URL" -f scripts/prepare-ci-rls-runtime-role.sql
      - name: Prove runtime-role provisioning refusals exit nonzero
        run: |
          if psql "$DIRECT_URL" -v runtime_role=ci -v migration_role=ci -f scripts/provision-runtime-db-role.sql; then
            echo "runtime-role provisioning unexpectedly accepted the migration owner as runtime"
            exit 1
          fi
      - name: Isolate Production-owner Order buyer correction from historical proof
        shell: bash
        run: |
          set -euo pipefail
          migration=20260905180000_correct_order_banned_buyer_completion
          printf '%s  %s\n' \
            '2eaaada2dfa9f9ce4e6b28e43542cb0a1220e191847b3d518da8b50ebc2b4228' \
            "prisma/migrations/$migration/migration.sql" | sha256sum --check --status
          mv "prisma/migrations/$migration" "$RUNNER_TEMP/$migration"
      - name: Isolate reviewed Order release successors from historical proof
        shell: bash
        run: |
          set -euo pipefail
          while read -r digest migration; do
            printf '%s  %s\n' \
              "$digest" \
              "prisma/migrations/$migration/migration.sql" | sha256sum --check --status
            mv "prisma/migrations/$migration" "$RUNNER_TEMP/$migration"
          done <<'MIGRATIONS'
          6e835d8da110ee53384d1afd898fe0e02a8c9679f48be24a43557173b3651987 20260926010000_correct_order_provider_terminal_reconciliation
          757d579c6ac61a9a3d5b434eb9421c1da2dad24d8051c08b61ce2e2850bb4b36 20260926011000_correct_order_paid_checkout_bound_reservation
          de3db869562e4cdbe411efb1652f0cefb2f2a9687a079e15e84b70aaeb740263 20260926012000_correct_order_seller_deauthorization_fulfillment
          75b2c6d00f9f7996c6140a57adbcc91f207cf96e2c495478fb21a9a633f0b29f 20260926012100_correct_order_seller_deauthorization_label
          4b8ed62faa14d9fa32c57c0045847357d04c16889f9a1d2e3b83633a1c482578 20260926012200_correct_order_seller_deauthorization_projection
          f66b5314f6116a2900b06c98e0a5cb0236684ab8c0c712e5d6059a758571ae61 20260926012300_retire_legacy_checkout_reservation_creators
          a92fbcbc6c809e51a14cf53c7b98958693c327040565a64929c4527ff56b112f 20260928010000_correct_order_deauthorized_case_access
          33a6d19fd0e50345bab11fa4c1a5a686aa72768d96db2a4cb9bce80ec7cd521b 20260928020000_correct_order_label_sender_contact
          b9b0540de736daa01e8ac15f4fa41af3dd5ae8ffe4d5153aa2487a972b7b6c66 20260928213000_remove_seller_buyer_email_projection
          3a1f173fac0293ec05c43b44e9cd2a6895dcdd47effce55236e7e7c7a55fb799 20260928220000_retire_seller_buyer_email_projection_predecessors
          32c085b262400201864e6bfb7d32829b886b99a48771f62da141352c1c8bab99 20260929130000_revoke_order_item_shipping_quote_runtime_access
          1f48553466fd1ee0373d48036e5e193cedbb6d4ff094ad1fba753e8c75e7e139 20260929160000_force_order_rls
          ceef219897013aa84bec0155f23e0ce01d8c48472d6e8bcb166e713d1e4edd96 20260930030000_bound_listing_fulfillment_days
          0a1cb4828cce4d05abf783b12d790c13581fb7698f8063aaeaf92b5fa8c6bee1 20260930031000_mark_paid_private_listing_sold
          dc1cdbf14a5b126635af44fbbc4ca820ac16e46823a68071400fd5786110209d 20260930032000_block_checkout_user_pairs
          ed5e069248281ef8738f97bd0480ee77b85044a4ad2c9ac433ef2840a2a7e941 20260930033000_order_ops_health_summary
          555e26acc3c9d6361d629d86225b63177667363de4ac299c37696072504a9799 20260930040000_prepare_order_dispute_recovery
          928413764a087ef5f535f99ed993c85da0a528767e26a89d2faf791eb9c29d17 20261001030000_enable_order_item_rls
          c741c53d20d5f6dc55c9b29e55d5c0ecf7a69b1d0e052c41b81279f37aeecac9 20261001040000_force_order_item_rls
          450e4c100b1711139b165765b6a170accf515abad7d14a141cbb95621b1fcbd4 20261001050000_enable_order_shipping_rate_quote_rls
          390a307431fdc02c18af3daf8fc3d1ee7b34d2df84784379a523580c60f16d5a 20261001060000_force_order_shipping_rate_quote_rls
          68e559e01dbeae663931110dcadfd4d42ca050c788eebd647727f434a9a72dba 20261001070000_prepare_case_refund_provider_recovery
          48703a338824b827b96231cce7e45f305ed0b106244743fdceb399a80ffecfbe 20261002010000_allow_partial_refund_fulfillment
          dad13cbbaf2de845c591c0f8000a21d5d19ba7c19ccf61c9179ca92b4524a8ce 20261002020000_correct_case_refund_provider_recovery_continuity
          a648437f13d93e1673f64935d381630e6ec2b19e7633c33837e88938240ef5c7 20261002030000_preserve_order_shipping_dispute_evidence
          a28a86aeec3084e4a41341d415fd1fd98446d32939f0fe55d0e53d5e27d8dece 20261002160000_add_user_email_suppression_key_index
          4b058ca847eac24428f8bd4733ed81fed26c6aa138437740e18c58da80bb2933 20261002170000_prepare_user_email_address_authority
          b64751439f75fce70850ab43446c35ce6df45301b2a03970b560306898df1f2e 20261003010000_repair_user_email_address_current_history
          MIGRATIONS
      - name: Isolate staged Core Order ENABLE from historical proof
        shell: bash
        run: |
          set -euo pipefail
          migration=20260927090000_enable_order_rls
          printf '%s  %s\n' \
            '350567d0141601fd858dcc2df99f59b085d1f66573560b027148e66278a1eec8' \
            "prisma/migrations/$migration/migration.sql" | sha256sum --check --status
          mv "prisma/migrations/$migration" "$RUNNER_TEMP/$migration"
      - name: Isolate DirectUpload activation until external grants converge
        run: >-
          mv
          prisma/migrations/20260801194000_enable_direct_upload_rls
          "$RUNNER_TEMP/direct-upload-activation-release"
      - name: Apply compatible migrations including Conversation and Message FORCE
        run: npx prisma migrate deploy
      - name: Converge pre-activation production-style runtime grants
        run: psql "$DIRECT_URL" -v runtime_role=grainline_app_runtime -v migration_role=ci -f scripts/provision-runtime-db-role.sql
      - name: Converge pre-activation DirectUpload cleanup-worker grants
        run: psql "$DIRECT_URL" -v cleanup_role=grainline_direct_upload_cleanup_v2 -v runtime_role=grainline_app_runtime -v migration_role=ci -f scripts/provision-direct-upload-cleanup-role.sql
      - name: Restore exact DirectUpload activation
        run: >-
          mv
          "$RUNNER_TEMP/direct-upload-activation-release"
          prisma/migrations/20260801194000_enable_direct_upload_rls
      - name: Apply current migrations including DirectUpload activation
        run: npx prisma migrate deploy
      - name: Reconverge activated production-style runtime grants
        run: psql "$DIRECT_URL" -v runtime_role=grainline_app_runtime -v migration_role=ci -f scripts/provision-runtime-db-role.sql
      - name: Reconverge activated DirectUpload cleanup-worker grants
        run: psql "$DIRECT_URL" -v cleanup_role=grainline_direct_upload_cleanup_v2 -v runtime_role=grainline_app_runtime -v migration_role=ci -f scripts/provision-direct-upload-cleanup-role.sql
      - name: Verify migration status
        run: npx prisma migrate status
      - name: Audit exact FORCE-hardened grants and policy catalog
        run: GRANT_AUDIT_DATABASE_URL="$DIRECT_URL" RUNTIME_DB_ROLE=grainline_app_runtime MIGRATION_DB_ROLE=ci npm run audit:db-grants -- --allow-loopback-ci
      - name: Prove database-first Conversation and Message FORCE rollback
        run: npm run audit:rls-conversation-message-force-rollback
      - name: Prove FORCE-hardened Conversation and Message authority
        run: npm run audit:rls-conversation-message-recipient
      - name: Restore reviewed Order release successors
        shell: bash
        run: |
          set -euo pipefail
          for migration in \
            20260926010000_correct_order_provider_terminal_reconciliation \
            20260926011000_correct_order_paid_checkout_bound_reservation \
            20260926012000_correct_order_seller_deauthorization_fulfillment \
            20260926012100_correct_order_seller_deauthorization_label \
            20260926012200_correct_order_seller_deauthorization_projection \
            20260926012300_retire_legacy_checkout_reservation_creators \
            20260928010000_correct_order_deauthorized_case_access \
            20260928020000_correct_order_label_sender_contact \
            20260928213000_remove_seller_buyer_email_projection \
            20260928220000_retire_seller_buyer_email_projection_predecessors \
            20260929130000_revoke_order_item_shipping_quote_runtime_access \
            20260929160000_force_order_rls \
            20260930030000_bound_listing_fulfillment_days \
            20260930031000_mark_paid_private_listing_sold \
            20260930032000_block_checkout_user_pairs \
            20260930033000_order_ops_health_summary \
            20260930040000_prepare_order_dispute_recovery \
            20261001030000_enable_order_item_rls \
            20261001040000_force_order_item_rls \
            20261001050000_enable_order_shipping_rate_quote_rls \
            20261001060000_force_order_shipping_rate_quote_rls \
            20261001070000_prepare_case_refund_provider_recovery \
            20261002010000_allow_partial_refund_fulfillment \
            20261002020000_correct_case_refund_provider_recovery_continuity \
            20261002030000_preserve_order_shipping_dispute_evidence \
            20261002160000_add_user_email_suppression_key_index \
            20261002170000_prepare_user_email_address_authority \
            20261003010000_repair_user_email_address_current_history
          do
            mv "$RUNNER_TEMP/$migration" "prisma/migrations/$migration"
          done
      - name: Restore reviewed Production-owner Order buyer correction
        run: >-
          mv
          "$RUNNER_TEMP/20260905180000_correct_order_banned_buyer_completion"
          prisma/migrations/20260905180000_correct_order_banned_buyer_completion
      - name: Restore staged Core Order ENABLE
        run: >-
          mv
          "$RUNNER_TEMP/20260927090000_enable_order_rls"
          prisma/migrations/20260927090000_enable_order_rls
