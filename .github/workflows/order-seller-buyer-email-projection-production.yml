name: Order Seller Buyer Email Projection Production

on:
  workflow_dispatch:
    inputs:
      release_commit:
        description: Exact reviewed main commit
        required: true
        type: string
      main_ci_run_id:
        description: Successful full push CI run for that exact main commit
        required: true
        type: string
      confirmation:
        description: Type apply-reviewed-order-seller-buyer-email-projection
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: production-database-migrations
  cancel-in-progress: false

jobs:
  apply:
    name: Apply reviewed seller buyer-email projection
    if: >-
      github.repository == 'Drewyoung910/grainline' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      github.run_attempt == 1 &&
      inputs.confirmation == 'apply-reviewed-order-seller-buyer-email-projection'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: Production
    env:
      MIGRATION_DB_ROLE: neondb_owner
      PRODUCTION_MIGRATION_CONFIRM: run-reviewed-production-migrations-from-main
      PRODUCTION_MIGRATION_DIRECT_URL_SHA256: ${{ vars.PRODUCTION_MIGRATION_DIRECT_URL_SHA256 }}
      PRODUCTION_MIGRATION_RELEASE_COMMIT: ${{ inputs.release_commit }}
      RUNTIME_DB_ROLE: grainline_app_runtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.2"
          architecture: x64
          check-latest: false
          package-manager-cache: false
          token: ""
      - run: npm ci --ignore-scripts
      - name: Verify exact main and completed CI before credential access
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          REVIEWED_RELEASE_COMMIT: ${{ inputs.release_commit }}
          REVIEWED_MAIN_CI_RUN_ID: ${{ inputs.main_ci_run_id }}
        with:
          script: |
            const sha = process.env.REVIEWED_RELEASE_COMMIT;
            const value = process.env.REVIEWED_MAIN_CI_RUN_ID;
            if (!/^[0-9a-f]{40}$/.test(sha ?? '') || sha !== context.sha ||
                !/^[1-9][0-9]{0,19}$/.test(value ?? '')) {
              throw new Error('Order seller buyer-email release binding drifted');
            }
            const runId = Number(value);
            if (!Number.isSafeInteger(runId)) throw new Error('CI run id is unsafe');
            const [{data: main}, {data: run}] = await Promise.all([
              github.rest.repos.getBranch({...context.repo, branch: 'main'}),
              github.rest.actions.getWorkflowRun({...context.repo, run_id: runId}),
            ]);
            if (main.commit.sha !== sha || run.name !== 'CI' ||
                run.event !== 'push' || run.head_branch !== 'main' ||
                run.head_sha !== sha || run.status !== 'completed' ||
                run.conclusion !== 'success') {
              throw new Error('Order seller buyer-email main/CI readback drifted');
            }
      - name: Verify exact migration source
        shell: bash
        run: |
          set -euo pipefail
          latest="$(find prisma/migrations -mindepth 1 -maxdepth 1 -type d -print | LC_ALL=C sort | tail -n 1)"
          test "$latest" = "prisma/migrations/20260928213000_remove_seller_buyer_email_projection"
          echo "b9b0540de736daa01e8ac15f4fa41af3dd5ae8ffe4d5153aa2487a972b7b6c66  prisma/migrations/20260928213000_remove_seller_buyer_email_projection/migration.sql" \
            | sha256sum --check --status
          node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --experimental-strip-types --test \
            tests/seller-facing-user-label.test.mjs \
            tests/order-participant-detail-authority-postgres.test.mjs \
            tests/order-seller-analytics-authority-postgres.test.mjs
      - name: Verify owner connection boundary
        run: node scripts/guard-production-migration-runner.mjs
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
      - name: Capture restart state and unchanged Order posture
        id: preflight
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
        run: |
          node --input-type=module - <<'NODE'
          import assert from 'node:assert/strict';
          import {appendFileSync, writeFileSync} from 'node:fs';
          import pg from 'pg';
          const migration = '20260928213000_remove_seller_buyer_email_projection';
          const checksum = 'b9b0540de736daa01e8ac15f4fa41af3dd5ae8ffe4d5153aa2487a972b7b6c66';
          const client = new pg.Client({connectionString: process.env.DIRECT_URL});
          const postureSql = `
            SELECT relation.relname AS table_name,
                   relation.relrowsecurity AS rls_enabled,
                   relation.relforcerowsecurity AS force_enabled,
                   relation.relacl::text AS table_acl,
                   COALESCE((
                     SELECT jsonb_agg(jsonb_build_object(
                       'name', policy.polname,
                       'command', policy.polcmd,
                       'permissive', policy.polpermissive,
                       'roles', policy.polroles::text,
                       'using', pg_catalog.pg_get_expr(policy.polqual, policy.polrelid),
                       'check', pg_catalog.pg_get_expr(policy.polwithcheck, policy.polrelid)
                     ) ORDER BY policy.polname)
                       FROM pg_catalog.pg_policy AS policy
                      WHERE policy.polrelid = relation.oid
                   ), '[]'::jsonb) AS policies
              FROM pg_catalog.pg_class AS relation
             WHERE relation.oid = ANY(ARRAY[
               'public."Order"'::regclass,
               'public."User"'::regclass
             ])
             ORDER BY relation.relname`;
          try {
            await client.connect();
            await client.query('BEGIN READ ONLY');
            const ledger = await client.query(`SELECT checksum, finished_at, rolled_back_at,
              applied_steps_count FROM public._prisma_migrations WHERE migration_name = $1`, [migration]);
            assert.ok(ledger.rows.length === 0 || ledger.rows.length === 1);
            if (ledger.rows.length === 1) {
              const row = ledger.rows[0];
              assert.equal(row.checksum, checksum);
              assert.ok(row.finished_at);
              assert.equal(row.rolled_back_at, null);
              assert.equal(Number(row.applied_steps_count), 1);
            }
            const posture = await client.query(postureSql);
            assert.equal(posture.rows.length, 2);
            writeFileSync(`${process.env.RUNNER_TEMP}/order-seller-buyer-email-pre.json`,
              JSON.stringify(posture.rows), {mode: 0o600, flag: 'wx'});
            appendFileSync(process.env.GITHUB_OUTPUT,
              `state=${ledger.rows.length === 0 ? 'pending' : 'applied'}\n`);
          } finally {
            try { await client.query('ROLLBACK'); } catch {}
            await client.end();
          }
          NODE
      - name: Require every predecessor applied and no other pending migration
        shell: bash
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
          MIGRATION_STATE: ${{ steps.preflight.outputs.state }}
        run: |
          set -euo pipefail
          migration=20260928213000_remove_seller_buyer_email_projection
          if [[ "$MIGRATION_STATE" == "pending" ]]; then
            holding="$RUNNER_TEMP/$migration"
            mv "prisma/migrations/$migration" "$holding"
            trap 'if [[ -d "$holding" ]]; then mv "$holding" "prisma/migrations/$migration"; fi' EXIT
            npx prisma migrate status
            mv "$holding" "prisma/migrations/$migration"
            trap - EXIT
          elif [[ "$MIGRATION_STATE" == "applied" ]]; then
            npx prisma migrate status
          else
            echo "Unexpected Order seller buyer-email migration state" >&2
            exit 1
          fi
      - name: Apply only the reviewed seller buyer-email projection migration
        if: steps.preflight.outputs.state == 'pending'
        run: npx prisma migrate deploy
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
      - name: Read back exact ledger, projections, grants, and unchanged RLS posture
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
        run: |
          node --input-type=module - <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          import pg from 'pg';
          const migration = '20260928213000_remove_seller_buyer_email_projection';
          const checksum = 'b9b0540de736daa01e8ac15f4fa41af3dd5ae8ffe4d5153aa2487a972b7b6c66';
          const sql = readFileSync(`prisma/migrations/${migration}/migration.sql`, 'utf8');
          const identities = new Map([
            ['public.grainline_order_seller_detail_v5(text,text)', 'grainline_order_seller_detail_v5'],
            ['public.grainline_order_seller_recent_sales_v2(text)', 'grainline_order_seller_recent_sales_v2'],
          ]);
          const expectedSources = new Map();
          for (const [identity, name] of identities) {
            const delimiter = `$${name}$`;
            const start = sql.indexOf(`AS ${delimiter}`);
            const end = sql.indexOf(`${delimiter};`, start + delimiter.length);
            assert.ok(start >= 0 && end > start);
            expectedSources.set(identity,
              sql.slice(start + `AS ${delimiter}`.length, end));
          }
          const before = JSON.parse(readFileSync(
            `${process.env.RUNNER_TEMP}/order-seller-buyer-email-pre.json`, 'utf8'));
          const client = new pg.Client({connectionString: process.env.DIRECT_URL});
          const postureSql = `
            SELECT relation.relname AS table_name,
                   relation.relrowsecurity AS rls_enabled,
                   relation.relforcerowsecurity AS force_enabled,
                   relation.relacl::text AS table_acl,
                   COALESCE((
                     SELECT jsonb_agg(jsonb_build_object(
                       'name', policy.polname,
                       'command', policy.polcmd,
                       'permissive', policy.polpermissive,
                       'roles', policy.polroles::text,
                       'using', pg_catalog.pg_get_expr(policy.polqual, policy.polrelid),
                       'check', pg_catalog.pg_get_expr(policy.polwithcheck, policy.polrelid)
                     ) ORDER BY policy.polname)
                       FROM pg_catalog.pg_policy AS policy
                      WHERE policy.polrelid = relation.oid
                   ), '[]'::jsonb) AS policies
              FROM pg_catalog.pg_class AS relation
             WHERE relation.oid = ANY(ARRAY[
               'public."Order"'::regclass,
               'public."User"'::regclass
             ])
             ORDER BY relation.relname`;
          try {
            await client.connect();
            await client.query('BEGIN READ ONLY');
            const ledger = await client.query(`SELECT checksum, finished_at, rolled_back_at,
              applied_steps_count FROM public._prisma_migrations WHERE migration_name = $1`, [migration]);
            assert.equal(ledger.rows.length, 1);
            assert.equal(ledger.rows[0].checksum, checksum);
            assert.ok(ledger.rows[0].finished_at);
            assert.equal(ledger.rows[0].rolled_back_at, null);
            assert.equal(Number(ledger.rows[0].applied_steps_count), 1);
            const functions = await client.query(`
              SELECT expected.identity, procedure.prosrc,
                     pg_catalog.pg_get_userbyid(procedure.proowner) AS owner,
                     procedure.provolatile, procedure.proparallel, procedure.prosecdef,
                     procedure.proconfig,
                     pg_catalog.pg_get_function_result(procedure.oid) AS result_type,
                     pg_catalog.has_function_privilege(
                       'grainline_app_runtime', procedure.oid, 'EXECUTE'
                     ) AS runtime_execute,
                     pg_catalog.has_function_privilege(
                       'public', procedure.oid, 'EXECUTE'
                     ) AS public_execute
                FROM pg_catalog.unnest($1::text[]) AS expected(identity)
                LEFT JOIN pg_catalog.pg_proc AS procedure
                  ON procedure.oid = pg_catalog.to_regprocedure(expected.identity)
               ORDER BY expected.identity
            `, [[...identities.keys()]]);
            assert.equal(functions.rows.length, identities.size);
            for (const row of functions.rows) {
              assert.equal(row.prosrc, expectedSources.get(row.identity));
              assert.equal(row.owner, 'neondb_owner');
              assert.equal(row.provolatile, 's');
              assert.equal(row.proparallel, 's');
              assert.equal(row.prosecdef, true);
              assert.deepEqual(row.proconfig, ['search_path=pg_catalog']);
              assert.equal(row.runtime_execute, true);
              assert.equal(row.public_execute, false);
              assert.match(row.result_type, /buyer_name/);
              assert.doesNotMatch(row.result_type, /buyer_email/);
            }
            const overlap = await client.query(`SELECT
              pg_catalog.has_function_privilege('grainline_app_runtime',
                'public.grainline_order_seller_detail_v4(text,text)', 'EXECUTE') AS detail_v4,
              pg_catalog.has_function_privilege('grainline_app_runtime',
                'public.grainline_order_seller_recent_sales(text)', 'EXECUTE') AS recent_v1`);
            assert.deepEqual(overlap.rows, [{detail_v4: true, recent_v1: true}]);
            const after = await client.query(postureSql);
            assert.deepEqual(after.rows, before);
          } finally {
            try { await client.query('ROLLBACK'); } catch {}
            await client.end();
          }
          NODE
