name: Production Migrations

on:
  workflow_dispatch:
    inputs:
      release_commit:
        description: Exact 40-character main commit to migrate
        required: true
        type: string
      confirmation:
        description: Type run-reviewed-production-migrations-from-main
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-database-migrations
  cancel-in-progress: false

jobs:
  migrate:
    name: Guarded production migration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: Production
    env:
      PRODUCTION_MIGRATION_DIRECT_URL_SHA256: ${{ vars.PRODUCTION_MIGRATION_DIRECT_URL_SHA256 }}
      RUNTIME_DB_ROLE: grainline_app_runtime
      MIGRATION_DB_ROLE: neondb_owner
      PRODUCTION_MIGRATION_RELEASE_COMMIT: ${{ inputs.release_commit }}
      PRODUCTION_MIGRATION_CONFIRM: ${{ inputs.confirmation }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify exact source, owner connection, role posture, and Phase B
        run: node scripts/guard-production-migration-runner.mjs
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
      - name: Verify exact SellerPayoutEvent FORCE migration tree
        run: npm run verify:rls-release-artifact
        env:
          SAVED_SEARCH_RLS_DEPLOY_PHASE: seller-payout-event-force-reviewed
      - name: Verify exact SellerPayoutEvent FORCE release
        run: npm run audit:rls-seller-payout-event-force-release
      - name: Isolate the reviewed SellerPayoutEvent FORCE release
        run: >-
          mv
          prisma/migrations/20260823220000_force_seller_payout_event_rls
          "$RUNNER_TEMP/seller-payout-event-force-release"
      - name: Verify exact SellerPayoutEvent activation migration tree
        run: npm run verify:rls-release-artifact
        env:
          SAVED_SEARCH_RLS_DEPLOY_PHASE: seller-payout-event-activation-reviewed
      - name: Verify exact SellerPayoutEvent activation release
        run: npm run audit:rls-seller-payout-event-activation-release
      - name: Isolate the reviewed SellerPayoutEvent activation release
        run: >-
          mv
          prisma/migrations/20260822180000_enable_seller_payout_event_rls
          "$RUNNER_TEMP/seller-payout-event-activation-release"
      - name: Verify sealed SellerPayoutEvent authority predecessor
        run: npm run audit:rls-seller-payout-event-authority-release
      - name: Isolate the reviewed SellerPayoutEvent authority predecessor
        run: >-
          mv
          prisma/migrations/20260815210000_prepare_seller_payout_event_authority
          "$RUNNER_TEMP/seller-payout-event-authority-release"
      - name: Verify exact CheckoutStockReservation FORCE migration tree
        run: npm run verify:rls-release-artifact
        env:
          SAVED_SEARCH_RLS_DEPLOY_PHASE: checkout-stock-reservation-force-reviewed
      - name: Verify exact CheckoutStockReservation FORCE release
        run: npm run audit:rls-checkout-stock-reservation-force-release
      - name: Isolate the reviewed CheckoutStockReservation FORCE release
        run: >-
          mv
          prisma/migrations/20260815060001_force_checkout_stock_reservation_rls
          "$RUNNER_TEMP/checkout-stock-reservation-force-release"
      - name: Verify exact CheckoutStockReservation activation migration tree
        run: npm run verify:rls-release-artifact
        env:
          SAVED_SEARCH_RLS_DEPLOY_PHASE: checkout-stock-reservation-activation-reviewed
      - name: Verify exact CheckoutStockReservation activation release
        run: npm run audit:rls-checkout-stock-reservation-activation-release
      - name: Isolate the reviewed CheckoutStockReservation activation
        run: >-
          mv
          prisma/migrations/20260815060000_enable_checkout_stock_reservation_rls
          "$RUNNER_TEMP/checkout-stock-reservation-activation-release"
      - name: Verify exact CheckoutStockReservation source-consistency migration tree
        run: npm run verify:rls-release-artifact
        env:
          SAVED_SEARCH_RLS_DEPLOY_PHASE: checkout-stock-reservation-source-consistency-reviewed
      - name: Verify exact CheckoutStockReservation source-consistency release
        run: npm run audit:rls-checkout-stock-reservation-source-consistency-release
      - name: Isolate the reviewed CheckoutStockReservation source-consistency successor
        run: >-
          mv
          prisma/migrations/20260814053000_prepare_checkout_stock_reservation_source_consistency
          "$RUNNER_TEMP/checkout-stock-reservation-source-consistency-release"
      - name: Verify exact CheckoutStockReservation authority migration tree after isolation
        run: npm run verify:rls-release-artifact
        env:
          SAVED_SEARCH_RLS_DEPLOY_PHASE: checkout-stock-reservation-authority-reviewed
      - name: Verify sealed CheckoutStockReservation authority predecessor release
        run: npm run audit:rls-checkout-stock-reservation-authority-release
      - name: Verify sealed StripeWebhookEvent FORCE predecessor
        run: npm run audit:rls-stripe-webhook-event-force-sealed-prefix
      - name: Verify exact Case FORCE proof equivalence
        run: npm run audit:rls-case-force-release
      - name: Verify exact Case read-mode release bytes
        run: npm run audit:rls-case-read-mode-candidate
      - name: Verify Conversation and Message authority proof equivalence
        run: npm run audit:rls-conversation-message-authority-release
      - name: Verify Conversation and Message activation proof equivalence
        run: npm run audit:rls-conversation-message-activation-release
      - name: Verify Conversation and Message FORCE release bytes
        run: npm run audit:rls-conversation-message-force-release
      - name: Verify Notification activation proof equivalence
        run: npm run audit:rls-notification-activation-release
      - name: Verify Notification FORCE release bytes
        run: npm run audit:rls-notification-force-release
      - name: Verify DirectUpload retirement proof equivalence
        run: npm run audit:rls-direct-upload-retirement-release
      - name: Verify DirectUpload activation proof equivalence
        run: npm run audit:rls-direct-upload-activation-release
      - name: Restore the reviewed CheckoutStockReservation source-consistency successor
        run: >-
          mv
          "$RUNNER_TEMP/checkout-stock-reservation-source-consistency-release"
          prisma/migrations/20260814053000_prepare_checkout_stock_reservation_source_consistency
      - name: Restore the reviewed CheckoutStockReservation activation
        run: >-
          mv
          "$RUNNER_TEMP/checkout-stock-reservation-activation-release"
          prisma/migrations/20260815060000_enable_checkout_stock_reservation_rls
      - name: Restore the reviewed CheckoutStockReservation FORCE release
        run: >-
          mv
          "$RUNNER_TEMP/checkout-stock-reservation-force-release"
          prisma/migrations/20260815060001_force_checkout_stock_reservation_rls
      - name: Restore the reviewed SellerPayoutEvent authority predecessor
        run: >-
          mv
          "$RUNNER_TEMP/seller-payout-event-authority-release"
          prisma/migrations/20260815210000_prepare_seller_payout_event_authority
      - name: Restore the reviewed SellerPayoutEvent activation release
        run: >-
          mv
          "$RUNNER_TEMP/seller-payout-event-activation-release"
          prisma/migrations/20260822180000_enable_seller_payout_event_rls
      - name: Restore the reviewed SellerPayoutEvent FORCE release
        run: >-
          mv
          "$RUNNER_TEMP/seller-payout-event-force-release"
          prisma/migrations/20260823220000_force_seller_payout_event_rls
      - name: Inspect exact SellerPayoutEvent FORCE restart scope read-only
        run: npm run audit:rls-seller-payout-event-force-production-scope
        env:
          SELLER_PAYOUT_EVENT_FORCE_SCOPE_STAGE: restart
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Apply production migrations
        run: npx prisma migrate deploy
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
      - name: Converge exact FORCE-hardened SellerPayoutEvent runtime grants
        run: >-
          psql "$DIRECT_URL"
          -v runtime_role=grainline_app_runtime
          -v migration_role=neondb_owner
          -f scripts/provision-runtime-db-role.sql
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
          PGSSLROOTCERT: system
      - name: Verify production migration status
        run: npx prisma migrate status
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
      - name: Audit final runtime grants and RLS catalog
        run: npm run audit:db-grants -- --require-direct-url
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
      - name: Prove exact SellerPayoutEvent FORCE production scope
        run: npm run audit:rls-seller-payout-event-force-production-scope
        env:
          SELLER_PAYOUT_EVENT_FORCE_SCOPE_STAGE: after
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
