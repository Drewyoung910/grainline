name: Production Migrations

on:
  workflow_dispatch:
    inputs:
      release_commit:
        description: Exact 40-character main commit to migrate
        required: true
        type: string
      confirmation:
        description: Type run-reviewed-production-migrations-from-main
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-database-migrations
  cancel-in-progress: false

jobs:
  migrate:
    name: Guarded production migration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: Production
    env:
      PRODUCTION_MIGRATION_DIRECT_URL_SHA256: ${{ vars.PRODUCTION_MIGRATION_DIRECT_URL_SHA256 }}
      RUNTIME_DB_ROLE: grainline_app_runtime
      MIGRATION_DB_ROLE: neondb_owner
      PRODUCTION_MIGRATION_RELEASE_COMMIT: ${{ inputs.release_commit }}
      PRODUCTION_MIGRATION_CONFIRM: ${{ inputs.confirmation }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify exact source, owner connection, role posture, and Phase B
        run: node scripts/guard-production-migration-runner.mjs
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
      - name: Isolate the Case resolution-window release while sealed predecessors are verified
        run: >-
          mv
          prisma/migrations/20260811170000_align_case_resolution_window
          "$RUNNER_TEMP/case-resolution-window-release"
      - name: Verify exact CheckoutStockReservation authority migration tree
        env:
          SAVED_SEARCH_RLS_DEPLOY_PHASE: checkout-stock-reservation-authority-reviewed
        run: npm run verify:rls-release-artifact
      - name: Verify exact CheckoutStockReservation authority release
        run: npm run audit:rls-checkout-stock-reservation-authority-release
      - name: Restore the exact Case resolution-window release
        run: >-
          mv
          "$RUNNER_TEMP/case-resolution-window-release"
          prisma/migrations/20260811170000_align_case_resolution_window
      - name: Verify sealed StripeWebhookEvent FORCE release
        run: npm run audit:rls-stripe-webhook-event-force-sealed-prefix
      - name: Verify exact Case resolution-window migration tree
        run: npm run verify:rls-release-artifact
        env:
          SAVED_SEARCH_RLS_DEPLOY_PHASE: case-resolution-window-reviewed
      - name: Verify exact Case FORCE proof equivalence
        run: npm run audit:rls-case-force-release
      - name: Verify exact Case read-mode release bytes
        run: npm run audit:rls-case-read-mode-candidate
      - name: Verify Conversation and Message authority proof equivalence
        run: npm run audit:rls-conversation-message-authority-release
      - name: Verify Conversation and Message activation proof equivalence
        run: npm run audit:rls-conversation-message-activation-release
      - name: Verify Conversation and Message FORCE release bytes
        run: npm run audit:rls-conversation-message-force-release
      - name: Verify Notification activation proof equivalence
        run: npm run audit:rls-notification-activation-release
      - name: Verify Notification FORCE release bytes
        run: npm run audit:rls-notification-force-release
      - name: Verify DirectUpload retirement proof equivalence
        run: npm run audit:rls-direct-upload-retirement-release
      - name: Verify DirectUpload activation proof equivalence
        run: npm run audit:rls-direct-upload-activation-release
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Isolate queued StripeWebhookEvent FORCE from this Case-only release
        run: >-
          mv
          prisma/migrations/20260810172000_force_stripe_webhook_event_rls
          "$RUNNER_TEMP/stripe-webhook-event-force-release"
      - name: Isolate queued CheckoutStockReservation authority from this Case-only release
        run: >-
          mv
          prisma/migrations/20260810190000_prepare_checkout_stock_reservation_authority
          "$RUNNER_TEMP/checkout-stock-reservation-authority-release"
      - name: Apply production migrations
        run: npx prisma migrate deploy
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
      - name: Verify production migration status
        run: npx prisma migrate status
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
      - name: Audit final runtime grants and RLS catalog
        run: npm run audit:db-grants -- --require-direct-url
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
      - name: Prove exact Case resolution-window production catalog read-only
        run: >-
          psql
          "$DIRECT_URL"
          -v ON_ERROR_STOP=1
          -f scripts/verify-case-resolution-window-production.sql
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
