name: Listing Hide Delete Production

on:
  workflow_dispatch:
    inputs:
      release_commit:
        description: Exact reviewed main commit
        required: true
        type: string
      main_ci_run_id:
        description: Successful full push CI run for that exact main commit
        required: true
        type: string
      confirmation:
        description: Type apply-reviewed-listing-hide-delete
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: production-database-migrations
  cancel-in-progress: false

jobs:
  apply:
    name: Apply reviewed listing Hide/Delete compatibility
    if: >-
      github.repository == 'Drewyoung910/grainline' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      github.run_attempt == 1 &&
      inputs.confirmation == 'apply-reviewed-listing-hide-delete'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: Production
    env:
      MIGRATION_DB_ROLE: neondb_owner
      PRODUCTION_MIGRATION_CONFIRM: run-reviewed-production-migrations-from-main
      PRODUCTION_MIGRATION_DIRECT_URL_SHA256: ${{ vars.PRODUCTION_MIGRATION_DIRECT_URL_SHA256 }}
      PRODUCTION_MIGRATION_RELEASE_COMMIT: ${{ inputs.release_commit }}
      RUNTIME_DB_ROLE: grainline_app_runtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.2"
          architecture: x64
          check-latest: false
          package-manager-cache: false
          token: ""
      - run: npm ci --ignore-scripts
      - run: npx prisma generate
      - name: Bind release to exact main and completed CI
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          REVIEWED_RELEASE_COMMIT: ${{ inputs.release_commit }}
          REVIEWED_MAIN_CI_RUN_ID: ${{ inputs.main_ci_run_id }}
        with:
          script: |
            const sha = process.env.REVIEWED_RELEASE_COMMIT;
            const value = process.env.REVIEWED_MAIN_CI_RUN_ID;
            if (!/^[0-9a-f]{40}$/.test(sha ?? '') || sha !== context.sha ||
                !/^[1-9][0-9]{0,19}$/.test(value ?? '')) {
              throw new Error('Listing Hide/Delete release binding drifted');
            }
            const runId = Number(value);
            if (!Number.isSafeInteger(runId)) throw new Error('CI run id is unsafe');
            const [{data: main}, {data: run}] = await Promise.all([
              github.rest.repos.getBranch({...context.repo, branch: 'main'}),
              github.rest.actions.getWorkflowRun({...context.repo, run_id: runId}),
            ]);
            if (main.commit.sha !== sha || run.name !== 'CI' ||
                run.event !== 'push' || run.head_branch !== 'main' ||
                run.head_sha !== sha || run.status !== 'completed' ||
                run.conclusion !== 'success') {
              throw new Error('Listing Hide/Delete main/CI readback drifted');
            }
      - name: Verify exact release source
        shell: bash
        run: |
          set -euo pipefail
          test "$(find prisma/migrations -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | LC_ALL=C sort | tail -n 1)" = \
            "20261013040000_add_listing_archived_at"
          echo "b691aac5db56d1fb3b185c5c47b58e3a167cfb01ccb6ebf7cdd0a798cc1f59eb  prisma/migrations/20261013040000_add_listing_archived_at/migration.sql" \
            | sha256sum --check --status
          node --test \
            tests/listing-action-state.test.mjs \
            tests/listing-delete.test.mjs \
            tests/listing-edit-state.test.mjs \
            tests/listing-hide-delete-production-workflow.test.mjs \
            tests/listing-stock-runtime.test.mjs \
            tests/listing-visibility.test.mjs \
            tests/reviewed-pending-migrations.test.mjs
      - name: Verify owner connection boundary
        run: node scripts/guard-production-migration-runner.mjs
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
      - name: Inspect restart-safe production state
        id: preflight
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
        run: |
          node --input-type=module - <<'NODE'
          import assert from 'node:assert/strict';
          import {appendFileSync, writeFileSync} from 'node:fs';
          import pg from 'pg';

          const predecessor = '20261012120000_force_account_deletion_side_effect_rls';
          const predecessorChecksum = '7bcb3ecfeab41ec457a58845e380b8837b21e75ac077ef0c045674ff1a4ce7ec';
          const migration = '20261013040000_add_listing_archived_at';
          const checksum = 'b691aac5db56d1fb3b185c5c47b58e3a167cfb01ccb6ebf7cdd0a798cc1f59eb';
          const postureSql = `SELECT relrowsecurity, relforcerowsecurity, relacl::text
            FROM pg_catalog.pg_class WHERE oid = 'public."Listing"'::regclass`;
          const client = new pg.Client({connectionString: process.env.DIRECT_URL});
          try {
            await client.connect();
            await client.query('BEGIN ISOLATION LEVEL REPEATABLE READ READ ONLY');
            const ledger = await client.query(`SELECT migration_name, checksum, finished_at,
              rolled_back_at, applied_steps_count FROM public._prisma_migrations
              WHERE migration_name = ANY($1::text[]) ORDER BY migration_name`,
              [[predecessor, migration]]);
            const rows = new Map(ledger.rows.map((row) => [row.migration_name, row]));
            const required = rows.get(predecessor);
            assert.ok(required, 'required AccountDeletionSideEffect FORCE predecessor is missing');
            assert.equal(required.checksum, predecessorChecksum);
            assert.ok(required.finished_at);
            assert.equal(required.rolled_back_at, null);
            assert.equal(Number(required.applied_steps_count), 1);
            const candidate = rows.get(migration);
            if (candidate) {
              assert.equal(candidate.checksum, checksum);
              assert.ok(candidate.finished_at);
              assert.equal(candidate.rolled_back_at, null);
              assert.equal(Number(candidate.applied_steps_count), 1);
            } else {
              const collision = await client.query(`SELECT
                (SELECT pg_catalog.count(*)::int
                   FROM pg_catalog.pg_attribute AS attribute
                  WHERE attribute.attrelid = 'public."Listing"'::regclass
                    AND attribute.attname = 'archivedAt'
                    AND NOT attribute.attisdropped) AS columns,
                pg_catalog.to_regprocedure(
                  'public.grainline_listing_delete_reference_state(text,text)'
                ) IS NOT NULL AS routine_exists`);
              assert.equal(collision.rows[0].columns, 0);
              assert.equal(collision.rows[0].routine_exists, false);
            }
            const posture = (await client.query(postureSql)).rows;
            assert.equal(posture.length, 1);
            writeFileSync(`${process.env.RUNNER_TEMP}/listing-hide-delete-posture.json`,
              JSON.stringify(posture), {mode: 0o600, flag: 'wx'});
            appendFileSync(process.env.GITHUB_OUTPUT,
              `state=${candidate ? 'applied' : 'pending'}\n`);
            await client.query('COMMIT');
          } finally {
            try { await client.query('ROLLBACK'); } catch {}
            await client.end();
          }
          NODE
      - name: Require every predecessor applied and no other pending migration
        shell: bash
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
          MIGRATION_STATE: ${{ steps.preflight.outputs.state }}
        run: |
          set -euo pipefail
          migration=20261013040000_add_listing_archived_at
          if [[ "$MIGRATION_STATE" == "pending" ]]; then
            holding="$RUNNER_TEMP/$migration"
            mv "prisma/migrations/$migration" "$holding"
            trap 'if [[ -d "$holding" ]]; then mv "$holding" "prisma/migrations/$migration"; fi' EXIT
            npx prisma migrate status
            mv "$holding" "prisma/migrations/$migration"
            trap - EXIT
            REVIEWED_PENDING_MIGRATIONS="$migration" node scripts/assert-reviewed-pending-migrations.mjs
          elif [[ "$MIGRATION_STATE" == "applied" ]]; then
            REVIEWED_PENDING_MIGRATIONS="" node scripts/assert-reviewed-pending-migrations.mjs
            npx prisma migrate status
          else
            echo "Unexpected listing migration state" >&2
            exit 1
          fi
      - name: Apply only the reviewed listing compatibility migration
        if: steps.preflight.outputs.state == 'pending'
        run: npx prisma migrate deploy
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
      - name: Read back exact catalog and unchanged table posture
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
        run: |
          node --input-type=module - <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync, writeFileSync} from 'node:fs';
          import pg from 'pg';

          const migration = '20261013040000_add_listing_archived_at';
          const checksum = 'b691aac5db56d1fb3b185c5c47b58e3a167cfb01ccb6ebf7cdd0a798cc1f59eb';
          const sql = readFileSync(`prisma/migrations/${migration}/migration.sql`, 'utf8');
          const delimiter = '$grainline_listing_delete_reference_state$';
          const bodyStart = sql.indexOf(`AS ${delimiter}`) + `AS ${delimiter}`.length;
          const expectedSource = sql.slice(bodyStart, sql.indexOf(`${delimiter};`, bodyStart));
          assert.ok(bodyStart > `AS ${delimiter}`.length && expectedSource.length > 0);
          const before = JSON.parse(readFileSync(
            `${process.env.RUNNER_TEMP}/listing-hide-delete-posture.json`, 'utf8'));
          const postureSql = `SELECT relrowsecurity, relforcerowsecurity, relacl::text
            FROM pg_catalog.pg_class WHERE oid = 'public."Listing"'::regclass`;
          const client = new pg.Client({connectionString: process.env.DIRECT_URL});
          try {
            await client.connect();
            await client.query('BEGIN ISOLATION LEVEL REPEATABLE READ READ ONLY');
            const ledger = await client.query(`SELECT checksum, finished_at, rolled_back_at,
              applied_steps_count FROM public._prisma_migrations WHERE migration_name = $1`,
              [migration]);
            assert.equal(ledger.rows.length, 1);
            assert.equal(ledger.rows[0].checksum, checksum);
            assert.ok(ledger.rows[0].finished_at);
            assert.equal(ledger.rows[0].rolled_back_at, null);
            assert.equal(Number(ledger.rows[0].applied_steps_count), 1);

            const column = await client.query(`SELECT format_type(atttypid, atttypmod) AS type
              FROM pg_catalog.pg_attribute WHERE attrelid = 'public."Listing"'::regclass
                AND attname = 'archivedAt' AND NOT attisdropped`);
            assert.deepEqual(column.rows, [{type: 'timestamp(3) without time zone'}]);
            const index = await client.query(`SELECT pg_catalog.pg_get_indexdef(indexrelid) AS definition
              FROM pg_catalog.pg_index
              WHERE indexrelid = 'public."Listing_sellerId_archivedAt_updatedAt_idx"'::regclass`);
            assert.equal(index.rows.length, 1);
            assert.match(index.rows[0].definition, /\("sellerId", "archivedAt", "updatedAt"\)$/u);

            const authority = await client.query(`SELECT
              pg_catalog.pg_get_userbyid(routine.proowner) AS owner,
              routine.prosrc, routine.prosecdef, routine.provolatile,
              routine.proparallel, routine.proconfig,
              pg_catalog.pg_get_function_result(routine.oid) AS result_type,
              pg_catalog.has_function_privilege(
                'grainline_app_runtime', routine.oid, 'EXECUTE') AS runtime_execute,
              pg_catalog.has_function_privilege(0, routine.oid, 'EXECUTE') AS public_execute
              FROM pg_catalog.pg_proc AS routine
              WHERE routine.oid =
                'public.grainline_listing_delete_reference_state(text,text)'::regprocedure`);
            assert.equal(authority.rows.length, 1);
            assert.equal(authority.rows[0].owner, 'neondb_owner');
            assert.equal(authority.rows[0].prosrc, expectedSource);
            assert.equal(authority.rows[0].result_type,
              'TABLE("hasOrderItems" boolean, "hasReviews" boolean, "hasConversations" boolean, "hasMessages" boolean, "hasCheckoutReservations" boolean)');
            assert.equal(authority.rows[0].prosecdef, true);
            assert.equal(authority.rows[0].provolatile, 's');
            assert.equal(authority.rows[0].proparallel, 's');
            assert.deepEqual(authority.rows[0].proconfig, ['search_path=pg_catalog']);
            assert.equal(authority.rows[0].runtime_execute, true);
            assert.equal(authority.rows[0].public_execute, false);
            assert.deepEqual((await client.query(postureSql)).rows, before);

            const legacy = await client.query(`SELECT pg_catalog.count(*)::int AS count
              FROM public."Listing" AS listing
              WHERE listing.status = 'HIDDEN' AND listing."isPrivate"
                AND listing."archivedAt" IS NULL
                AND NOT EXISTS (SELECT 1 FROM public."AdminAuditLog" AS audit
                  WHERE audit.action = 'HOLD_LISTING'
                    AND audit."targetType" = 'Listing'
                    AND audit."targetId" = listing.id AND NOT audit.undone)`);
            assert.equal(legacy.rows[0].count, 0);
            const absent = await client.query(`SELECT * FROM
              public.grainline_listing_delete_reference_state($1, $2)`,
              ['release_postflight_actor', 'release_postflight_missing_listing']);
            assert.equal(absent.rows.length, 0);
            await client.query('COMMIT');
            writeFileSync(`${process.env.RUNNER_TEMP}/listing-hide-delete-postflight.json`,
              JSON.stringify({status: 'passed', releaseCommit: process.env.GITHUB_SHA,
                migration, issueCount: 0}), {mode: 0o600, flag: 'wx'});
          } finally {
            try { await client.query('ROLLBACK'); } catch {}
            await client.end();
          }
          NODE
      - name: Require no pending migrations after apply
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
          REVIEWED_PENDING_MIGRATIONS: ""
        run: |
          node scripts/assert-reviewed-pending-migrations.mjs
          npx prisma migrate status
      - name: Audit global grants after listing compatibility
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
          GRANT_AUDIT_DATABASE_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
        run: npm run audit:db-grants -- --require-direct-url
      - name: Preserve sanitized listing release evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: listing-hide-delete-production-${{ github.run_id }}
          path: ${{ runner.temp }}/listing-hide-delete-postflight.json
          if-no-files-found: warn
          retention-days: 30
          include-hidden-files: false
