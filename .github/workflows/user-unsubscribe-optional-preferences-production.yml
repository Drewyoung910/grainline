name: User Unsubscribe Optional Preferences Production

on:
  workflow_dispatch:
    inputs:
      release_commit:
        description: Exact reviewed main commit
        required: true
        type: string
      main_ci_run_id:
        description: Successful full push CI run for that exact main commit
        required: true
        type: string
      confirmation:
        description: Type apply-reviewed-user-unsubscribe-optional-preferences
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: production-database-migrations
  cancel-in-progress: false

jobs:
  apply:
    name: Apply reviewed C-875 unsubscribe correction
    if: >-
      github.repository == 'Drewyoung910/grainline' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      github.run_attempt == 1 &&
      inputs.confirmation == 'apply-reviewed-user-unsubscribe-optional-preferences'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: Production
    env:
      MIGRATION_DB_ROLE: neondb_owner
      PRODUCTION_MIGRATION_CONFIRM: run-reviewed-production-migrations-from-main
      PRODUCTION_MIGRATION_DIRECT_URL_SHA256: ${{ vars.PRODUCTION_MIGRATION_DIRECT_URL_SHA256 }}
      PRODUCTION_MIGRATION_RELEASE_COMMIT: ${{ inputs.release_commit }}
      RUNTIME_DB_ROLE: grainline_app_runtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825a76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.2"
          architecture: x64
          check-latest: false
          package-manager-cache: false
          token: ""
      - run: npm ci --ignore-scripts
      - name: Bind release to exact main and completed push workflows
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          REVIEWED_RELEASE_COMMIT: ${{ inputs.release_commit }}
          REVIEWED_MAIN_CI_RUN_ID: ${{ inputs.main_ci_run_id }}
        with:
          script: |
            const sha = process.env.REVIEWED_RELEASE_COMMIT;
            const value = process.env.REVIEWED_MAIN_CI_RUN_ID;
            if (!/^[0-9a-f]{40}$/.test(sha ?? '') || sha !== context.sha ||
                !/^[1-9][0-9]{0,19}$/.test(value ?? '')) {
              throw new Error('C-875 release binding drifted');
            }
            const runId = Number(value);
            if (!Number.isSafeInteger(runId)) throw new Error('CI run id is unsafe');
            const [{data: main}, {data: run}] = await Promise.all([
              github.rest.repos.getBranch({...context.repo, branch: 'main'}),
              github.rest.actions.getWorkflowRun({...context.repo, run_id: runId}),
            ]);
            if (main.commit.sha !== sha || run.name !== 'CI' ||
                run.event !== 'push' || run.head_branch !== 'main' ||
                run.head_sha !== sha || run.status !== 'completed' ||
                run.conclusion !== 'success') {
              throw new Error('C-875 main/CI readback drifted');
            }
            const exactPushRuns = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              {
                ...context.repo,
                branch: 'main',
                event: 'push',
                head_sha: sha,
                per_page: 100,
              },
            );
            const latestByWorkflow = new Map();
            for (const exactRun of exactPushRuns) {
              if (exactRun.head_sha !== sha || exactRun.head_branch !== 'main' ||
                  exactRun.event !== 'push') continue;
              const key = exactRun.path || exactRun.name;
              const previous = latestByWorkflow.get(key);
              if (!previous || Number(exactRun.id) > Number(previous.id)) {
                latestByWorkflow.set(key, exactRun);
              }
            }
            const requiredPushWorkflowPaths = new Set([
              '.github/workflows/ci.yml',
              '.github/workflows/conversation-message-force-proof.yml',
              '.github/workflows/notification-rls-ephemeral-proof.yml',
              '.github/workflows/account-deletion-worker-bootstrap-proof.yml',
              '.github/workflows/order-staff-bootstrap-proof.yml',
              '.github/workflows/order-paid-repair-lock-proof.yml',
              '.github/workflows/order-account-deletion-concurrency-proof.yml',
            ]);
            const missingPushWorkflows = [...requiredPushWorkflowPaths]
              .filter((workflowPath) => !latestByWorkflow.has(workflowPath));
            if (missingPushWorkflows.length !== 0) {
              throw new Error(
                `Required exact-main push workflows are absent: ${missingPushWorkflows.join(', ')}`,
              );
            }
            const unacceptablePushRuns = [...latestByWorkflow.values()]
              .filter((exactRun) => exactRun.status !== 'completed' ||
                exactRun.conclusion !== 'success');
            if (unacceptablePushRuns.length !== 0) {
              throw new Error(
                `Exact-main push workflows are not all green: ${unacceptablePushRuns
                  .map((exactRun) =>
                    `${exactRun.name}:${exactRun.status}/${exactRun.conclusion}`)
                  .join(', ')}`,
              );
            }
      - name: Verify exact candidate bytes and focused behavior
        shell: bash
        run: |
          set -euo pipefail
          migration=20261023030000_correct_user_unsubscribe_optional_email_preferences
          test -f "prisma/migrations/$migration/migration.sql"
          echo "996378ebae18adffe66dedab3ca9f02f80b0a1907eee162db1f9692d040d65c7  prisma/migrations/$migration/migration.sql" \
            | sha256sum --check --status
          node --check scripts/user-unsubscribe-optional-preferences-production-inspect.mjs
          node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON \
            --experimental-strip-types --test --test-concurrency=1 \
            tests/user-signed-unsubscribe-authorities.test.mjs \
            tests/user-signed-unsubscribe-authorities-postgres.test.mjs \
            tests/user-signed-unsubscribe-production-inspect.test.mjs \
            tests/user-unsubscribe-optional-preferences-production-workflow.test.mjs
      - name: Verify owner connection boundary
        run: node scripts/guard-production-migration-runner.mjs
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
      - name: Inspect exact predecessor and restart state read-only
        id: preflight
        run: node scripts/user-unsubscribe-optional-preferences-production-inspect.mjs preflight
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
      - name: Require every peer applied and exactly candidate pending
        shell: bash
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
          MIGRATION_STATE: ${{ steps.preflight.outputs.state }}
        run: |
          set -euo pipefail
          migration=20261023030000_correct_user_unsubscribe_optional_email_preferences
          if [[ "$MIGRATION_STATE" == "pending" ]]; then
            REVIEWED_PENDING_MIGRATIONS="$migration" node scripts/assert-reviewed-pending-migrations.mjs
          elif [[ "$MIGRATION_STATE" == "applied" ]]; then
            REVIEWED_PENDING_MIGRATIONS="" node scripts/assert-reviewed-pending-migrations.mjs
            npx prisma migrate status
          else
            echo "Unexpected C-875 migration state" >&2
            exit 1
          fi
      - name: Apply only the reviewed C-875 migration
        if: steps.preflight.outputs.state == 'pending'
        run: npx prisma migrate deploy
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
      - name: Read back exact function, ACL, and ledger
        run: node scripts/user-unsubscribe-optional-preferences-production-inspect.mjs postflight
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
      - name: Verify final Prisma migration status
        run: npx prisma migrate status
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
      - name: Upload sanitized release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: user-unsubscribe-optional-preferences-${{ github.run_id }}
          path: ${{ runner.temp }}/user-unsubscribe-optional-preferences.json
          if-no-files-found: error
          retention-days: 14
