name: SellerProfile Private Boundary Production

on:
  workflow_dispatch:
    inputs:
      release_commit:
        description: Exact reviewed main commit
        required: true
        type: string
      main_ci_run_id:
        description: Successful full push CI run for that exact main commit
        required: true
        type: string
      confirmation:
        description: Type apply-reviewed-seller-profile-private-boundary
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: production-database-migrations
  cancel-in-progress: false

jobs:
  apply:
    name: Apply reviewed SellerProfile private boundary
    if: >-
      github.repository == 'Drewyoung910/grainline' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      github.run_attempt == 1 &&
      inputs.confirmation == 'apply-reviewed-seller-profile-private-boundary'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: Production
    env:
      MIGRATION_DB_ROLE: neondb_owner
      PRODUCTION_MIGRATION_CONFIRM: run-reviewed-production-migrations-from-main
      PRODUCTION_MIGRATION_DIRECT_URL_SHA256: ${{ vars.PRODUCTION_MIGRATION_DIRECT_URL_SHA256 }}
      PRODUCTION_MIGRATION_RELEASE_COMMIT: ${{ inputs.release_commit }}
      RUNTIME_DB_ROLE: grainline_app_runtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.2"
          architecture: x64
          check-latest: false
          package-manager-cache: false
          token: ""
      - run: npm ci --ignore-scripts
      - run: npx prisma generate
      - name: Bind release to exact main and completed CI
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          REVIEWED_RELEASE_COMMIT: ${{ inputs.release_commit }}
          REVIEWED_MAIN_CI_RUN_ID: ${{ inputs.main_ci_run_id }}
        with:
          script: |
            const sha = process.env.REVIEWED_RELEASE_COMMIT;
            const value = process.env.REVIEWED_MAIN_CI_RUN_ID;
            if (!/^[0-9a-f]{40}$/.test(sha ?? '') || sha !== context.sha ||
                !/^[1-9][0-9]{0,19}$/.test(value ?? '')) {
              throw new Error('SellerProfile private-boundary release binding drifted');
            }
            const runId = Number(value);
            if (!Number.isSafeInteger(runId)) throw new Error('CI run id is unsafe');
            const [{data: main}, {data: run}] = await Promise.all([
              github.rest.repos.getBranch({...context.repo, branch: 'main'}),
              github.rest.actions.getWorkflowRun({...context.repo, run_id: runId}),
            ]);
            if (main.commit.sha !== sha || run.name !== 'CI' ||
                run.event !== 'push' || run.head_branch !== 'main' ||
                run.head_sha !== sha || run.status !== 'completed' ||
                run.conclusion !== 'success') {
              throw new Error('SellerProfile private-boundary main/CI readback drifted');
            }
      - name: Verify exact SellerProfile private-boundary source
        run: >-
          node --test
          tests/seller-profile-private-boundary-preparation.test.mjs
          tests/seller-profile-private-boundary-production-workflow.test.mjs
          tests/reviewed-pending-migrations.test.mjs
      - name: Verify exact SellerProfile private-boundary migration bytes
        shell: bash
        run: |
          set -euo pipefail
          echo "0fc8c89afe3b8256694cb1d16e2dece5790262e4631d382cda93a514d2d2fd2e  prisma/migrations/20261013120000_prepare_seller_profile_private_boundary/migration.sql" \
            | sha256sum --check --status
      - name: Verify owner connection boundary
        run: node scripts/guard-production-migration-runner.mjs
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
      - name: Inspect restart-safe Production state
        id: preflight
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
        run: |
          node --input-type=module - <<'NODE'
          import assert from 'node:assert/strict';
          import {appendFileSync, writeFileSync} from 'node:fs';
          import pg from 'pg';

          const migration = '20261013120000_prepare_seller_profile_private_boundary';
          const checksum = '0fc8c89afe3b8256694cb1d16e2dece5790262e4631d382cda93a514d2d2fd2e';
          const predecessor = '20261013040000_add_listing_archived_at';
          const predecessorChecksum = 'b691aac5db56d1fb3b185c5c47b58e3a167cfb01ccb6ebf7cdd0a798cc1f59eb';
          const client = new pg.Client({connectionString: process.env.DIRECT_URL});
          try {
            await client.connect();
            await client.query('BEGIN ISOLATION LEVEL REPEATABLE READ READ ONLY');
            const ledger = await client.query(`SELECT migration_name, checksum,
              finished_at IS NOT NULL AS finished, rolled_back_at IS NOT NULL AS rolled_back,
              applied_steps_count::int AS applied_steps_count
              FROM public._prisma_migrations
              WHERE migration_name = ANY($1::text[]) ORDER BY migration_name`,
              [[predecessor, migration]]);
            const rows = new Map(ledger.rows.map((row) => [row.migration_name, row]));
            assert.deepEqual(rows.get(predecessor), {
              migration_name: predecessor,
              checksum: predecessorChecksum,
              finished: true,
              rolled_back: false,
              applied_steps_count: 1,
            });
            const candidate = rows.get(migration);
            if (candidate) {
              assert.deepEqual(candidate, {
                migration_name: migration,
                checksum,
                finished: true,
                rolled_back: false,
                applied_steps_count: 1,
              });
            } else {
              const collision = (await client.query(`SELECT
                pg_catalog.to_regclass('public."SellerProfilePrivate"') IS NOT NULL AS private_table,
                EXISTS (SELECT 1 FROM pg_catalog.pg_attribute
                  WHERE attrelid = 'public."SellerProfile"'::regclass
                    AND attname = 'stripeAccountSupported' AND NOT attisdropped) AS public_column,
                pg_catalog.to_regprocedure(
                  'public.grainline_seller_profile_private_mirror()') IS NOT NULL AS mirror_function,
                pg_catalog.to_regprocedure(
                  'public.grainline_seller_profile_supported_snapshot()') IS NOT NULL AS snapshot_function,
                EXISTS (SELECT 1 FROM pg_catalog.pg_trigger
                  WHERE tgrelid = 'public."SellerProfile"'::regclass
                    AND tgname = ANY(ARRAY['SellerProfile_private_mirror',
                                           'SellerProfile_supported_snapshot'])
                    AND NOT tgisinternal) AS trigger`)).rows[0];
              assert.deepEqual(collision, {
                private_table: false,
                public_column: false,
                mirror_function: false,
                snapshot_function: false,
                trigger: false,
              });
            }
            const posture = (await client.query(`SELECT relrowsecurity, relforcerowsecurity,
              relacl::text FROM pg_catalog.pg_class
              WHERE oid = 'public."SellerProfile"'::regclass`)).rows;
            assert.equal(posture.length, 1);
            writeFileSync(`${process.env.RUNNER_TEMP}/seller-profile-private-preflight.json`,
              JSON.stringify({migrationState: candidate ? 'applied' : 'pending', posture}),
              {mode: 0o600, flag: 'wx'});
            await client.query('COMMIT');
            appendFileSync(
              process.env.GITHUB_OUTPUT,
              `state=${candidate ? 'applied' : 'pending'}\n`,
            );
          } finally {
            try { await client.query('ROLLBACK'); } catch {}
            await client.end();
          }
          NODE
      - name: Require every predecessor applied and no other pending migration
        shell: bash
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
          MIGRATION_STATE: ${{ steps.preflight.outputs.state }}
        run: |
          set -euo pipefail
          migration=20261013120000_prepare_seller_profile_private_boundary
          if [[ "$MIGRATION_STATE" == "pending" ]]; then
            holding="$RUNNER_TEMP/$migration"
            mv "prisma/migrations/$migration" "$holding"
            trap 'if [[ -d "$holding" ]]; then mv "$holding" "prisma/migrations/$migration"; fi' EXIT
            npx prisma migrate status
            mv "$holding" "prisma/migrations/$migration"
            trap - EXIT
            REVIEWED_PENDING_MIGRATIONS="$migration" node scripts/assert-reviewed-pending-migrations.mjs
          elif [[ "$MIGRATION_STATE" == "applied" ]]; then
            REVIEWED_PENDING_MIGRATIONS="" node scripts/assert-reviewed-pending-migrations.mjs
            npx prisma migrate status
          else
            echo "Unexpected SellerProfile private-boundary state" >&2
            exit 1
          fi
      - name: Apply only reviewed SellerProfile private-boundary migration
        if: steps.preflight.outputs.state == 'pending'
        run: npx prisma migrate deploy
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
      - name: Read back exact catalog and data convergence
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
        run: |
          node --input-type=module - <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync, writeFileSync} from 'node:fs';
          import pg from 'pg';

          const migration = '20261013120000_prepare_seller_profile_private_boundary';
          const checksum = '0fc8c89afe3b8256694cb1d16e2dece5790262e4631d382cda93a514d2d2fd2e';
          const sql = readFileSync(
            `prisma/migrations/${migration}/migration.sql`, 'utf8');
          const reviewedBody = (name) => {
            const marker = `CREATE OR REPLACE FUNCTION public.${name}()`;
            const start = sql.indexOf(marker);
            assert.ok(start >= 0, `${name} is absent from reviewed source`);
            const match = sql.slice(start).match(/AS \$function\$([\s\S]*?)\$function\$;/u);
            assert.ok(match, `${name} body is not parseable`);
            return match[1];
          };
          const before = JSON.parse(readFileSync(
            `${process.env.RUNNER_TEMP}/seller-profile-private-preflight.json`, 'utf8'));
          const client = new pg.Client({connectionString: process.env.DIRECT_URL});
          try {
            await client.connect();
            await client.query('BEGIN ISOLATION LEVEL REPEATABLE READ READ ONLY');
            const ledger = (await client.query(`SELECT migration_name, checksum,
              finished_at IS NOT NULL AS finished, rolled_back_at IS NOT NULL AS rolled_back,
              applied_steps_count::int AS applied_steps_count
              FROM public._prisma_migrations WHERE migration_name = $1`, [migration])).rows;
            assert.deepEqual(ledger, [{
              migration_name: migration,
              checksum,
              finished: true,
              rolled_back: false,
              applied_steps_count: 1,
            }]);
            const publicPosture = (await client.query(`SELECT relrowsecurity, relforcerowsecurity,
              relacl::text FROM pg_catalog.pg_class
              WHERE oid = 'public."SellerProfile"'::regclass`)).rows;
            assert.deepEqual(publicPosture, before.posture);
            const privatePosture = (await client.query(`SELECT
              pg_catalog.pg_get_userbyid(class.relowner) AS owner,
              class.relrowsecurity, class.relforcerowsecurity,
              (SELECT pg_catalog.count(*)::int FROM pg_catalog.pg_policy
                WHERE polrelid = class.oid) AS policy_count,
              pg_catalog.has_table_privilege('grainline_app_runtime', class.oid,
                'SELECT,INSERT,UPDATE,DELETE,TRUNCATE,REFERENCES,TRIGGER') AS runtime_any,
              EXISTS (SELECT 1
                FROM pg_catalog.aclexplode(COALESCE(class.relacl,
                  pg_catalog.acldefault('r', class.relowner))) AS acl
                WHERE acl.grantee = 0) AS public_any,
              pg_catalog.has_any_column_privilege('grainline_app_runtime', class.oid,
                'SELECT,INSERT,UPDATE,REFERENCES') AS runtime_column_any,
              EXISTS (SELECT 1
                FROM pg_catalog.pg_attribute AS attribute,
                  LATERAL pg_catalog.aclexplode(attribute.attacl) AS acl
                WHERE attribute.attrelid = class.oid
                  AND attribute.attnum > 0
                  AND NOT attribute.attisdropped
                  AND acl.grantee = 0) AS public_column_any
              FROM pg_catalog.pg_class AS class
              WHERE class.oid = 'public."SellerProfilePrivate"'::regclass`)).rows;
            assert.deepEqual(privatePosture, [{
              owner: 'neondb_owner', relrowsecurity: false, relforcerowsecurity: false,
              policy_count: 0, runtime_any: false, public_any: false,
              runtime_column_any: false, public_column_any: false,
            }]);
            const column = (await client.query(`SELECT
              pg_catalog.format_type(atttypid, atttypmod) AS type, attnotnull,
              pg_catalog.pg_get_expr(adbin, adrelid) AS default
              FROM pg_catalog.pg_attribute
              LEFT JOIN pg_catalog.pg_attrdef
                ON adrelid = attrelid AND adnum = attnum
              WHERE attrelid = 'public."SellerProfile"'::regclass
                AND attname = 'stripeAccountSupported' AND NOT attisdropped`)).rows;
            assert.deepEqual(column, [{type: 'boolean', attnotnull: true, default: 'true'}]);
            const publicConstraint = (await client.query(`SELECT
              pg_catalog.pg_get_constraintdef(oid, true) AS definition
              FROM pg_catalog.pg_constraint
              WHERE conrelid = 'public."SellerProfile"'::regclass
                AND conname = 'SellerProfile_stripeAccountSupported_check'`)).rows;
            assert.equal(publicConstraint.length, 1);
            assert.match(publicConstraint[0].definition,
              /CHECK \("stripeAccountSupported" = \("stripeAccountVersion" IS NULL OR "stripeAccountVersion"::text = 'v2'::text\)\)/u);
            const constraints = (await client.query(`SELECT conname AS name,
              pg_catalog.pg_get_constraintdef(oid, true) AS definition
              FROM pg_catalog.pg_constraint
              WHERE conrelid = 'public."SellerProfilePrivate"'::regclass
              ORDER BY conname`)).rows;
            assert.deepEqual(constraints.map(({name}) => name), [
              'SellerProfilePrivate_consecutiveMetricFailures_check',
              'SellerProfilePrivate_defaultPkgHeightCm_check',
              'SellerProfilePrivate_defaultPkgLengthCm_check',
              'SellerProfilePrivate_defaultPkgWeightGrams_check',
              'SellerProfilePrivate_defaultPkgWidthCm_check',
              'SellerProfilePrivate_onboardingStep_check',
              'SellerProfilePrivate_pkey',
              'SellerProfilePrivate_profileViews_check',
              'SellerProfilePrivate_sellerProfileId_fkey',
            ]);
            assert.match(
              constraints.find(({name}) => name ===
                'SellerProfilePrivate_sellerProfileId_fkey').definition,
              /FOREIGN KEY \("sellerProfileId"\) REFERENCES "SellerProfile"\(id\) ON UPDATE CASCADE ON DELETE CASCADE/u,
            );
            const convergence = (await client.query(`SELECT
              (SELECT pg_catalog.count(*)::int FROM public."SellerProfile") AS public_count,
              (SELECT pg_catalog.count(*)::int FROM public."SellerProfilePrivate") AS private_count,
              (SELECT pg_catalog.count(*)::int FROM public."SellerProfile" AS source
                FULL JOIN public."SellerProfilePrivate" AS private
                  ON private."sellerProfileId" = source.id
                WHERE source.id IS NULL OR private."sellerProfileId" IS NULL OR
                  private."stripeAccountId" IS DISTINCT FROM source."stripeAccountId" OR
                  private."stripeAccountVersion" IS DISTINCT FROM source."stripeAccountVersion" OR
                  private."stripeControllerType" IS DISTINCT FROM source."stripeControllerType" OR
                  private."manualStripeReconciliationNeeded" IS DISTINCT FROM source."manualStripeReconciliationNeeded" OR
                  private."manualStripeReconciliationNote" IS DISTINCT FROM source."manualStripeReconciliationNote" OR
                  private."shipFromName" IS DISTINCT FROM source."shipFromName" OR
                  private."shipFromLine1" IS DISTINCT FROM source."shipFromLine1" OR
                  private."shipFromLine2" IS DISTINCT FROM source."shipFromLine2" OR
                  private."shipFromCity" IS DISTINCT FROM source."shipFromCity" OR
                  private."shipFromState" IS DISTINCT FROM source."shipFromState" OR
                  private."shipFromPostal" IS DISTINCT FROM source."shipFromPostal" OR
                  private."shipFromCountry" IS DISTINCT FROM source."shipFromCountry" OR
                  private."shipFromPhone" IS DISTINCT FROM source."shipFromPhone" OR
                  private."defaultPkgWeightGrams" IS DISTINCT FROM source."defaultPkgWeightGrams" OR
                  private."defaultPkgLengthCm" IS DISTINCT FROM source."defaultPkgLengthCm" OR
                  private."defaultPkgWidthCm" IS DISTINCT FROM source."defaultPkgWidthCm" OR
                  private."defaultPkgHeightCm" IS DISTINCT FROM source."defaultPkgHeightCm" OR
                  private."useCalculatedShipping" IS DISTINCT FROM source."useCalculatedShipping" OR
                  private."preferredCarriers" IS DISTINCT FROM source."preferredCarriers" OR
                  private."onboardingStep" IS DISTINCT FROM source."onboardingStep" OR
                  private."onboardingComplete" IS DISTINCT FROM source."onboardingComplete" OR
                  private."guildMemberApprovedAt" IS DISTINCT FROM source."guildMemberApprovedAt" OR
                  private."guildMasterApprovedAt" IS DISTINCT FROM source."guildMasterApprovedAt" OR
                  private."guildMasterAppliedAt" IS DISTINCT FROM source."guildMasterAppliedAt" OR
                  private."guildMasterReviewNotes" IS DISTINCT FROM source."guildMasterReviewNotes" OR
                  private."consecutiveMetricFailures" IS DISTINCT FROM source."consecutiveMetricFailures" OR
                  private."lastMetricCheckAt" IS DISTINCT FROM source."lastMetricCheckAt" OR
                  private."metricWarningSentAt" IS DISTINCT FROM source."metricWarningSentAt" OR
                  private."listingsBelowThresholdSince" IS DISTINCT FROM source."listingsBelowThresholdSince" OR
                  private."profileViews" IS DISTINCT FROM source."profileViews") AS mismatch_count,
              (SELECT pg_catalog.count(*)::int FROM public."SellerProfile"
                WHERE "stripeAccountSupported" IS DISTINCT FROM
                  ("stripeAccountVersion" IS NULL OR "stripeAccountVersion" = 'v2')) AS snapshot_mismatch_count`)).rows[0];
            assert.equal(convergence.public_count, convergence.private_count);
            assert.equal(convergence.mismatch_count, 0);
            assert.equal(convergence.snapshot_mismatch_count, 0);
            const functions = (await client.query(`SELECT routine.proname AS name,
              pg_catalog.pg_get_userbyid(routine.proowner) AS owner, routine.prosrc,
              routine.prosecdef, routine.provolatile, routine.proparallel, routine.proconfig,
              pg_catalog.has_function_privilege('grainline_app_runtime', routine.oid, 'EXECUTE') AS runtime_execute,
              EXISTS (SELECT 1
                FROM pg_catalog.aclexplode(COALESCE(routine.proacl,
                  pg_catalog.acldefault('f', routine.proowner))) AS acl
                WHERE acl.grantee = 0
                  AND acl.privilege_type = 'EXECUTE') AS public_execute
              FROM pg_catalog.pg_proc AS routine
              JOIN pg_catalog.pg_namespace AS namespace ON namespace.oid = routine.pronamespace
              WHERE namespace.nspname = 'public' AND routine.proname = ANY($1::text[])
              ORDER BY routine.proname`, [[
                'grainline_seller_profile_private_mirror',
                'grainline_seller_profile_supported_snapshot',
              ]])).rows;
            assert.deepEqual(functions, [
              {name: 'grainline_seller_profile_private_mirror', owner: 'neondb_owner',
                prosrc: reviewedBody('grainline_seller_profile_private_mirror'),
                prosecdef: true, provolatile: 'v', proparallel: 'u',
                proconfig: ['search_path=pg_catalog'], runtime_execute: false, public_execute: false},
              {name: 'grainline_seller_profile_supported_snapshot', owner: 'neondb_owner',
                prosrc: reviewedBody('grainline_seller_profile_supported_snapshot'),
                prosecdef: true, provolatile: 'v', proparallel: 'u',
                proconfig: ['search_path=pg_catalog'], runtime_execute: false, public_execute: false},
            ]);
            const triggers = (await client.query(`SELECT tgname AS name, tgenabled AS enabled,
              pg_catalog.pg_get_triggerdef(oid, true) AS definition
              FROM pg_catalog.pg_trigger
              WHERE tgrelid = 'public."SellerProfile"'::regclass
                AND tgname = ANY($1::text[]) AND NOT tgisinternal ORDER BY tgname`, [[
                  'SellerProfile_private_mirror', 'SellerProfile_supported_snapshot',
                ]])).rows;
            assert.equal(triggers.length, 2);
            assert.deepEqual(triggers.map(({name, enabled}) => ({name, enabled})), [
              {name: 'SellerProfile_private_mirror', enabled: 'O'},
              {name: 'SellerProfile_supported_snapshot', enabled: 'O'},
            ]);
            assert.match(triggers[0].definition,
              /AFTER INSERT OR UPDATE OF .* ON "SellerProfile" FOR EACH ROW EXECUTE FUNCTION grainline_seller_profile_private_mirror\(\)/u);
            assert.match(triggers[1].definition,
              /BEFORE INSERT OR UPDATE OF "stripeAccountVersion", "stripeAccountSupported" ON "SellerProfile" FOR EACH ROW EXECUTE FUNCTION grainline_seller_profile_supported_snapshot\(\)/u);
            await client.query('COMMIT');
            writeFileSync(`${process.env.RUNNER_TEMP}/seller-profile-private-postflight.json`,
              JSON.stringify({status: 'passed', releaseCommit: process.env.GITHUB_SHA,
                migration, issueCount: 0, publicCount: convergence.public_count,
                privateCount: convergence.private_count}),
              {mode: 0o600, flag: 'wx'});
          } finally {
            try { await client.query('ROLLBACK'); } catch {}
            await client.end();
          }
          NODE
      - name: Require no pending migrations after apply
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
          REVIEWED_PENDING_MIGRATIONS: ""
        run: |
          node scripts/assert-reviewed-pending-migrations.mjs
          npx prisma migrate status
      - name: Audit global runtime grants
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
          GRANT_AUDIT_DATABASE_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
        run: npm run audit:db-grants -- --require-direct-url
      - name: Preserve sanitized SellerProfile private-boundary evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: seller-profile-private-boundary-production-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/seller-profile-private-preflight.json
            ${{ runner.temp }}/seller-profile-private-postflight.json
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: false
