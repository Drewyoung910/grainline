name: Case Lifecycle PostgreSQL Proof

on:
  push:
    branches:
      - agent/case-integrity-phase1b-20260726
    paths:
      - .github/workflows/case-lifecycle-postgres-proof.yml
      - package.json
      - package-lock.json
      - prisma/**
      - scripts/case-lifecycle-postgres-proof.mjs
      - scripts/prepare-ci-rls-runtime-role.sql
      - scripts/provision-runtime-db-role.sql
      - src/app/api/cases/**
      - src/app/api/orders/**
      - src/lib/caseLifecycleLocks.ts
      - src/lib/caseMessagingState.ts
      - tests/case-lifecycle-postgres-proof.test.mjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: grainline_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d grainline_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/grainline_ci?sslmode=disable
      DIRECT_URL: postgresql://ci:ci@localhost:5432/grainline_ci?sslmode=disable
      CASE_LIFECYCLE_PROOF_DATABASE_URL: postgresql://ci:ci@localhost:5432/grainline_ci?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prisma generate
      - name: Prepare CI runtime policy role
        run: psql "$DIRECT_URL" -f scripts/prepare-ci-rls-runtime-role.sql
      - name: Apply the current migration tree
        run: npx prisma migrate deploy
      - name: Converge production-style runtime grants
        run: psql "$DIRECT_URL" -v runtime_role=grainline_app_runtime -v migration_role=ci -f scripts/provision-runtime-db-role.sql
      - name: Verify migration status
        run: npx prisma migrate status
      - name: Audit final runtime grants and RLS catalog
        run: GRANT_AUDIT_DATABASE_URL="$DIRECT_URL" RUNTIME_DB_ROLE=grainline_app_runtime MIGRATION_DB_ROLE=ci npm run audit:db-grants -- --allow-loopback-ci
      - name: Run static proof-harness contracts
        run: >-
          node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON
          --experimental-strip-types
          --test tests/case-lifecycle-postgres-proof.test.mjs
      - name: Prove Case lifecycle winner orderings in disposable PostgreSQL
        run: npm run audit:rls-case-lifecycle-races
