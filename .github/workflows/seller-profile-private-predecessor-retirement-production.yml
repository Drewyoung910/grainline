name: SellerProfile Private Predecessor Retirement Production

on:
  workflow_dispatch:
    inputs:
      release_commit:
        description: Exact reviewed main commit already live on all canonical aliases
        required: true
        type: string
      main_ci_run_id:
        description: Successful full push CI run for that exact main commit
        required: true
        type: string
      production_deployment_id:
        description: Exact live SellerProfile-private converted deployment
        required: true
        type: string
      confirmation:
        description: Type retire-reviewed-seller-profile-private-predecessor
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: production-database-migrations
  cancel-in-progress: false

jobs:
  apply:
    name: Retire SellerProfile private predecessor columns
    if: >-
      github.repository == 'Drewyoung910/grainline' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      github.run_attempt == 1 &&
      inputs.confirmation == 'retire-reviewed-seller-profile-private-predecessor'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: Production
    env:
      MIGRATION_DB_ROLE: neondb_owner
      PRODUCTION_MIGRATION_CONFIRM: run-reviewed-production-migrations-from-main
      PRODUCTION_MIGRATION_DIRECT_URL_SHA256: ${{ vars.PRODUCTION_MIGRATION_DIRECT_URL_SHA256 }}
      PRODUCTION_MIGRATION_RELEASE_COMMIT: ${{ inputs.release_commit }}
      RUNTIME_DB_ROLE: grainline_app_runtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.2"
          architecture: x64
          check-latest: false
          package-manager-cache: false
          token: ""
      - run: npm ci --ignore-scripts
      - name: Bind retirement to exact live main and completed CI
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          REVIEWED_RELEASE_COMMIT: ${{ inputs.release_commit }}
          REVIEWED_MAIN_CI_RUN_ID: ${{ inputs.main_ci_run_id }}
          REVIEWED_PRODUCTION_DEPLOYMENT_ID: ${{ inputs.production_deployment_id }}
        with:
          script: |
            const sha = process.env.REVIEWED_RELEASE_COMMIT;
            const value = process.env.REVIEWED_MAIN_CI_RUN_ID;
            const deploymentId = process.env.REVIEWED_PRODUCTION_DEPLOYMENT_ID;
            if (!/^[0-9a-f]{40}$/.test(sha ?? '') || sha !== context.sha ||
                !/^[1-9][0-9]{0,19}$/.test(value ?? '') ||
                !/^dpl_[A-Za-z0-9]{20,64}$/.test(deploymentId ?? '')) {
              throw new Error('SellerProfile private predecessor retirement binding drifted');
            }
            const runId = Number(value);
            if (!Number.isSafeInteger(runId)) throw new Error('CI run id is unsafe');
            const [{data: main}, {data: run}] = await Promise.all([
              github.rest.repos.getBranch({...context.repo, branch: 'main'}),
              github.rest.actions.getWorkflowRun({...context.repo, run_id: runId}),
            ]);
            if (main.commit.sha !== sha || run.name !== 'CI' ||
                run.event !== 'push' || run.head_branch !== 'main' ||
                run.head_sha !== sha || run.status !== 'completed' ||
                run.conclusion !== 'success') {
              throw new Error('SellerProfile private predecessor retirement main/CI readback drifted');
            }
      - name: Verify exact converted deployment is live on canonical aliases
        env:
          REVIEWED_PRODUCTION_DEPLOYMENT_ID: ${{ inputs.production_deployment_id }}
          REVIEWED_RELEASE_COMMIT: ${{ inputs.release_commit }}
        run: node scripts/verify-order-email-free-deployment-surface.mjs
      - name: Verify exact retirement source and immutable migration bytes
        shell: bash
        run: |
          set -euo pipefail
          latest="$(find prisma/migrations -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | LC_ALL=C sort | tail -n 1)"
          test "$latest" = "20261015010000_retire_seller_profile_private_predecessor"
          cat <<'DIGESTS' | sha256sum --check --status
          3136a21f44e0be6e488adcad25c2d9c1c7a789e5f7adb387b31309c592c56309  prisma/migrations/20261015000000_correct_seller_profile_private_app_authorities/migration.sql
          d111e615a40cd0c2936eeb137db23c5fbcc63c7acb81bce27a36d71229963b3a  prisma/migrations/20261015010000_retire_seller_profile_private_predecessor/migration.sql
          DIGESTS
          node --test \
            tests/seller-profile-private-app-authorities-hotfix.test.mjs \
            tests/seller-profile-private-predecessor-retirement.test.mjs \
            tests/seller-profile-private-predecessor-retirement-postgres.test.mjs
      - name: Verify owner connection boundary
        run: node scripts/guard-production-migration-runner.mjs
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
      - name: Capture exact correction, convergence, and retirement restart state
        id: preflight
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
          REVIEWED_PRODUCTION_DEPLOYMENT_ID: ${{ inputs.production_deployment_id }}
        run: |
          node --input-type=module - <<'NODE'
          import assert from 'node:assert/strict';
          import {appendFileSync, writeFileSync} from 'node:fs';
          import pg from 'pg';
          const correction = ['20261015000000_correct_seller_profile_private_app_authorities',
            '3136a21f44e0be6e488adcad25c2d9c1c7a789e5f7adb387b31309c592c56309'];
          const retirement = ['20261015010000_retire_seller_profile_private_predecessor',
            'd111e615a40cd0c2936eeb137db23c5fbcc63c7acb81bce27a36d71229963b3a'];
          const privateColumns = ['stripeAccountId','stripeAccountVersion','stripeControllerType',
            'manualStripeReconciliationNeeded','manualStripeReconciliationNote','shipFromName',
            'shipFromLine1','shipFromLine2','shipFromCity','shipFromState','shipFromPostal',
            'shipFromCountry','shipFromPhone','defaultPkgWeightGrams','defaultPkgLengthCm',
            'defaultPkgWidthCm','defaultPkgHeightCm','useCalculatedShipping','preferredCarriers',
            'onboardingStep','onboardingComplete','guildMemberApprovedAt','guildMasterApprovedAt',
            'guildMasterAppliedAt','guildMasterReviewNotes','consecutiveMetricFailures',
            'lastMetricCheckAt','metricWarningSentAt','listingsBelowThresholdSince','profileViews'];
          const client = new pg.Client({connectionString: process.env.DIRECT_URL});
          try {
            await client.connect();
            await client.query('BEGIN ISOLATION LEVEL REPEATABLE READ READ ONLY');
            const ledger = (await client.query(`SELECT migration_name, checksum,
              finished_at IS NOT NULL AS finished, rolled_back_at IS NOT NULL AS rolled_back,
              applied_steps_count::int AS applied_steps_count FROM public._prisma_migrations
              WHERE migration_name = ANY($1::text[]) ORDER BY migration_name`,
              [[correction[0], retirement[0]]])).rows;
            const accepted = ([name, checksum]) => {
              const attempts = ledger.filter(row => row.migration_name === name);
              for (const row of attempts) assert.equal(row.checksum, checksum);
              const successes = attempts.filter(row => row.finished && !row.rolled_back && row.applied_steps_count === 1);
              assert.ok(successes.length <= 1, `${name} has duplicate successes`);
              for (const row of attempts) if (!successes.includes(row)) assert.equal(row.rolled_back, true);
              return successes.length === 1;
            };
            assert.equal(accepted(correction), true, 'required SellerProfile app-authority correction is missing');
            const applied = accepted(retirement);
            const columnCount = Number((await client.query(`SELECT pg_catalog.count(*)::int AS count
              FROM pg_catalog.pg_attribute WHERE attrelid = 'public."SellerProfile"'::regclass
              AND attname = ANY($1::name[]) AND attnum > 0 AND NOT attisdropped`, [privateColumns])).rows[0].count);
            assert.equal(columnCount, applied ? 0 : privateColumns.length);
            const posture = (await client.query(`SELECT
              (SELECT relrowsecurity FROM pg_catalog.pg_class WHERE oid = 'public."SellerProfile"'::regclass) AS public_rls,
              (SELECT relforcerowsecurity FROM pg_catalog.pg_class WHERE oid = 'public."SellerProfile"'::regclass) AS public_force,
              (SELECT relrowsecurity FROM pg_catalog.pg_class WHERE oid = 'public."SellerProfilePrivate"'::regclass) AS private_rls,
              (SELECT relforcerowsecurity FROM pg_catalog.pg_class WHERE oid = 'public."SellerProfilePrivate"'::regclass) AS private_force,
              pg_catalog.has_table_privilege('grainline_app_runtime', 'public."SellerProfilePrivate"',
                'SELECT,INSERT,UPDATE,DELETE,TRUNCATE,REFERENCES,TRIGGER') AS runtime_private_any,
              EXISTS (SELECT 1 FROM pg_catalog.pg_class AS target
                CROSS JOIN LATERAL pg_catalog.aclexplode(
                  coalesce(target.relacl, pg_catalog.acldefault('r', target.relowner))
                ) AS privilege
                WHERE target.oid = 'public."SellerProfilePrivate"'::regclass
                  AND privilege.grantee = 0) AS public_private_any`)).rows[0];
            assert.deepEqual(posture, {public_rls: false, public_force: false,
              private_rls: false, private_force: false, runtime_private_any: false,
              public_private_any: false});
            let convergence = null;
            if (!applied) {
              convergence = (await client.query(`SELECT
                (SELECT pg_catalog.count(*)::int FROM public."SellerProfile") AS public_count,
                (SELECT pg_catalog.count(*)::int FROM public."SellerProfilePrivate") AS private_count,
                (SELECT pg_catalog.count(*)::int FROM public."SellerProfile" AS source
                  FULL JOIN public."SellerProfilePrivate" AS private ON private."sellerProfileId" = source.id
                  WHERE source.id IS NULL OR private."sellerProfileId" IS NULL OR
                    EXISTS (SELECT 1 FROM pg_catalog.jsonb_each(
                      pg_catalog.to_jsonb(private) - ARRAY['sellerProfileId','createdAt','updatedAt']
                    ) AS field(key, value)
                    WHERE pg_catalog.to_jsonb(source) -> field.key IS DISTINCT FROM field.value)) AS mismatch_count`)).rows[0];
              assert.equal(convergence.public_count, convergence.private_count);
              assert.equal(convergence.mismatch_count, 0);
            }
            await client.query('COMMIT');
            appendFileSync(process.env.GITHUB_OUTPUT,
              `state=${applied ? 'applied' : 'pending'}\npending=${applied ? '' : retirement[0]}\n`);
            writeFileSync(`${process.env.RUNNER_TEMP}/seller-profile-private-retirement-preflight.json`,
              JSON.stringify({releaseCommit: process.env.GITHUB_SHA,
                deploymentId: process.env.REVIEWED_PRODUCTION_DEPLOYMENT_ID,
                state: applied ? 'applied' : 'pending', columnCount, posture, convergence}),
              {mode: 0o600, flag: 'wx'});
          } finally {
            try { await client.query('ROLLBACK'); } catch {}
            await client.end();
          }
          NODE
      - name: Require only the reviewed predecessor retirement pending
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
          REVIEWED_PENDING_MIGRATIONS: ${{ steps.preflight.outputs.pending }}
        run: node scripts/assert-reviewed-pending-migrations.mjs
      - name: Apply only the reviewed SellerProfile private predecessor retirement
        if: steps.preflight.outputs.state == 'pending'
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
        run: npx prisma migrate deploy
      - name: Verify complete migration status
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
        run: npx prisma migrate status
      - name: Read back retired columns, exact ledger, initializer, and unchanged posture
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
        run: |
          node --input-type=module - <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync, writeFileSync} from 'node:fs';
          import pg from 'pg';
          const migration = '20261015010000_retire_seller_profile_private_predecessor';
          const checksum = 'd111e615a40cd0c2936eeb137db23c5fbcc63c7acb81bce27a36d71229963b3a';
          const before = JSON.parse(readFileSync(
            `${process.env.RUNNER_TEMP}/seller-profile-private-retirement-preflight.json`, 'utf8'));
          const client = new pg.Client({connectionString: process.env.DIRECT_URL});
          try {
            await client.connect();
            await client.query('BEGIN ISOLATION LEVEL REPEATABLE READ READ ONLY');
            const ledger = (await client.query(`SELECT checksum, finished_at, rolled_back_at,
              applied_steps_count::int AS applied_steps_count FROM public._prisma_migrations
              WHERE migration_name = $1`, [migration])).rows;
            const successes = ledger.filter(row => row.finished_at && row.rolled_back_at === null && row.applied_steps_count === 1);
            assert.equal(successes.length, 1);
            assert.equal(successes[0].checksum, checksum);
            const privateColumnCount = Number((await client.query(`SELECT pg_catalog.count(*)::int AS count
              FROM pg_catalog.pg_attribute WHERE attrelid = 'public."SellerProfile"'::regclass
              AND attname = ANY(ARRAY['stripeAccountId','shipFromLine1','onboardingStep',
                'guildMasterReviewNotes','profileViews']::name[]) AND attnum > 0 AND NOT attisdropped`)).rows[0].count);
            assert.equal(privateColumnCount, 0);
            const triggers = (await client.query(`SELECT tgname FROM pg_catalog.pg_trigger
              WHERE tgrelid = 'public."SellerProfile"'::regclass AND NOT tgisinternal ORDER BY tgname`)).rows.map(row => row.tgname);
            assert.ok(triggers.includes('SellerProfile_private_initialize'));
            assert.ok(!triggers.includes('SellerProfile_private_mirror'));
            assert.ok(!triggers.includes('SellerProfile_supported_snapshot'));
            const initializer = (await client.query(`SELECT prosecdef,
              proconfig = ARRAY['search_path=pg_catalog']::text[] AS fixed_search_path,
              pg_catalog.has_function_privilege('grainline_app_runtime', oid, 'EXECUTE') AS runtime_execute,
              pg_catalog.has_function_privilege('grainline_staff_read_runtime', oid, 'EXECUTE') AS staff_execute,
              pg_catalog.has_function_privilege('public', oid, 'EXECUTE') AS public_execute
              FROM pg_catalog.pg_proc WHERE oid =
                'public.grainline_seller_profile_private_initialize()'::regprocedure`)).rows[0];
            assert.deepEqual(initializer, {prosecdef: true, fixed_search_path: true,
              runtime_execute: false, staff_execute: false, public_execute: false});
            const counts = (await client.query(`SELECT
              (SELECT pg_catalog.count(*)::int FROM public."SellerProfile") AS public_count,
              (SELECT pg_catalog.count(*)::int FROM public."SellerProfilePrivate") AS private_count`)).rows[0];
            assert.equal(counts.public_count, counts.private_count);
            const posture = (await client.query(`SELECT
              (SELECT relrowsecurity FROM pg_catalog.pg_class WHERE oid = 'public."SellerProfile"'::regclass) AS public_rls,
              (SELECT relforcerowsecurity FROM pg_catalog.pg_class WHERE oid = 'public."SellerProfile"'::regclass) AS public_force,
              (SELECT relrowsecurity FROM pg_catalog.pg_class WHERE oid = 'public."SellerProfilePrivate"'::regclass) AS private_rls,
              (SELECT relforcerowsecurity FROM pg_catalog.pg_class WHERE oid = 'public."SellerProfilePrivate"'::regclass) AS private_force,
              pg_catalog.has_table_privilege('grainline_app_runtime', 'public."SellerProfilePrivate"',
                'SELECT,INSERT,UPDATE,DELETE,TRUNCATE,REFERENCES,TRIGGER') AS runtime_private_any,
              EXISTS (SELECT 1 FROM pg_catalog.pg_class AS target
                CROSS JOIN LATERAL pg_catalog.aclexplode(
                  coalesce(target.relacl, pg_catalog.acldefault('r', target.relowner))
                ) AS privilege
                WHERE target.oid = 'public."SellerProfilePrivate"'::regclass
                  AND privilege.grantee = 0) AS public_private_any`)).rows[0];
            assert.deepEqual(posture, before.posture);
            await client.query('COMMIT');
            writeFileSync(`${process.env.RUNNER_TEMP}/seller-profile-private-retirement-postflight.json`,
              JSON.stringify({status: 'passed', releaseCommit: process.env.GITHUB_SHA,
                deploymentId: before.deploymentId, migration, privateColumnCount,
                sellerCount: counts.public_count, posture}), {mode: 0o600, flag: 'wx'});
          } finally {
            try { await client.query('ROLLBACK'); } catch {}
            await client.end();
          }
          NODE
      - name: Audit global runtime grants after SellerProfile predecessor retirement
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
          GRANT_AUDIT_DATABASE_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
        run: npm run audit:db-grants -- --require-direct-url
      - name: Preserve sanitized SellerProfile predecessor-retirement evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: seller-profile-private-retirement-production-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/seller-profile-private-retirement-preflight.json
            ${{ runner.temp }}/seller-profile-private-retirement-postflight.json
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: false
