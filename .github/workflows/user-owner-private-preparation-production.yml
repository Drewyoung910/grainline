name: User Owner-Private Preparation Production

on:
  workflow_dispatch:
    inputs:
      release_commit:
        description: Exact reviewed main commit
        required: true
        type: string
      main_ci_run_id:
        description: Successful full push CI run for that exact main commit
        required: true
        type: string
      user_clerk_provider_lifecycle_preparation_run_id:
        description: Accepted User Clerk Provider Lifecycle Preparation Production run
        required: true
        type: string
      confirmation:
        description: Type apply-reviewed-user-owner-private-preparation
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: production-database-migrations
  cancel-in-progress: false

jobs:
  apply:
    name: Apply reviewed User owner-private preparation
    if: >-
      github.repository == 'Drewyoung910/grainline' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      github.run_attempt == 1 &&
      inputs.confirmation == 'apply-reviewed-user-owner-private-preparation'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: Production
    env:
      MIGRATION_DB_ROLE: neondb_owner
      PRODUCTION_MIGRATION_CONFIRM: run-reviewed-production-migrations-from-main
      PRODUCTION_MIGRATION_DIRECT_URL_SHA256: ${{ vars.PRODUCTION_MIGRATION_DIRECT_URL_SHA256 }}
      PRODUCTION_MIGRATION_RELEASE_COMMIT: ${{ inputs.release_commit }}
      RUNTIME_DB_ROLE: grainline_app_runtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.2"
          architecture: x64
          check-latest: false
          package-manager-cache: false
          token: ""
      - run: npm ci --ignore-scripts
      - name: Bind preparation to exact main, CI, and provider-lifecycle predecessor
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          REVIEWED_RELEASE_COMMIT: ${{ inputs.release_commit }}
          REVIEWED_MAIN_CI_RUN_ID: ${{ inputs.main_ci_run_id }}
          REVIEWED_USER_CLERK_PROVIDER_LIFECYCLE_PREPARATION_RUN_ID: ${{ inputs.user_clerk_provider_lifecycle_preparation_run_id }}
        with:
          script: |
            const sha = process.env.REVIEWED_RELEASE_COMMIT;
            const ciValue = process.env.REVIEWED_MAIN_CI_RUN_ID;
            const preparationValue = process.env.REVIEWED_USER_CLERK_PROVIDER_LIFECYCLE_PREPARATION_RUN_ID;
            if (!/^[0-9a-f]{40}$/.test(sha ?? '') || sha !== context.sha ||
                !/^[1-9][0-9]{0,19}$/.test(ciValue ?? '') ||
                !/^[1-9][0-9]{0,19}$/.test(preparationValue ?? '')) {
              throw new Error('User owner-private preparation binding drifted');
            }
            const ciRunId = Number(ciValue);
            const preparationRunId = Number(preparationValue);
            if (!Number.isSafeInteger(ciRunId) || !Number.isSafeInteger(preparationRunId)) {
              throw new Error('User owner-private run id is unsafe');
            }
            if (preparationRunId !== 37173784936) {
              throw new Error('User Clerk provider lifecycle preparation run id drifted');
            }
            const [{data: main}, {data: ci}, {data: preparation}] = await Promise.all([
              github.rest.repos.getBranch({...context.repo, branch: 'main'}),
              github.rest.actions.getWorkflowRun({...context.repo, run_id: ciRunId}),
              github.rest.actions.getWorkflowRun({...context.repo, run_id: preparationRunId}),
            ]);
            if (main.commit.sha !== sha || ci.name !== 'CI' ||
                ci.event !== 'push' || ci.head_branch !== 'main' ||
                ci.head_sha !== sha || ci.status !== 'completed' ||
                ci.conclusion !== 'success') {
              throw new Error('User owner-private main/CI readback drifted');
            }
            if (preparation.name !== 'User Clerk Provider Lifecycle Preparation Production' ||
                preparation.event !== 'workflow_dispatch' || preparation.head_branch !== 'main' ||
                preparation.head_sha !== 'c96edf343f53e74244293ef465d07ceaab17fb30' ||
                preparation.run_attempt !== 1 || preparation.status !== 'completed' ||
                preparation.conclusion !== 'success') {
              throw new Error('User Clerk provider lifecycle preparation predecessor drifted');
            }
      - name: Verify exact User owner-private source package
        shell: bash
        run: |
          set -euo pipefail
          latest="$(find prisma/migrations -mindepth 1 -maxdepth 1 -type d -print | LC_ALL=C sort | tail -n 1)"
          test "$latest" = "prisma/migrations/20261004010000_prepare_user_owner_private_authorities"
          echo "07604e3a3d93c0a20bfbd13a3a6393c6bf7e5b4b158100ca91ef32794846291b  prisma/migrations/20261004010000_prepare_user_owner_private_authorities/migration.sql" | sha256sum --check --status
          node --test \
            tests/account-privacy-observability.test.mjs \
            tests/mutation-rate-limit-sweep.test.mjs \
            tests/terms-acceptance-enforcement.test.mjs \
            tests/user-owner-private-authorities.test.mjs \
            tests/user-owner-private-authorities-postgres.test.mjs \
            tests/user-owner-private-production-inspect.test.mjs \
            tests/user-owner-private-preparation-production-workflow.test.mjs \
            tests/user-identity-source-inventory.test.mjs
      - name: Verify owner connection boundary
        run: node scripts/guard-production-migration-runner.mjs
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
      - name: Read exact predecessor and candidate ledger state
        id: ledger
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
        run: |
          node --input-type=module - <<'NODE'
          import assert from 'node:assert/strict';
          import {appendFileSync} from 'node:fs';
          import pg from 'pg';
          const predecessor = Object.freeze({
            name: '20261004000000_prepare_user_clerk_provider_lifecycle',
            checksum: '6c5407b40e59ef1a6734b042e01476d8665253bcfd3fb4a257b79fe4f2963a34',
          });
          const candidate = Object.freeze({
            name: '20261004010000_prepare_user_owner_private_authorities',
            checksum: '07604e3a3d93c0a20bfbd13a3a6393c6bf7e5b4b158100ca91ef32794846291b',
          });
          const client = new pg.Client({connectionString: process.env.DIRECT_URL});
          try {
            await client.connect();
            await client.query('BEGIN ISOLATION LEVEL REPEATABLE READ READ ONLY');
            const rows = (await client.query(`
              SELECT migration_name, checksum, finished_at, rolled_back_at,
                     applied_steps_count
                FROM public._prisma_migrations
               WHERE migration_name = ANY($1::text[])
               ORDER BY started_at, id
            `, [[predecessor.name, candidate.name]])).rows;
            const accepted = (row, expected) => row?.checksum === expected.checksum &&
              row.finished_at && row.rolled_back_at === null &&
              Number(row.applied_steps_count) === 1;
            const predecessorRows = rows.filter((row) =>
              row.migration_name === predecessor.name);
            assert.equal(predecessorRows.length, 1);
            assert.equal(accepted(predecessorRows[0], predecessor), true);
            const candidateRows = rows.filter((row) =>
              row.migration_name === candidate.name);
            assert.ok(candidateRows.length === 0 ||
              (candidateRows.length === 1 && accepted(candidateRows[0], candidate)));
            assert.equal(rows.length, 1 + candidateRows.length);
            const incomplete = await client.query(`
              SELECT count(*)::integer AS count
                FROM public._prisma_migrations
               WHERE finished_at IS NULL AND rolled_back_at IS NULL
            `);
            assert.equal(incomplete.rows[0].count, 0);
            appendFileSync(process.env.GITHUB_OUTPUT,
              `state=${candidateRows.length === 1 ? 'applied' : 'pending'}\n`);
            await client.query('ROLLBACK');
          } finally {
            try { await client.query('ROLLBACK'); } catch {}
            await client.end();
          }
          NODE
      - name: Capture read-only preflight catalogs
        shell: bash
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
          EXPECTED_USER_CLERK_IDENTITY_STATE: applied
          EXPECTED_USER_CURRENT_CLERK_STATE: applied
          EXPECTED_USER_CLERK_PROVIDER_LIFECYCLE_STATE: applied
          EXPECTED_USER_OWNER_PRIVATE_STATE: ${{ steps.ledger.outputs.state }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -m 700 "$RUNNER_TEMP/user-owner-private-pre"
          node scripts/user-clerk-identity-production-inspect.mjs \
            > "$RUNNER_TEMP/user-owner-private-pre/user-clerk-identity.json"
          node scripts/user-current-clerk-authorities-production-inspect.mjs \
            > "$RUNNER_TEMP/user-owner-private-pre/user-current-clerk.json"
          node scripts/user-clerk-provider-lifecycle-production-inspect.mjs \
            > "$RUNNER_TEMP/user-owner-private-pre/user-clerk-provider-lifecycle.json"
          node scripts/user-owner-private-production-inspect.mjs \
            > "$RUNNER_TEMP/user-owner-private-pre/user-owner-private.json"
      - name: Require every predecessor applied and no unrelated migration pending
        shell: bash
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
          MIGRATION_STATE: ${{ steps.ledger.outputs.state }}
        run: |
          set -euo pipefail
          migration=20261004010000_prepare_user_owner_private_authorities
          if [[ "$MIGRATION_STATE" == "pending" ]]; then
            holding="$RUNNER_TEMP/$migration"
            mv "prisma/migrations/$migration" "$holding"
            trap 'if [[ -d "$holding" ]]; then mv "$holding" "prisma/migrations/$migration"; fi' EXIT
            npx prisma migrate status
            mv "$holding" "prisma/migrations/$migration"
            trap - EXIT
          elif [[ "$MIGRATION_STATE" == "applied" ]]; then
            npx prisma migrate status
          else
            echo "Unexpected User owner-private migration state" >&2
            exit 1
          fi
      - name: Apply only reviewed User owner-private preparation
        if: steps.ledger.outputs.state == 'pending'
        run: npx prisma migrate deploy
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
      - name: Read back exact applied ledger
        shell: bash
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
        run: |
          set -euo pipefail
          umask 077
          node --input-type=module - <<'NODE'
          import assert from 'node:assert/strict';
          import {writeFileSync} from 'node:fs';
          import pg from 'pg';
          const migration = '20261004010000_prepare_user_owner_private_authorities';
          const checksum = '07604e3a3d93c0a20bfbd13a3a6393c6bf7e5b4b158100ca91ef32794846291b';
          const client = new pg.Client({connectionString: process.env.DIRECT_URL});
          try {
            await client.connect();
            await client.query('BEGIN ISOLATION LEVEL REPEATABLE READ READ ONLY');
            const rows = (await client.query(`
              SELECT checksum, finished_at, rolled_back_at, applied_steps_count
                FROM public._prisma_migrations
               WHERE migration_name = $1
            `, [migration])).rows;
            assert.equal(rows.length, 1);
            assert.equal(rows[0].checksum, checksum);
            assert.ok(rows[0].finished_at);
            assert.equal(rows[0].rolled_back_at, null);
            assert.equal(Number(rows[0].applied_steps_count), 1);
            await client.query('ROLLBACK');
            writeFileSync(
              `${process.env.RUNNER_TEMP}/user-owner-private-ledger.json`,
              `${JSON.stringify({status: 'passed', migration, checksum,
                appliedStepsCount: 1}, null, 2)}\n`,
              {mode: 0o600, flag: 'wx'},
            );
          } finally {
            try { await client.query('ROLLBACK'); } catch {}
            await client.end();
          }
          NODE
      - name: Capture and compare read-only postflight catalogs
        shell: bash
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
          EXPECTED_USER_CLERK_IDENTITY_STATE: applied
          EXPECTED_USER_CURRENT_CLERK_STATE: applied
          EXPECTED_USER_CLERK_PROVIDER_LIFECYCLE_STATE: applied
          EXPECTED_USER_OWNER_PRIVATE_STATE: applied
        run: |
          set -euo pipefail
          umask 077
          mkdir -m 700 "$RUNNER_TEMP/user-owner-private-post"
          node scripts/user-clerk-identity-production-inspect.mjs \
            > "$RUNNER_TEMP/user-owner-private-post/user-clerk-identity.json"
          node scripts/user-current-clerk-authorities-production-inspect.mjs \
            > "$RUNNER_TEMP/user-owner-private-post/user-current-clerk.json"
          node scripts/user-clerk-provider-lifecycle-production-inspect.mjs \
            > "$RUNNER_TEMP/user-owner-private-post/user-clerk-provider-lifecycle.json"
          node scripts/user-owner-private-production-inspect.mjs \
            > "$RUNNER_TEMP/user-owner-private-post/user-owner-private.json"
          node --input-type=module - <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const read = (path) => JSON.parse(readFileSync(path, 'utf8'));
          const pre = `${process.env.RUNNER_TEMP}/user-owner-private-pre`;
          const post = `${process.env.RUNNER_TEMP}/user-owner-private-post`;
          const preIdentity = read(`${pre}/user-clerk-identity.json`);
          const postIdentity = read(`${post}/user-clerk-identity.json`);
          const preCurrent = read(`${pre}/user-current-clerk.json`);
          const postCurrent = read(`${post}/user-current-clerk.json`);
          const preLifecycle = read(`${pre}/user-clerk-provider-lifecycle.json`);
          const postLifecycle = read(`${post}/user-clerk-provider-lifecycle.json`);
          const preOwner = read(`${pre}/user-owner-private.json`);
          const postOwner = read(`${post}/user-owner-private.json`);
          assert.deepEqual(postIdentity, preIdentity);
          assert.deepEqual(postCurrent, preCurrent);
          assert.deepEqual(postLifecycle, preLifecycle);
          assert.deepEqual(postOwner.catalog.identity, preOwner.catalog.identity);
          assert.deepEqual(postOwner.catalog.tables, preOwner.catalog.tables);
          assert.equal(postOwner.result.expectedState, 'applied');
          assert.equal(postOwner.result.functionCount, 3);
          assert.equal(postOwner.result.productionChanged, false);
          assert.equal(postOwner.result.rowDataRead, false);
          NODE
      - name: Audit runtime grants after User owner-private preparation
        env:
          GRANT_AUDIT_DATABASE_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
        run: npm run audit:db-grants
      - name: Verify final Prisma migration status
        run: npx prisma migrate status
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
      - name: Preserve sanitized preflight, ledger, and postflight evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: user-owner-private-preparation-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/user-owner-private-pre/*.json
            ${{ runner.temp }}/user-owner-private-ledger.json
            ${{ runner.temp }}/user-owner-private-post/*.json
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: false
