name: Order Refund #648 Historical Inventory Production

on:
  workflow_dispatch:
    inputs:
      release_commit:
        description: Exact reviewed main commit
        required: true
        type: string
      main_ci_run_id:
        description: Successful full push CI run for that exact main commit
        required: true
        type: string
      confirmation:
        description: Type run-read-only-order-refund-648-inventory
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: production-database-inspections
  cancel-in-progress: false

jobs:
  inspect:
    name: Inventory historical #648 refund state read-only
    if: >-
      github.repository == 'Drewyoung910/grainline' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      github.run_attempt == 1 &&
      inputs.confirmation == 'run-read-only-order-refund-648-inventory'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: Production
    env:
      MIGRATION_DB_ROLE: neondb_owner
      PRODUCTION_MIGRATION_CONFIRM: run-reviewed-production-migrations-from-main
      PRODUCTION_MIGRATION_DIRECT_URL_SHA256: ${{ vars.PRODUCTION_MIGRATION_DIRECT_URL_SHA256 }}
      PRODUCTION_MIGRATION_RELEASE_COMMIT: ${{ inputs.release_commit }}
      RUNTIME_DB_ROLE: grainline_app_runtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.2"
          architecture: x64
          check-latest: false
          package-manager-cache: false
          token: ""
      - run: npm ci --ignore-scripts
      - name: Bind inspection to exact main and completed push CI
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          REVIEWED_RELEASE_COMMIT: ${{ inputs.release_commit }}
          REVIEWED_MAIN_CI_RUN_ID: ${{ inputs.main_ci_run_id }}
        with:
          script: |
            const sha = process.env.REVIEWED_RELEASE_COMMIT;
            const value = process.env.REVIEWED_MAIN_CI_RUN_ID;
            if (!/^[0-9a-f]{40}$/.test(sha ?? '') || sha !== context.sha ||
                !/^[1-9][0-9]{0,19}$/.test(value ?? '')) {
              throw new Error('Order refund #648 inventory binding drifted');
            }
            const runId = Number(value);
            if (!Number.isSafeInteger(runId)) throw new Error('CI run id is unsafe');
            const [{data: main}, {data: run}] = await Promise.all([
              github.rest.repos.getBranch({...context.repo, branch: 'main'}),
              github.rest.actions.getWorkflowRun({...context.repo, run_id: runId}),
            ]);
            if (main.commit.sha !== sha || run.name !== 'CI' ||
                run.event !== 'push' || run.head_branch !== 'main' ||
                run.head_sha !== sha || run.status !== 'completed' ||
                run.conclusion !== 'success') {
              throw new Error('Order refund #648 inventory main/CI readback drifted');
            }
            const exactPushRuns = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              {
                ...context.repo,
                branch: 'main',
                event: 'push',
                head_sha: sha,
                per_page: 100,
              },
            );
            const latestByWorkflow = new Map();
            for (const exactRun of exactPushRuns) {
              if (exactRun.head_sha !== sha || exactRun.head_branch !== 'main' ||
                  exactRun.event !== 'push') continue;
              const key = exactRun.path || exactRun.name;
              const previous = latestByWorkflow.get(key);
              if (!previous || Number(exactRun.id) > Number(previous.id)) {
                latestByWorkflow.set(key, exactRun);
              }
            }
            const requiredPushWorkflowPaths = new Set([
              '.github/workflows/ci.yml',
              '.github/workflows/account-deletion-worker-bootstrap-proof.yml',
              '.github/workflows/order-staff-bootstrap-proof.yml',
              '.github/workflows/order-paid-repair-lock-proof.yml',
              '.github/workflows/order-account-deletion-concurrency-proof.yml',
            ]);
            const missingPushWorkflows = [...requiredPushWorkflowPaths]
              .filter((path) => !latestByWorkflow.has(path));
            if (missingPushWorkflows.length !== 0) {
              throw new Error(
                `Required exact-main push workflows are absent: ${missingPushWorkflows.join(', ')}`,
              );
            }
            const unacceptablePushRuns = [...latestByWorkflow.values()]
              .filter((exactRun) => exactRun.status !== 'completed' ||
                exactRun.conclusion !== 'success');
            if (unacceptablePushRuns.length !== 0) {
              throw new Error(
                `Exact-main push workflows are not all green: ${unacceptablePushRuns
                  .map((exactRun) =>
                    `${exactRun.name}:${exactRun.status}/${exactRun.conclusion}`)
                  .join(', ')}`,
              );
            }
      - name: Verify exact aggregate-only inventory source and behavior
        shell: bash
        run: |
          set -euo pipefail
          echo "2277394d0359f2068bede7b93fb3b62b4b4e1c72b5f2ec53091c948082099294  scripts/order-refund-648-production-inventory.sql" \
            | sha256sum --check --status
          echo "713729682c04242cc5d1659170500a183471fbdde9e266a5bb460fb019788743  scripts/order-refund-648-production-inventory.mjs" \
            | sha256sum --check --status
          node --test tests/order-refund-648-production-inventory.test.mjs
      - name: Verify owner connection boundary
        run: node scripts/guard-production-migration-runner.mjs
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
      - name: Run aggregate-only historical refund inventory read-only
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
          ORDER_REFUND_648_INVENTORY_CONFIRM: read-only-order-refund-648-inventory
          ORDER_REFUND_648_INVENTORY_EVIDENCE_PATH: ${{ runner.temp }}/order-refund-648-production-inventory.json
          ORDER_REFUND_648_INVENTORY_RELEASE_COMMIT: ${{ inputs.release_commit }}
        run: node scripts/order-refund-648-production-inventory.mjs
      - name: Preserve private-safe aggregate inventory evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: order-refund-648-production-inventory-${{ github.run_id }}
          path: ${{ runner.temp }}/order-refund-648-production-inventory.json
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: false
