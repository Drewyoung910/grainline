name: DirectUpload Cleanup

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type run-reviewed-direct-upload-cleanup
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-direct-upload-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    name: Delete expired unreferenced DirectUploads
    if: github.repository == 'Drewyoung910/grainline' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Production DirectUpload Cleanup
    env:
      DIRECT_UPLOAD_CLEANUP_CONFIRM: ${{ inputs.confirmation }}
      DIRECT_UPLOAD_CLEANUP_DATABASE_URL_SHA256: ${{ vars.DIRECT_UPLOAD_CLEANUP_DATABASE_URL_SHA256 }}
      DIRECT_UPLOAD_CLEANUP_R2_ACCOUNT_ID: ${{ vars.DIRECT_UPLOAD_CLEANUP_R2_ACCOUNT_ID }}
      DIRECT_UPLOAD_CLEANUP_R2_PRIVATE_BUCKET: ${{ vars.DIRECT_UPLOAD_CLEANUP_R2_PRIVATE_BUCKET }}
      DIRECT_UPLOAD_CLEANUP_R2_PUBLIC_BUCKET: ${{ vars.DIRECT_UPLOAD_CLEANUP_R2_PUBLIC_BUCKET }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Run isolated DirectUpload cleanup
        run: npm run ops:direct-upload-cleanup-worker
        env:
          DIRECT_UPLOAD_CLEANUP_DATABASE_URL: ${{ secrets.DIRECT_UPLOAD_CLEANUP_DATABASE_URL }}
          DIRECT_UPLOAD_CLEANUP_EVIDENCE_PATH: ${{ runner.temp }}/direct-upload-cleanup-${{ github.run_id }}-${{ github.run_attempt }}.json
          DIRECT_UPLOAD_CLEANUP_R2_ACCESS_KEY_ID: ${{ secrets.DIRECT_UPLOAD_CLEANUP_R2_ACCESS_KEY_ID }}
          DIRECT_UPLOAD_CLEANUP_R2_SECRET_ACCESS_KEY: ${{ secrets.DIRECT_UPLOAD_CLEANUP_R2_SECRET_ACCESS_KEY }}
      - name: Upload sanitized cleanup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: direct-upload-cleanup-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/direct-upload-cleanup-${{ github.run_id }}-${{ github.run_attempt }}.json
          if-no-files-found: warn
          retention-days: 30
