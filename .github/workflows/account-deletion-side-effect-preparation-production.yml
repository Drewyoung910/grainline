name: AccountDeletionSideEffect Preparation Production

on:
  workflow_dispatch:
    inputs:
      release_commit:
        description: Exact reviewed main commit
        required: true
        type: string
      main_ci_run_id:
        description: Successful full push CI run for that exact main commit
        required: true
        type: string
      preflight_inspection_run_id:
        description: Successful exact-commit compatible-state inspection run
        required: true
        type: string
      confirmation:
        description: Type apply-reviewed-account-deletion-side-effect-preparation
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: production-database-migrations
  cancel-in-progress: false

jobs:
  apply:
    name: Apply AccountDeletionSideEffect preparation
    if: >-
      github.repository == 'Drewyoung910/grainline' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      github.run_attempt == 1 &&
      inputs.confirmation == 'apply-reviewed-account-deletion-side-effect-preparation'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: Production
    env:
      MIGRATION_DB_ROLE: neondb_owner
      PRODUCTION_MIGRATION_CONFIRM: run-reviewed-production-migrations-from-main
      PRODUCTION_MIGRATION_DIRECT_URL_SHA256: ${{ vars.PRODUCTION_MIGRATION_DIRECT_URL_SHA256 }}
      PRODUCTION_MIGRATION_RELEASE_COMMIT: ${{ inputs.release_commit }}
      RUNTIME_DB_ROLE: grainline_app_runtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.2"
          architecture: x64
          check-latest: false
          package-manager-cache: false
          token: ""
      - run: npm ci --ignore-scripts
      - run: npx prisma generate
      - name: Bind preparation to exact main, CI, and preflight inspection
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          REVIEWED_RELEASE_COMMIT: ${{ inputs.release_commit }}
          REVIEWED_MAIN_CI_RUN_ID: ${{ inputs.main_ci_run_id }}
          REVIEWED_PREFLIGHT_INSPECTION_RUN_ID: ${{ inputs.preflight_inspection_run_id }}
        with:
          script: |
            const sha = process.env.REVIEWED_RELEASE_COMMIT;
            const ciValue = process.env.REVIEWED_MAIN_CI_RUN_ID;
            const inspectionValue = process.env.REVIEWED_PREFLIGHT_INSPECTION_RUN_ID;
            if (!/^[0-9a-f]{40}$/.test(sha ?? '') || sha !== context.sha ||
                !/^[1-9][0-9]{0,19}$/.test(ciValue ?? '') ||
                !/^[1-9][0-9]{0,19}$/.test(inspectionValue ?? '')) {
              throw new Error('AccountDeletionSideEffect preparation release binding drifted');
            }
            const ciRunId = Number(ciValue);
            const inspectionRunId = Number(inspectionValue);
            if (!Number.isSafeInteger(ciRunId) || !Number.isSafeInteger(inspectionRunId)) {
              throw new Error('AccountDeletionSideEffect preparation run id is unsafe');
            }
            const [{data: main}, {data: ci}, {data: inspection}] = await Promise.all([
              github.rest.repos.getBranch({...context.repo, branch: 'main'}),
              github.rest.actions.getWorkflowRun({...context.repo, run_id: ciRunId}),
              github.rest.actions.getWorkflowRun({...context.repo, run_id: inspectionRunId}),
            ]);
            if (main.commit.sha !== sha || ci.name !== 'CI' ||
                ci.event !== 'push' || ci.head_branch !== 'main' ||
                ci.head_sha !== sha || ci.status !== 'completed' ||
                ci.conclusion !== 'success') {
              throw new Error('AccountDeletionSideEffect preparation main/CI readback drifted');
            }
            if (inspection.path !== '.github/workflows/account-deletion-side-effect-production-inspection.yml' ||
                inspection.display_title !== `AccountDeletionSideEffect Production Inspection [compatible] ${sha}` ||
                inspection.event !== 'workflow_dispatch' ||
                inspection.head_branch !== 'main' || inspection.head_sha !== sha ||
                inspection.run_attempt !== 1 || inspection.status !== 'completed' ||
                inspection.conclusion !== 'success') {
              throw new Error('AccountDeletionSideEffect preparation preflight inspection readback drifted');
            }
      - name: Verify AccountDeletionSideEffect preparation release source
        run: >-
          node --test
          tests/account-deletion-side-effect-production-inspect.test.mjs
          tests/account-deletion-side-effect-production-workflows.test.mjs
          tests/account-deletion-side-effect-database-contract.test.mjs
      - name: Verify exact AccountDeletionSideEffect preparation bytes
        shell: bash
        run: |
          set -euo pipefail
          test "$(find prisma/migrations -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort | tail -n 1)" = \
            "20261011180000_enable_account_deletion_side_effect_rls"
          echo "2b79282ad52c8f4f5c417eebeb1593b157bd66b8fd66d792185865383e1f5924  prisma/migrations/20261011170000_prepare_account_deletion_side_effect_claim_fence/migration.sql" | sha256sum --check --status
          echo "d132a70f9673815f8e789151761ed2da1031c5d58c8313c6dc25fe7c430a0ba9  prisma/migrations/20261011173000_prepare_account_deletion_media_key_fence/migration.sql" | sha256sum --check --status
          echo "86b511f8fec0104c4ef3c1fbc7b2017d40847b286ac92bf26cdafc12518c5b3b  prisma/migrations/20261011180000_enable_account_deletion_side_effect_rls/migration.sql" | sha256sum --check --status
      - name: Verify owner connection boundary
        run: node scripts/guard-production-migration-runner.mjs
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
      - name: Inspect restart-safe AccountDeletionSideEffect state before apply
        id: preflight
        shell: bash
        env:
          ACCOUNT_DELETION_EXPECTED_STATE: compatible
          ACCOUNT_DELETION_INSPECT_CONFIRM: inspect-reviewed-account-deletion-side-effect-preparation
          ACCOUNT_DELETION_INSPECT_EVIDENCE_PATH: ${{ runner.temp }}/account-deletion-side-effect-production-inspection-${{ inputs.release_commit }}-compatible.json
          ACCOUNT_DELETION_INSPECT_RELEASE_COMMIT: ${{ inputs.release_commit }}
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
        run: |
          set -euo pipefail
          result="$(node scripts/account-deletion-side-effect-production-inspect.mjs)"
          state="$(node -e 'let value=""; process.stdin.setEncoding("utf8"); process.stdin.on("data", chunk => value += chunk); process.stdin.on("end", () => process.stdout.write(String(JSON.parse(value).result.state)));' <<< "$result")"
          case "$state" in
            pending|preparation_only|prepared) ;;
            *) exit 1 ;;
          esac
          echo "state=$state" >> "$GITHUB_OUTPUT"
      - name: Apply only reviewed AccountDeletionSideEffect preparation migration
        if: steps.preflight.outputs.state != 'prepared'
        shell: bash
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
          ACCOUNT_DELETION_PREFLIGHT_STATE: ${{ steps.preflight.outputs.state }}
        run: |
          set -euo pipefail
          preparation="20261011170000_prepare_account_deletion_side_effect_claim_fence"
          media_key="20261011173000_prepare_account_deletion_media_key_fence"
          activation="20261011180000_enable_account_deletion_side_effect_rls"
          holding="$RUNNER_TEMP/account-deletion-side-effect-production-apply"
          mkdir "$holding"
          restore() {
            for migration in "$preparation" "$media_key" "$activation"; do
              if [[ -d "$holding/$migration" ]]; then
                mv "$holding/$migration" "prisma/migrations/$migration"
              fi
            done
          }
          trap restore EXIT
          mv "prisma/migrations/$preparation" "$holding/$preparation"
          mv "prisma/migrations/$media_key" "$holding/$media_key"
          mv "prisma/migrations/$activation" "$holding/$activation"
          if [[ "$ACCOUNT_DELETION_PREFLIGHT_STATE" == "preparation_only" ]]; then
            mv "$holding/$preparation" "prisma/migrations/$preparation"
          elif [[ "$ACCOUNT_DELETION_PREFLIGHT_STATE" != "pending" ]]; then
            exit 1
          fi
          npx prisma migrate status
          if [[ "$ACCOUNT_DELETION_PREFLIGHT_STATE" == "pending" ]]; then
            mv "$holding/$preparation" "prisma/migrations/$preparation"
          fi
          mv "$holding/$media_key" "prisma/migrations/$media_key"
          test "$(find prisma/migrations -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort | tail -n 1)" = "$media_key"
          npx prisma migrate deploy
          npx prisma migrate status
          restore
          trap - EXIT
          rmdir "$holding"
      - name: Inspect prepared AccountDeletionSideEffect catalog after apply
        env:
          ACCOUNT_DELETION_EXPECTED_STATE: prepared
          ACCOUNT_DELETION_INSPECT_CONFIRM: inspect-reviewed-account-deletion-side-effect-preparation
          ACCOUNT_DELETION_INSPECT_EVIDENCE_PATH: ${{ runner.temp }}/account-deletion-side-effect-production-inspection-${{ inputs.release_commit }}-prepared.json
          ACCOUNT_DELETION_INSPECT_RELEASE_COMMIT: ${{ inputs.release_commit }}
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
        run: node scripts/account-deletion-side-effect-production-inspect.mjs
      - name: Audit global grants after AccountDeletionSideEffect preparation
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
          GRANT_AUDIT_DATABASE_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
        run: npm run audit:db-grants -- --require-direct-url
      - name: Preserve sanitized AccountDeletionSideEffect preparation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: account-deletion-side-effect-preparation-production-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/account-deletion-side-effect-production-inspection-${{ github.sha }}-compatible.json
            ${{ runner.temp }}/account-deletion-side-effect-production-inspection-${{ github.sha }}-prepared.json
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: false
