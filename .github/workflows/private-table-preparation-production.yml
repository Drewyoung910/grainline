name: Private Table Preparation Production

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Reviewed private-table preparation release
        required: true
        type: choice
        options:
          - support_request_v1
          - stock_notification_v1
          - maker_verification_v1
      release_commit:
        description: Exact reviewed main commit
        required: true
        type: string
      main_ci_run_id:
        description: Successful full push CI run for that exact main commit
        required: true
        type: string
      confirmation:
        description: Type apply-reviewed-private-table-preparation
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: production-database-migrations
  cancel-in-progress: false

jobs:
  prepare:
    name: Apply reviewed private-table compatibility preparation
    if: >-
      github.repository == 'Drewyoung910/grainline' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      github.run_attempt == 1 &&
      inputs.confirmation == 'apply-reviewed-private-table-preparation'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: Production
    env:
      MIGRATION_DB_ROLE: neondb_owner
      PRIVATE_TABLE_PREPARATION_RELEASE_ID: ${{ inputs.release_id }}
      PRODUCTION_MIGRATION_CONFIRM: run-reviewed-production-migrations-from-main
      PRODUCTION_MIGRATION_DIRECT_URL_SHA256: ${{ vars.PRODUCTION_MIGRATION_DIRECT_URL_SHA256 }}
      PRODUCTION_MIGRATION_RELEASE_COMMIT: ${{ inputs.release_commit }}
      RUNTIME_DB_ROLE: grainline_app_runtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.2"
          architecture: x64
          check-latest: false
          package-manager-cache: false
          token: ""
      - run: npm ci --ignore-scripts
      - run: npx prisma generate
      - name: Bind preparation to exact main and every exact-main push workflow
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          REVIEWED_RELEASE_COMMIT: ${{ inputs.release_commit }}
          REVIEWED_MAIN_CI_RUN_ID: ${{ inputs.main_ci_run_id }}
        with:
          script: |
            const sha = process.env.REVIEWED_RELEASE_COMMIT;
            const value = process.env.REVIEWED_MAIN_CI_RUN_ID;
            if (!/^[0-9a-f]{40}$/.test(sha ?? '') || sha !== context.sha ||
                !/^[1-9][0-9]{0,19}$/.test(value ?? '')) {
              throw new Error('Private-table preparation binding drifted');
            }
            const runId = Number(value);
            if (!Number.isSafeInteger(runId)) throw new Error('CI run id is unsafe');
            const [{data: main}, {data: ci}] = await Promise.all([
              github.rest.repos.getBranch({...context.repo, branch: 'main'}),
              github.rest.actions.getWorkflowRun({...context.repo, run_id: runId}),
            ]);
            if (main.commit.sha !== sha || ci.name !== 'CI' ||
                ci.path !== '.github/workflows/ci.yml' ||
                ci.event !== 'push' || ci.head_branch !== 'main' ||
                ci.head_sha !== sha || ci.status !== 'completed' ||
                ci.conclusion !== 'success') {
              throw new Error('Private-table preparation main/CI readback drifted');
            }
            const exactPushRuns = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              {...context.repo, branch: 'main', event: 'push', head_sha: sha, per_page: 100},
            );
            const latestByWorkflow = new Map();
            for (const run of exactPushRuns) {
              if (run.head_sha !== sha || run.head_branch !== 'main' ||
                  run.event !== 'push') continue;
              const key = run.path || run.name;
              const previous = latestByWorkflow.get(key);
              if (!previous || Number(run.id) > Number(previous.id)) {
                latestByWorkflow.set(key, run);
              }
            }
            const requiredPushWorkflowPaths = new Set([
              '.github/workflows/ci.yml',
              '.github/workflows/conversation-message-force-proof.yml',
              '.github/workflows/notification-rls-ephemeral-proof.yml',
              '.github/workflows/account-deletion-worker-bootstrap-proof.yml',
              '.github/workflows/order-staff-bootstrap-proof.yml',
              '.github/workflows/order-paid-repair-lock-proof.yml',
              '.github/workflows/order-account-deletion-concurrency-proof.yml',
            ]);
            const missing = [...requiredPushWorkflowPaths]
              .filter((path) => !latestByWorkflow.has(path));
            if (missing.length !== 0) {
              throw new Error(`Required exact-main push workflows are absent: ${missing.join(', ')}`);
            }
            const unacceptable = [...latestByWorkflow.values()]
              .filter((run) => run.status !== 'completed' || run.conclusion !== 'success');
            if (unacceptable.length !== 0) {
              throw new Error(`Exact-main push workflows are not all green: ${unacceptable
                .map((run) => `${run.name}:${run.status}/${run.conclusion}`).join(', ')}`);
            }
      - name: Verify reviewed preparation source before owner access
        shell: bash
        run: |
          set -euo pipefail
          migration="$(node scripts/private-table-preparation-catalog.mjs)"
          test -n "$migration"
          mapfile -t release_tests < <(
            node scripts/private-table-preparation-catalog.mjs --tests
          )
          test "${#release_tests[@]}" -gt 0
          node --test \
            tests/private-table-preparation-production.test.mjs \
            tests/reviewed-pending-migrations.test.mjs \
            tests/stock-notification-preparation-production.test.mjs \
            "${release_tests[@]}"
      - name: Verify owner connection boundary
        run: node scripts/guard-production-migration-runner.mjs
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
      - name: Inspect restart-safe preparation state
        id: preflight
        shell: bash
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
          PRIVATE_TABLE_PREPARATION_PHASE: preflight
          PRIVATE_TABLE_PREPARATION_EVIDENCE_PATH: ${{ runner.temp }}/private-table-preparation-${{ github.sha }}-preflight.json
        run: |
          set -euo pipefail
          state="$(node scripts/private-table-preparation-production-inspect.mjs)"
          case "$state" in
            pending)
              migration="$(node scripts/private-table-preparation-catalog.mjs)"
              echo "pending=$migration" >> "$GITHUB_OUTPUT"
              ;;
            applied) echo "pending=" >> "$GITHUB_OUTPUT" ;;
            *) exit 1 ;;
          esac
          echo "state=$state" >> "$GITHUB_OUTPUT"
      - name: Require only the reviewed preparation migration pending
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
          REVIEWED_PENDING_MIGRATIONS: ${{ steps.preflight.outputs.pending }}
        run: node scripts/assert-reviewed-pending-migrations.mjs
      - name: Apply only the reviewed private-table preparation
        if: steps.preflight.outputs.state == 'pending'
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
        run: npx prisma migrate deploy
      - name: Read back exact compatible preparation catalog
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
          PRIVATE_TABLE_PREPARATION_PHASE: postflight
          PRIVATE_TABLE_PREPARATION_EVIDENCE_PATH: ${{ runner.temp }}/private-table-preparation-${{ github.sha }}-postflight.json
          PRIVATE_TABLE_PREPARATION_PREVIOUS_EVIDENCE_PATH: ${{ runner.temp }}/private-table-preparation-${{ github.sha }}-preflight.json
        run: node scripts/private-table-preparation-production-inspect.mjs
      - name: Require no migrations pending after preparation
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
          REVIEWED_PENDING_MIGRATIONS: ""
        run: |
          node scripts/assert-reviewed-pending-migrations.mjs
          npx prisma migrate status
      - name: Audit global runtime grants after preparation
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
          GRANT_AUDIT_DATABASE_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
        run: npm run audit:db-grants -- --require-direct-url
      - name: Preserve sanitized private-table preparation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: private-table-preparation-production-${{ github.run_id }}
          path: ${{ runner.temp }}/private-table-preparation-${{ github.sha }}-*.json
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: false
