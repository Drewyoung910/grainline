name: Case Refund Provider Recovery Production

on:
  workflow_dispatch:
    inputs:
      release_commit:
        description: Exact reviewed main commit
        required: true
        type: string
      main_ci_run_id:
        description: Successful full push CI run for that exact main commit
        required: true
        type: string
      confirmation:
        description: Type apply-reviewed-case-refund-provider-recovery
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: production-database-migrations
  cancel-in-progress: false

jobs:
  apply:
    name: Apply reviewed Case refund provider recovery
    if: >-
      github.repository == 'Drewyoung910/grainline' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      github.run_attempt == 1 &&
      inputs.confirmation == 'apply-reviewed-case-refund-provider-recovery'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: Production
    env:
      MIGRATION_DB_ROLE: neondb_owner
      PRODUCTION_MIGRATION_CONFIRM: run-reviewed-production-migrations-from-main
      PRODUCTION_MIGRATION_DIRECT_URL_SHA256: ${{ vars.PRODUCTION_MIGRATION_DIRECT_URL_SHA256 }}
      PRODUCTION_MIGRATION_RELEASE_COMMIT: ${{ inputs.release_commit }}
      RUNTIME_DB_ROLE: grainline_app_runtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.2"
          architecture: x64
          check-latest: false
          package-manager-cache: false
          token: ""
      - run: npm ci --ignore-scripts
      - name: Verify exact main and completed CI before credential access
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          REVIEWED_RELEASE_COMMIT: ${{ inputs.release_commit }}
          REVIEWED_MAIN_CI_RUN_ID: ${{ inputs.main_ci_run_id }}
        with:
          script: |
            const sha = process.env.REVIEWED_RELEASE_COMMIT;
            const value = process.env.REVIEWED_MAIN_CI_RUN_ID;
            if (!/^[0-9a-f]{40}$/.test(sha ?? '') || sha !== context.sha ||
                !/^[1-9][0-9]{0,19}$/.test(value ?? '')) {
              throw new Error('Case refund provider-recovery release binding drifted');
            }
            const runId = Number(value);
            if (!Number.isSafeInteger(runId)) throw new Error('CI run id is unsafe');
            const [{data: main}, {data: run}] = await Promise.all([
              github.rest.repos.getBranch({...context.repo, branch: 'main'}),
              github.rest.actions.getWorkflowRun({...context.repo, run_id: runId}),
            ]);
            if (main.commit.sha !== sha || run.name !== 'CI' ||
                run.event !== 'push' || run.head_branch !== 'main' ||
                run.head_sha !== sha || run.status !== 'completed' ||
                run.conclusion !== 'success') {
              throw new Error('Case refund provider-recovery main/CI readback drifted');
            }
      - name: Verify exact migration source and focused behavior
        shell: bash
        run: |
          set -euo pipefail
          latest="$(find prisma/migrations -mindepth 1 -maxdepth 1 -type d -print | LC_ALL=C sort | tail -n 1)"
          test "$latest" = "prisma/migrations/20261001070000_prepare_case_refund_provider_recovery"
          echo "68e559e01dbeae663931110dcadfd4d42ca050c788eebd647727f434a9a72dba  prisma/migrations/20261001070000_prepare_case_refund_provider_recovery/migration.sql" | sha256sum --check --status
          node --test \
            tests/case-refund-provider-recovery.test.mjs \
            tests/case-refund-provider-recovery-postgres.test.mjs \
            tests/case-refund-provider-recovery-production-workflow.test.mjs
      - name: Verify owner connection boundary
        run: node scripts/guard-production-migration-runner.mjs
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
      - name: Capture restart state and unchanged private-ledger posture
        id: preflight
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
        run: |
          node --input-type=module - <<'NODE'
          import assert from 'node:assert/strict';
          import {appendFileSync, writeFileSync} from 'node:fs';
          import pg from 'pg';

          const predecessor = '20261001060000_force_order_shipping_rate_quote_rls';
          const predecessorChecksum =
            '390a307431fdc02c18af3daf8fc3d1ee7b34d2df84784379a523580c60f16d5a';
          const migration = '20261001070000_prepare_case_refund_provider_recovery';
          const checksum =
            '68e559e01dbeae663931110dcadfd4d42ca050c788eebd647727f434a9a72dba';
          const newFunctions = [
            'public.grainline_case_staff_resolution_provider_recovery_load(text,text,public."CaseResolution",integer)',
            'public.grainline_case_staff_resolution_provider_clock(text,text,text,text,text)',
            'public.grainline_case_staff_resolution_provider_recover(text,text,text,bigint,text)',
            'public.grainline_case_staff_resolution_provider_recovery_record(text,text,text,text,text[],text[],text,integer,boolean,boolean)',
            'public.grainline_case_staff_resolution_recovery_finalize(text,text)',
          ];
          const postureSql = `
            SELECT pg_catalog.pg_get_userbyid(relation.relowner) AS owner,
                   relation.relrowsecurity AS rls_enabled,
                   relation.relforcerowsecurity AS force_enabled,
                   relation.relacl::text AS table_acl,
                   COALESCE((SELECT jsonb_agg(jsonb_build_object(
                     'name', policy.polname, 'command', policy.polcmd,
                     'permissive', policy.polpermissive,
                     'roles', policy.polroles::text,
                     'using', pg_catalog.pg_get_expr(policy.polqual, policy.polrelid),
                     'check', pg_catalog.pg_get_expr(policy.polwithcheck, policy.polrelid)
                   ) ORDER BY policy.polname)
                     FROM pg_catalog.pg_policy AS policy
                    WHERE policy.polrelid = relation.oid), '[]'::jsonb) AS policies
              FROM pg_catalog.pg_class AS relation
             WHERE relation.oid = 'public."CaseResolutionClaim"'::regclass`;
          const client = new pg.Client({connectionString: process.env.DIRECT_URL});
          try {
            await client.connect();
            await client.query('BEGIN READ ONLY');
            const ledger = await client.query(`
              SELECT migration_name, checksum, finished_at, rolled_back_at,
                     applied_steps_count
                FROM public._prisma_migrations
               WHERE migration_name = ANY($1::text[])
               ORDER BY migration_name
            `, [[predecessor, migration]]);
            const rows = new Map(ledger.rows.map((row) => [row.migration_name, row]));
            const required = rows.get(predecessor);
            assert.ok(required, 'required quote-FORCE predecessor is not applied');
            assert.equal(required.checksum, predecessorChecksum);
            assert.ok(required.finished_at);
            assert.equal(required.rolled_back_at, null);
            assert.equal(Number(required.applied_steps_count), 1);

            const candidate = rows.get(migration);
            if (candidate) {
              assert.equal(candidate.checksum, checksum);
              assert.ok(candidate.finished_at);
              assert.equal(candidate.rolled_back_at, null);
              assert.equal(Number(candidate.applied_steps_count), 1);
            } else {
              const columns = await client.query(`
                SELECT attribute.attname
                  FROM pg_catalog.pg_attribute AS attribute
                 WHERE attribute.attrelid = 'public."CaseResolutionClaim"'::regclass
                   AND attribute.attname LIKE 'providerRecovery%'
                   AND attribute.attnum > 0
                   AND NOT attribute.attisdropped
              `);
              assert.deepEqual(columns.rows, []);
              const collisions = await client.query(`
                SELECT pg_catalog.to_regclass(
                         'public."CaseResolutionClaim_providerRecoveryActorId_status_idx"'
                       )::text AS index_identity,
                       pg_catalog.to_regprocedure($1)::text AS recovery_load,
                       pg_catalog.to_regprocedure($2)::text AS provider_clock,
                       pg_catalog.to_regprocedure($3)::text AS provider_recover,
                       pg_catalog.to_regprocedure($4)::text AS recovery_record,
                       pg_catalog.to_regprocedure($5)::text AS recovery_finalize
              `, newFunctions);
              assert.deepEqual(collisions.rows, [{
                index_identity: null,
                recovery_load: null,
                provider_clock: null,
                provider_recover: null,
                recovery_record: null,
                recovery_finalize: null,
              }]);
            }

            const posture = await client.query(postureSql);
            assert.equal(posture.rows.length, 1);
            assert.equal(posture.rows[0].owner, 'neondb_owner');
            assert.equal(posture.rows[0].rls_enabled, true);
            assert.equal(posture.rows[0].force_enabled, true);
            assert.deepEqual(posture.rows[0].policies, []);
            assert.equal(
              await client.query(`SELECT pg_catalog.has_table_privilege(
                'grainline_app_runtime', 'public."CaseResolutionClaim"',
                'SELECT, INSERT, UPDATE, DELETE, TRUNCATE, REFERENCES, TRIGGER'
              ) AS direct`).then((result) => result.rows[0].direct),
              false,
            );
            writeFileSync(
              `${process.env.RUNNER_TEMP}/case-refund-provider-recovery-posture.json`,
              JSON.stringify(posture.rows),
              {mode: 0o600, flag: 'wx'},
            );
            appendFileSync(
              process.env.GITHUB_OUTPUT,
              `state=${candidate ? 'applied' : 'pending'}\n`,
            );
          } finally {
            try { await client.query('ROLLBACK'); } catch {}
            await client.end();
          }
          NODE
      - name: Require every predecessor applied and no other pending migration
        shell: bash
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
          MIGRATION_STATE: ${{ steps.preflight.outputs.state }}
        run: |
          set -euo pipefail
          migration=20261001070000_prepare_case_refund_provider_recovery
          if [[ "$MIGRATION_STATE" == "pending" ]]; then
            holding="$RUNNER_TEMP/$migration"
            mv "prisma/migrations/$migration" "$holding"
            trap 'if [[ -d "$holding" ]]; then mv "$holding" "prisma/migrations/$migration"; fi' EXIT
            npx prisma migrate status
            mv "$holding" "prisma/migrations/$migration"
            trap - EXIT
          elif [[ "$MIGRATION_STATE" == "applied" ]]; then
            npx prisma migrate status
          else
            echo "Unexpected Case refund provider-recovery migration state" >&2
            exit 1
          fi
      - name: Apply only the reviewed Case refund provider-recovery migration
        if: steps.preflight.outputs.state == 'pending'
        run: npx prisma migrate deploy
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
      - name: Read back exact ledger, shape, functions and unchanged posture
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
        run: |
          node --input-type=module - <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          import pg from 'pg';

          const migration = '20261001070000_prepare_case_refund_provider_recovery';
          const checksum =
            '68e559e01dbeae663931110dcadfd4d42ca050c788eebd647727f434a9a72dba';
          const migrationSql = readFileSync(
            `prisma/migrations/${migration}/migration.sql`,
            'utf8',
          );
          const sourceSpecs = new Map([
            ['public.grainline_case_resolution_claim_immutable()',
              ['$grainline_case_resolution_claim_immutable$', 'v', 'u', false, false]],
            ['public.grainline_case_staff_resolution_provider_recovery_load(text,text,public."CaseResolution",integer)',
              ['$grainline_case_staff_resolution_provider_recovery_load$', 'v', 'u', true, true]],
            ['public.grainline_case_staff_resolution_provider_clock(text,text,text,text,text)',
              ['$grainline_case_staff_resolution_provider_clock$', 's', 's', true, true]],
            ['public.grainline_case_staff_resolution_provider_recover(text,text,text,bigint,text)',
              ['$grainline_case_staff_resolution_provider_recover$', 'v', 'u', true, true]],
            ['public.grainline_case_staff_resolution_provider_recovery_record(text,text,text,text,text[],text[],text,integer,boolean,boolean)',
              ['$grainline_case_staff_resolution_provider_recovery_record$', 'v', 'u', true, true]],
            ['public.grainline_case_staff_resolution_recovery_finalize(text,text)',
              ['$grainline_case_staff_resolution_recovery_finalize$', 'v', 'u', true, true]],
          ]);
          function sourceFor(delimiter) {
            const marker = `AS ${delimiter}`;
            const start = migrationSql.indexOf(marker);
            assert.ok(start >= 0, `missing function delimiter ${delimiter}`);
            const bodyStart = start + marker.length;
            const end = migrationSql.indexOf(`${delimiter};`, bodyStart);
            assert.ok(end > bodyStart, `missing function end ${delimiter}`);
            return migrationSql.slice(bodyStart, end);
          }
          const expectedColumns = [
            ['providerRecoveryAction', 'character varying', 32, null, 'YES'],
            ['providerRecoveryActorId', 'text', null, null, 'YES'],
            ['providerRecoveryAuthorizedAt', 'timestamp without time zone', null, 3, 'YES'],
            ['providerRecoveryEvidenceSha256', 'character varying', 64, null, 'YES'],
            ['providerRecoveryFinalizedAt', 'timestamp without time zone', null, 3, 'YES'],
            ['providerRecoveryInspectedAt', 'timestamp without time zone', null, 3, 'YES'],
            ['providerRecoveryRecordedAt', 'timestamp without time zone', null, 3, 'YES'],
          ];
          const postureSql = `
            SELECT pg_catalog.pg_get_userbyid(relation.relowner) AS owner,
                   relation.relrowsecurity AS rls_enabled,
                   relation.relforcerowsecurity AS force_enabled,
                   relation.relacl::text AS table_acl,
                   COALESCE((SELECT jsonb_agg(jsonb_build_object(
                     'name', policy.polname, 'command', policy.polcmd,
                     'permissive', policy.polpermissive,
                     'roles', policy.polroles::text,
                     'using', pg_catalog.pg_get_expr(policy.polqual, policy.polrelid),
                     'check', pg_catalog.pg_get_expr(policy.polwithcheck, policy.polrelid)
                   ) ORDER BY policy.polname)
                     FROM pg_catalog.pg_policy AS policy
                    WHERE policy.polrelid = relation.oid), '[]'::jsonb) AS policies
              FROM pg_catalog.pg_class AS relation
             WHERE relation.oid = 'public."CaseResolutionClaim"'::regclass`;
          const before = JSON.parse(readFileSync(
            `${process.env.RUNNER_TEMP}/case-refund-provider-recovery-posture.json`,
            'utf8',
          ));
          const client = new pg.Client({connectionString: process.env.DIRECT_URL});
          try {
            await client.connect();
            await client.query('BEGIN READ ONLY');
            const ledger = await client.query(`
              SELECT checksum, finished_at, rolled_back_at, applied_steps_count
                FROM public._prisma_migrations
               WHERE migration_name = $1
            `, [migration]);
            assert.equal(ledger.rows.length, 1);
            assert.equal(ledger.rows[0].checksum, checksum);
            assert.ok(ledger.rows[0].finished_at);
            assert.equal(ledger.rows[0].rolled_back_at, null);
            assert.equal(Number(ledger.rows[0].applied_steps_count), 1);

            const columns = await client.query(`
              SELECT column_name, data_type, character_maximum_length,
                     datetime_precision, is_nullable
                FROM information_schema.columns
               WHERE table_schema = 'public'
                 AND table_name = 'CaseResolutionClaim'
                 AND column_name LIKE 'providerRecovery%'
               ORDER BY column_name
            `);
            assert.deepEqual(
              columns.rows.map((row) => [
                row.column_name,
                row.data_type,
                row.character_maximum_length === null
                  ? null
                  : Number(row.character_maximum_length),
                row.datetime_precision === null
                  ? null
                  : Number(row.datetime_precision),
                row.is_nullable,
              ]),
              expectedColumns,
            );

            const constraints = await client.query(`
              SELECT constraint_row.conname,
                     constraint_row.contype,
                     constraint_row.convalidated,
                     pg_catalog.pg_get_constraintdef(
                       constraint_row.oid, true
                     ) AS definition
                FROM pg_catalog.pg_constraint AS constraint_row
               WHERE constraint_row.conrelid =
                     'public."CaseResolutionClaim"'::regclass
                 AND constraint_row.conname IN (
                   'CaseResolutionClaim_providerRecoveryActorId_fkey',
                   'CaseResolutionClaim_providerRecovery_shape_check'
                 )
               ORDER BY constraint_row.conname
            `);
            assert.deepEqual(
              constraints.rows.map((row) => [
                row.conname, row.contype, row.convalidated,
              ]),
              [
                ['CaseResolutionClaim_providerRecoveryActorId_fkey', 'f', true],
                ['CaseResolutionClaim_providerRecovery_shape_check', 'c', true],
              ],
            );
            assert.match(
              constraints.rows[0].definition,
              /FOREIGN KEY.*providerRecoveryActorId.*REFERENCES.*User.*ON UPDATE CASCADE ON DELETE RESTRICT/u,
            );
            assert.match(
              constraints.rows[1].definition,
              /providerRecoveryEvidenceSha256[\s\S]*providerRecoveryFinalizedAt/u,
            );

            const indexes = await client.query(`
              SELECT index_row.indisvalid, index_row.indisready,
                     index_row.indisunique,
                     pg_catalog.pg_get_expr(
                       index_row.indpred, index_row.indrelid
                     ) AS predicate
                FROM pg_catalog.pg_index AS index_row
               WHERE index_row.indexrelid =
                 'public."CaseResolutionClaim_providerRecoveryActorId_status_idx"'::regclass
            `);
            assert.equal(indexes.rows.length, 1);
            assert.deepEqual(
              [indexes.rows[0].indisvalid, indexes.rows[0].indisready,
                indexes.rows[0].indisunique],
              [true, true, false],
            );
            assert.match(indexes.rows[0].predicate, /providerRecoveryActorId/u);
            assert.match(indexes.rows[0].predicate, /providerRecoveryFinalizedAt/u);

            const functions = await client.query(`
              SELECT expected.identity,
                     procedure.prosrc,
                     pg_catalog.pg_get_userbyid(procedure.proowner) AS owner,
                     procedure.provolatile,
                     procedure.proparallel,
                     procedure.prosecdef,
                     procedure.proconfig,
                     pg_catalog.has_function_privilege(
                       'grainline_app_runtime', procedure.oid, 'EXECUTE'
                     ) AS runtime_execute,
                     EXISTS (
                       SELECT 1
                         FROM pg_catalog.aclexplode(COALESCE(
                           procedure.proacl,
                           pg_catalog.acldefault('f', procedure.proowner)
                         )) AS acl
                        WHERE acl.grantee = 0
                          AND acl.privilege_type = 'EXECUTE'
                     ) AS public_execute
                FROM pg_catalog.unnest($1::text[]) AS expected(identity)
                LEFT JOIN pg_catalog.pg_proc AS procedure
                  ON procedure.oid = pg_catalog.to_regprocedure(expected.identity)
               ORDER BY expected.identity
            `, [[...sourceSpecs.keys()]]);
            assert.equal(functions.rows.length, sourceSpecs.size);
            for (const row of functions.rows) {
              const expected = sourceSpecs.get(row.identity);
              assert.ok(expected, `unexpected function ${row.identity}`);
              assert.equal(row.prosrc, sourceFor(expected[0]));
              assert.equal(row.owner, 'neondb_owner');
              assert.equal(row.provolatile, expected[1]);
              assert.equal(row.proparallel, expected[2]);
              assert.equal(row.prosecdef, expected[3]);
              assert.deepEqual(row.proconfig, ['search_path=pg_catalog']);
              assert.equal(row.runtime_execute, expected[4]);
              assert.equal(row.public_execute, false);
            }
            assert.equal(
              await client.query(`SELECT pg_catalog.has_table_privilege(
                'grainline_app_runtime', 'public."CaseResolutionClaim"',
                'SELECT, INSERT, UPDATE, DELETE, TRUNCATE, REFERENCES, TRIGGER'
              ) AS direct`).then((result) => result.rows[0].direct),
              false,
            );
            assert.deepEqual((await client.query(postureSql)).rows, before);
            process.stdout.write(
              'Case refund provider recovery applied: exact ledger, shape, functions, ACLs and posture\n',
            );
          } finally {
            try { await client.query('ROLLBACK'); } catch {}
            await client.end();
          }
          NODE
      - name: Verify final Prisma migration status
        run: npx prisma migrate status
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
