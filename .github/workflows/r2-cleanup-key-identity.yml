name: Protected R2 Cleanup Key Identity

on:
  workflow_dispatch:
    inputs:
      release_commit:
        description: Exact reviewed main commit
        required: true
        type: string
      operation_id:
        description: Fresh reviewed operation UUID
        required: true
        type: string
      confirmation:
        description: Type compare-protected-r2-cleanup-key
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-direct-upload-r2-credential-proof
  cancel-in-progress: false

jobs:
  identity:
    if: github.repository == 'Drewyoung910/grainline' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: Production DirectUpload Cleanup
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      - name: Record only protected credential identity fingerprints
        run: node scripts/r2-cleanup-key-identity.mjs
        env:
          R2_CLEANUP_IDENTITY_COMMIT: ${{ inputs.release_commit }}
          R2_CLEANUP_IDENTITY_OPERATION: ${{ inputs.operation_id }}
          R2_CLEANUP_IDENTITY_CONFIRM: ${{ inputs.confirmation }}
          DIRECT_UPLOAD_CLEANUP_R2_ACCOUNT_ID: ${{ vars.DIRECT_UPLOAD_CLEANUP_R2_ACCOUNT_ID }}
          DIRECT_UPLOAD_CLEANUP_R2_PUBLIC_BUCKET: ${{ vars.DIRECT_UPLOAD_CLEANUP_R2_PUBLIC_BUCKET }}
          DIRECT_UPLOAD_CLEANUP_R2_PRIVATE_BUCKET: ${{ vars.DIRECT_UPLOAD_CLEANUP_R2_PRIVATE_BUCKET }}
          DIRECT_UPLOAD_CLEANUP_R2_ACCESS_KEY_ID: ${{ secrets.DIRECT_UPLOAD_CLEANUP_R2_ACCESS_KEY_ID }}
          DIRECT_UPLOAD_CLEANUP_R2_SECRET_ACCESS_KEY: ${{ secrets.DIRECT_UPLOAD_CLEANUP_R2_SECRET_ACCESS_KEY }}
      - name: Save successful fingerprint identity only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: r2-cleanup-key-identity-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/r2-cleanup-key-identity-${{ github.run_id }}-${{ github.run_attempt }}.json
          if-no-files-found: error
          retention-days: 7
