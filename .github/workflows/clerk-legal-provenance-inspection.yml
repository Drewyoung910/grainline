name: Clerk Legal Acceptance Provenance Inspection

on:
  workflow_dispatch:
    inputs:
      release_commit:
        description: Exact 40-character reviewed main commit
        required: true
        type: string
      confirmation:
        description: Type inspect-clerk-legal-acceptance-provenance
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-database-migrations
  cancel-in-progress: false

jobs:
  inspect:
    name: Aggregate-only Clerk legal acceptance provenance inspection
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Production
    env:
      PRODUCTION_MIGRATION_DIRECT_URL_SHA256: ${{ vars.PRODUCTION_MIGRATION_DIRECT_URL_SHA256 }}
      RUNTIME_DB_ROLE: grainline_app_runtime
      MIGRATION_DB_ROLE: neondb_owner
      CLERK_LEGAL_PROVENANCE_INSPECT_RELEASE_COMMIT: ${{ inputs.release_commit }}
      CLERK_LEGAL_PROVENANCE_INSPECT_CONFIRM: ${{ inputs.confirmation }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Inspect legal acceptance provenance in an engine-read-only transaction
        run: npm run ops:clerk-legal-provenance-inspect
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
          CLERK_LEGAL_PROVENANCE_INSPECT_EVIDENCE_PATH: ${{ runner.temp }}/clerk-legal-provenance-inspection-${{ inputs.release_commit }}.json
      - name: Upload sanitized aggregate evidence
        uses: actions/upload-artifact@v4
        with:
          name: clerk-legal-provenance-inspection-${{ github.sha }}
          path: ${{ runner.temp }}/clerk-legal-provenance-inspection-${{ github.sha }}.json
          if-no-files-found: error
          retention-days: 30
