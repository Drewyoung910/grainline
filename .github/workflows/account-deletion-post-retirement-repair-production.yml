name: Account Deletion Post-Retirement Repair Production

on:
  workflow_dispatch:
    inputs:
      release_commit:
        description: Exact reviewed main commit
        required: true
        type: string
      main_ci_run_id:
        description: Successful full push CI run for that exact main commit
        required: true
        type: string
      confirmation:
        description: Type apply-reviewed-account-deletion-post-retirement-repair
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: production-database-migrations
  cancel-in-progress: false

jobs:
  apply:
    name: Repair account deletion after SellerProfile retirement
    if: >-
      github.repository == 'Drewyoung910/grainline' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      github.run_attempt == 1 &&
      inputs.confirmation == 'apply-reviewed-account-deletion-post-retirement-repair'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: Production
    env:
      MIGRATION_DB_ROLE: neondb_owner
      PRODUCTION_MIGRATION_CONFIRM: run-reviewed-production-migrations-from-main
      PRODUCTION_MIGRATION_DIRECT_URL_SHA256: ${{ vars.PRODUCTION_MIGRATION_DIRECT_URL_SHA256 }}
      PRODUCTION_MIGRATION_RELEASE_COMMIT: ${{ inputs.release_commit }}
      RUNTIME_DB_ROLE: grainline_app_runtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.2"
          architecture: x64
          check-latest: false
          package-manager-cache: false
          token: ""
      - run: npm ci --ignore-scripts
      - name: Bind repair to exact main and completed CI
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          REVIEWED_RELEASE_COMMIT: ${{ inputs.release_commit }}
          REVIEWED_MAIN_CI_RUN_ID: ${{ inputs.main_ci_run_id }}
        with:
          script: |
            const sha = process.env.REVIEWED_RELEASE_COMMIT;
            const value = process.env.REVIEWED_MAIN_CI_RUN_ID;
            if (!/^[0-9a-f]{40}$/.test(sha ?? '') || sha !== context.sha ||
                !/^[1-9][0-9]{0,19}$/.test(value ?? '')) {
              throw new Error('Account deletion post-retirement repair binding drifted');
            }
            const runId = Number(value);
            if (!Number.isSafeInteger(runId)) throw new Error('CI run id is unsafe');
            const [{data: main}, {data: run}] = await Promise.all([
              github.rest.repos.getBranch({...context.repo, branch: 'main'}),
              github.rest.actions.getWorkflowRun({...context.repo, run_id: runId}),
            ]);
            if (main.commit.sha !== sha || run.name !== 'CI' ||
                run.event !== 'push' || run.head_branch !== 'main' ||
                run.head_sha !== sha || run.status !== 'completed' ||
                run.conclusion !== 'success') {
              throw new Error('Account deletion post-retirement repair main/CI readback drifted');
            }
      - name: Verify exact repair source and immutable migration bytes
        shell: bash
        run: |
          set -euo pipefail
          migration=20261015013000_repair_account_deletion_after_seller_profile_retirement
          latest="$(find prisma/migrations -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | LC_ALL=C sort | tail -n 1)"
          test "$latest" = "$migration"
          echo "c2884361016a554b28afebe58776938faf695c39c86fb22c9d40c87949e02368  prisma/migrations/$migration/migration.sql" | sha256sum --check --status
          node --test tests/account-deletion-post-retirement-repair.test.mjs
      - name: Verify owner connection boundary
        run: node scripts/guard-production-migration-runner.mjs
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
      - name: Inspect repair and sanitized backlog state before apply
        id: preflight
        shell: bash
        env:
          ACCOUNT_DELETION_REPAIR_EXPECTED_STATE: compatible
          ACCOUNT_DELETION_REPAIR_EVIDENCE_PATH: ${{ runner.temp }}/account-deletion-post-retirement-${{ inputs.release_commit }}-preflight.json
          ACCOUNT_DELETION_REPAIR_RELEASE_COMMIT: ${{ inputs.release_commit }}
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
        run: |
          set -euo pipefail
          result="$(node scripts/account-deletion-post-retirement-production-inspect.mjs)"
          state="$(node -e 'let value=""; process.stdin.setEncoding("utf8"); process.stdin.on("data", chunk => value += chunk); process.stdin.on("end", () => process.stdout.write(String(JSON.parse(value).result.state)));' <<< "$result")"
          case "$state" in
            pending) echo "pending=20261015013000_repair_account_deletion_after_seller_profile_retirement" >> "$GITHUB_OUTPUT" ;;
            repaired) echo "pending=" >> "$GITHUB_OUTPUT" ;;
            *) exit 1 ;;
          esac
          echo "state=$state" >> "$GITHUB_OUTPUT"
      - name: Require only the reviewed repair pending
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
          REVIEWED_PENDING_MIGRATIONS: ${{ steps.preflight.outputs.pending }}
        run: node scripts/assert-reviewed-pending-migrations.mjs
      - name: Apply only the reviewed account-deletion post-retirement repair
        if: steps.preflight.outputs.state == 'pending'
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
        run: npx prisma migrate deploy
      - name: Verify complete migration status
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
        run: npx prisma migrate status
      - name: Read back repaired functions and sanitized backlog state
        env:
          ACCOUNT_DELETION_REPAIR_EXPECTED_STATE: repaired
          ACCOUNT_DELETION_REPAIR_EVIDENCE_PATH: ${{ runner.temp }}/account-deletion-post-retirement-${{ inputs.release_commit }}-repaired.json
          ACCOUNT_DELETION_REPAIR_RELEASE_COMMIT: ${{ inputs.release_commit }}
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
        run: node scripts/account-deletion-post-retirement-production-inspect.mjs
      - name: Reject retired SellerProfile references across live functions
        env:
          SELLER_PROFILE_RETIRED_FUNCTION_PROOF_DATABASE_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
        run: node scripts/seller-profile-retired-function-reference-postgres-proof.mjs
      - name: Audit global runtime grants after account-deletion repair
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
          GRANT_AUDIT_DATABASE_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
        run: npm run audit:db-grants -- --require-direct-url
      - name: Preserve sanitized repair and backlog evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: account-deletion-post-retirement-production-${{ github.run_id }}
          path: ${{ runner.temp }}/account-deletion-post-retirement-${{ github.sha }}-*.json
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: false
