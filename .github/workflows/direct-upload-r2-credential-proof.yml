name: DirectUpload R2 Cleanup Credential Proof

on:
  workflow_dispatch:
    inputs:
      release_commit:
        description: Exact 40-character reviewed main commit
        required: true
        type: string
      confirmation:
        description: Type prove-reviewed-direct-upload-cleanup-r2
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-direct-upload-r2-credential-proof
  cancel-in-progress: false

jobs:
  proof:
    name: Prove isolated cleanup credential on disposable objects
    if: github.repository == 'Drewyoung910/grainline' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Production DirectUpload Cleanup
    env:
      DIRECT_UPLOAD_R2_PROOF_CONFIRM: ${{ inputs.confirmation }}
      DIRECT_UPLOAD_R2_PROOF_RELEASE_COMMIT: ${{ inputs.release_commit }}
      DIRECT_UPLOAD_CLEANUP_R2_ACCOUNT_ID: ${{ vars.DIRECT_UPLOAD_CLEANUP_R2_ACCOUNT_ID }}
      DIRECT_UPLOAD_CLEANUP_R2_PRIVATE_BUCKET: ${{ vars.DIRECT_UPLOAD_CLEANUP_R2_PRIVATE_BUCKET }}
      DIRECT_UPLOAD_CLEANUP_R2_PUBLIC_BUCKET: ${{ vars.DIRECT_UPLOAD_CLEANUP_R2_PUBLIC_BUCKET }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Prove exact-bucket write, read, delete and absence
        run: npm run ops:direct-upload-r2-credential-proof
        env:
          DIRECT_UPLOAD_R2_PROOF_EVIDENCE_PATH: ${{ runner.temp }}/direct-upload-r2-credential-proof-${{ github.run_id }}-${{ github.run_attempt }}.json
          DIRECT_UPLOAD_CLEANUP_R2_ACCESS_KEY_ID: ${{ secrets.DIRECT_UPLOAD_CLEANUP_R2_ACCESS_KEY_ID }}
          DIRECT_UPLOAD_CLEANUP_R2_SECRET_ACCESS_KEY: ${{ secrets.DIRECT_UPLOAD_CLEANUP_R2_SECRET_ACCESS_KEY }}
      - name: Upload sanitized R2 credential evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: direct-upload-r2-credential-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/direct-upload-r2-credential-proof-${{ github.run_id }}-${{ github.run_attempt }}.json
          if-no-files-found: warn
          retention-days: 30
