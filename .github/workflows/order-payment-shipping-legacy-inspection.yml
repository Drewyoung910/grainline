name: Order Payment Shipping Legacy Inspection

on:
  workflow_dispatch:
    inputs:
      release_commit:
        description: Exact 40-character reviewed main commit
        required: true
        type: string
      confirmation:
        description: Type inspect-prelaunch-order-payment-shipping-legacy-state
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-database-migrations
  cancel-in-progress: false

jobs:
  inspect:
    name: Aggregate-only production Order payment shipping inspection
    if: github.repository == 'Drewyoung910/grainline' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Production
    env:
      MIGRATION_DB_ROLE: neondb_owner
      ORDER_PAYMENT_SHIPPING_LEGACY_INSPECT_CONFIRM: ${{ inputs.confirmation }}
      ORDER_PAYMENT_SHIPPING_LEGACY_INSPECT_RELEASE_COMMIT: ${{ inputs.release_commit }}
      ORDER_PAYMENT_SHIPPING_LEGACY_PREREQUISITES_CONFIRMED: service-ledger-force-and-runtime-separation-postflights-passed
      PRODUCTION_MIGRATION_DIRECT_URL_SHA256: ${{ vars.PRODUCTION_MIGRATION_DIRECT_URL_SHA256 }}
      RUNTIME_DB_ROLE: grainline_app_runtime
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Inspect aggregate Order payment shipping legacy state in a read-only transaction
        run: npm run ops:order-payment-shipping-legacy-inspect
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
          ORDER_PAYMENT_SHIPPING_LEGACY_INSPECT_EVIDENCE_PATH: ${{ runner.temp }}/order-payment-shipping-legacy-inspection-${{ inputs.release_commit }}.json
      - name: Upload sanitized aggregate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: order-payment-shipping-legacy-inspection-${{ github.sha }}
          path: ${{ runner.temp }}/order-payment-shipping-legacy-inspection-${{ github.sha }}.json
          if-no-files-found: error
          retention-days: 30
