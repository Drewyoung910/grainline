name: Order Banned Buyer Completion Production

on:
  workflow_dispatch:
    inputs:
      release_commit:
        description: Exact reviewed main commit
        required: true
        type: string
      main_ci_run_id:
        description: Successful full push CI run for that exact main commit
        required: true
        type: string
      confirmation:
        description: Type apply-reviewed-order-banned-buyer-completion
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: production-database-migrations
  cancel-in-progress: false

jobs:
  apply:
    name: Apply one reviewed blocked-checkout correction
    if: >-
      github.repository == 'Drewyoung910/grainline' &&
      github.ref == 'refs/heads/main' &&
      inputs.confirmation == 'apply-reviewed-order-banned-buyer-completion'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: Production
    env:
      MIGRATION_DB_ROLE: neondb_owner
      PRODUCTION_MIGRATION_CONFIRM: run-reviewed-production-migrations-from-main
      PRODUCTION_MIGRATION_DIRECT_URL_SHA256: ${{ vars.PRODUCTION_MIGRATION_DIRECT_URL_SHA256 }}
      PRODUCTION_MIGRATION_RELEASE_COMMIT: ${{ inputs.release_commit }}
      RUNTIME_DB_ROLE: grainline_app_runtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          architecture: x64
          check-latest: false
          package-manager-cache: false
          token: ''
      - run: npm ci --ignore-scripts
      - name: Verify exact main and completed CI before credential access
        uses: actions/github-script@v7
        env:
          REVIEWED_RELEASE_COMMIT: ${{ inputs.release_commit }}
          REVIEWED_MAIN_CI_RUN_ID: ${{ inputs.main_ci_run_id }}
        with:
          script: |
            const sha = process.env.REVIEWED_RELEASE_COMMIT;
            const value = process.env.REVIEWED_MAIN_CI_RUN_ID;
            if (!/^[0-9a-f]{40}$/.test(sha ?? '') || sha !== context.sha ||
                !/^[1-9][0-9]{0,19}$/.test(value ?? '')) {
              throw new Error('Order banned-buyer release binding drifted');
            }
            const runId = Number(value);
            if (!Number.isSafeInteger(runId)) throw new Error('CI run id is unsafe');
            const [{data: main}, {data: run}] = await Promise.all([
              github.rest.repos.getBranch({...context.repo, branch: 'main'}),
              github.rest.actions.getWorkflowRun({...context.repo, run_id: runId}),
            ]);
            if (main.commit.sha !== sha || run.name !== 'CI' ||
                run.event !== 'push' || run.head_branch !== 'main' ||
                run.head_sha !== sha || run.status !== 'completed' ||
                run.conclusion !== 'success') {
              throw new Error('Order banned-buyer main/CI readback drifted');
            }
      - name: Verify exact sole successor and SQL bytes
        shell: bash
        run: |
          set -euo pipefail
          migration=20260905180000_correct_order_banned_buyer_completion
          latest="$(find prisma/migrations -mindepth 1 -maxdepth 1 -type d -print | LC_ALL=C sort | tail -n 1)"
          test "$latest" = "prisma/migrations/$migration"
          printf '%s  %s\n' \
            '2eaaada2dfa9f9ce4e6b28e43542cb0a1220e191847b3d518da8b50ebc2b4228' \
            "prisma/migrations/$migration/migration.sql" | sha256sum --check --status
      - name: Verify owner connection boundary
        run: node scripts/guard-production-migration-runner.mjs
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
      - name: Isolate successor and require a complete predecessor ledger
        shell: bash
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
        run: |
          set -euo pipefail
          migration=20260905180000_correct_order_banned_buyer_completion
          mv "prisma/migrations/$migration" "$RUNNER_TEMP/$migration"
          npx prisma migrate status
          mv "$RUNNER_TEMP/$migration" "prisma/migrations/$migration"
      - name: Apply only the reviewed successor
        run: npx prisma migrate deploy
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
      - name: Read back migration ledger and exact function posture
        shell: bash
        run: |
          node --input-type=module - <<'NODE'
          import assert from 'node:assert/strict';
          import { Client } from 'pg';
          const client = new Client({connectionString: process.env.DIRECT_URL});
          try {
            await client.connect();
            await client.query('BEGIN READ ONLY');
            const {rows} = await client.query(`
              SELECT pg_catalog.md5(p.prosrc) AS body_md5,
                     pg_catalog.pg_get_userbyid(p.proowner) AS owner,
                     p.prosecdef AS security_definer,
                     p.provolatile AS volatility,
                     p.proparallel AS parallel_safety,
                     'search_path=pg_catalog' = ANY(p.proconfig) AS fixed_search_path,
                     pg_catalog.has_function_privilege(
                       'grainline_app_runtime', p.oid, 'EXECUTE'
                     ) AS runtime_execute,
                     pg_catalog.has_function_privilege('public', p.oid, 'EXECUTE')
                       AS public_execute
                FROM pg_catalog.pg_proc AS p
               WHERE p.oid = pg_catalog.to_regprocedure(
                 'public.grainline_checkout_reservation_complete(text,bigint,text,text)'
               )
            `);
            const ledger = await client.query(`
              SELECT pg_catalog.count(*)::integer AS applied
                FROM public._prisma_migrations
               WHERE migration_name = '20260905180000_correct_order_banned_buyer_completion'
                 AND finished_at IS NOT NULL AND rolled_back_at IS NULL
            `);
            assert.equal(rows.length, 1);
            assert.deepEqual(rows[0], {
              body_md5: '1859c7ba941e6ba891d1869b90a83403',
              owner: 'neondb_owner', security_definer: true,
              volatility: 'v', parallel_safety: 'u', fixed_search_path: true,
              runtime_execute: true, public_execute: false,
            });
            assert.equal(ledger.rows[0].applied, 1);
            process.stdout.write('Order banned-buyer completion applied: exact ledger and function posture\n');
          } finally {
            try { await client.query('ROLLBACK'); } catch {}
            await client.end();
          }
          NODE
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
      - name: Verify final Prisma migration status
        run: npx prisma migrate status
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
