name: User Clerk Identity Preparation Production

on:
  workflow_dispatch:
    inputs:
      release_commit:
        description: Exact reviewed main commit
        required: true
        type: string
      main_ci_run_id:
        description: Successful full push CI run for that exact main commit
        required: true
        type: string
      user_email_force_run_id:
        description: Accepted UserEmailAddress FORCE Production run
        required: true
        type: string
      confirmation:
        description: Type apply-reviewed-user-clerk-identity-preparation
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: production-database-migrations
  cancel-in-progress: false

jobs:
  apply:
    name: Apply reviewed User Clerk identity preparation
    if: >-
      github.repository == 'Drewyoung910/grainline' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      github.run_attempt == 1 &&
      inputs.confirmation == 'apply-reviewed-user-clerk-identity-preparation'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: Production
    env:
      MIGRATION_DB_ROLE: neondb_owner
      PRODUCTION_MIGRATION_CONFIRM: run-reviewed-production-migrations-from-main
      PRODUCTION_MIGRATION_DIRECT_URL_SHA256: ${{ vars.PRODUCTION_MIGRATION_DIRECT_URL_SHA256 }}
      PRODUCTION_MIGRATION_RELEASE_COMMIT: ${{ inputs.release_commit }}
      RUNTIME_DB_ROLE: grainline_app_runtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.2"
          architecture: x64
          check-latest: false
          package-manager-cache: false
          token: ""
      - run: npm ci --ignore-scripts
      - name: Bind preparation to exact main, CI, and UserEmailAddress FORCE
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          REVIEWED_RELEASE_COMMIT: ${{ inputs.release_commit }}
          REVIEWED_MAIN_CI_RUN_ID: ${{ inputs.main_ci_run_id }}
          REVIEWED_USER_EMAIL_FORCE_RUN_ID: ${{ inputs.user_email_force_run_id }}
        with:
          script: |
            const sha = process.env.REVIEWED_RELEASE_COMMIT;
            const ciValue = process.env.REVIEWED_MAIN_CI_RUN_ID;
            const forceValue = process.env.REVIEWED_USER_EMAIL_FORCE_RUN_ID;
            if (!/^[0-9a-f]{40}$/.test(sha ?? '') || sha !== context.sha ||
                !/^[1-9][0-9]{0,19}$/.test(ciValue ?? '') ||
                !/^[1-9][0-9]{0,19}$/.test(forceValue ?? '')) {
              throw new Error('User Clerk identity preparation binding drifted');
            }
            const ciRunId = Number(ciValue);
            const forceRunId = Number(forceValue);
            if (!Number.isSafeInteger(ciRunId) || !Number.isSafeInteger(forceRunId)) {
              throw new Error('User Clerk identity run id is unsafe');
            }
            const [{data: main}, {data: ci}, {data: force}] = await Promise.all([
              github.rest.repos.getBranch({...context.repo, branch: 'main'}),
              github.rest.actions.getWorkflowRun({...context.repo, run_id: ciRunId}),
              github.rest.actions.getWorkflowRun({...context.repo, run_id: forceRunId}),
            ]);
            if (main.commit.sha !== sha || ci.name !== 'CI' ||
                ci.event !== 'push' || ci.head_branch !== 'main' ||
                ci.head_sha !== sha || ci.status !== 'completed' ||
                ci.conclusion !== 'success') {
              throw new Error('User Clerk identity main/CI readback drifted');
            }
            if (force.name !== 'UserEmailAddress FORCE Production' ||
                force.event !== 'workflow_dispatch' || force.head_branch !== 'main' ||
                force.head_sha !== 'e689e1ff1d76a65146d132ad25dc545a72b87aac' ||
                force.run_attempt !== 1 || force.status !== 'completed' ||
                force.conclusion !== 'success') {
              throw new Error('UserEmailAddress FORCE predecessor drifted');
            }
      - name: Verify exact User Clerk identity source package
        shell: bash
        run: |
          set -euo pipefail
          latest="$(find prisma/migrations -mindepth 1 -maxdepth 1 -type d -print | LC_ALL=C sort | tail -n 1)"
          test "$latest" = "prisma/migrations/20261003100000_prepare_user_clerk_identity_authority"
          echo "1aaebc3f8ef52af7692a4f3701ba39549d3a285e8245976876a16d3cf0bc6bf9  prisma/migrations/20261003100000_prepare_user_clerk_identity_authority/migration.sql" | sha256sum --check --status
          node --test \
            tests/user-clerk-identity-authority.test.mjs \
            tests/user-clerk-identity-authority-postgres.test.mjs \
            tests/user-clerk-identity-production-inspect.test.mjs \
            tests/user-clerk-identity-preparation-production-workflow.test.mjs \
            tests/user-identity-source-inventory.test.mjs
      - name: Verify owner connection boundary
        run: node scripts/guard-production-migration-runner.mjs
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
      - name: Read exact predecessor and candidate ledger state
        id: ledger
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
        run: |
          node --input-type=module - <<'NODE'
          import assert from 'node:assert/strict';
          import {appendFileSync} from 'node:fs';
          import pg from 'pg';
          const predecessor = Object.freeze({
            name: '20261003030000_force_user_email_address_rls',
            checksum: '68bc032ecf38a63bd4ab9a219e315b69d8fa505bc3b99b6abf20e7d435812402',
          });
          const candidate = Object.freeze({
            name: '20261003100000_prepare_user_clerk_identity_authority',
            checksum: '1aaebc3f8ef52af7692a4f3701ba39549d3a285e8245976876a16d3cf0bc6bf9',
          });
          const client = new pg.Client({connectionString: process.env.DIRECT_URL});
          try {
            await client.connect();
            await client.query('BEGIN ISOLATION LEVEL REPEATABLE READ READ ONLY');
            const rows = (await client.query(`
              SELECT migration_name, checksum, finished_at, rolled_back_at,
                     applied_steps_count
                FROM public._prisma_migrations
               WHERE migration_name = ANY($1::text[])
               ORDER BY started_at, id
            `, [[predecessor.name, candidate.name]])).rows;
            const accepted = (row, expected) => row?.checksum === expected.checksum &&
              row.finished_at && row.rolled_back_at === null &&
              Number(row.applied_steps_count) === 1;
            const predecessorRows = rows.filter((row) =>
              row.migration_name === predecessor.name);
            assert.equal(predecessorRows.length, 1);
            assert.equal(accepted(predecessorRows[0], predecessor), true);
            const candidateRows = rows.filter((row) =>
              row.migration_name === candidate.name);
            assert.ok(candidateRows.length === 0 ||
              (candidateRows.length === 1 && accepted(candidateRows[0], candidate)));
            assert.equal(rows.length, 1 + candidateRows.length);
            const incomplete = await client.query(`
              SELECT count(*)::integer AS count
                FROM public._prisma_migrations
               WHERE finished_at IS NULL AND rolled_back_at IS NULL
            `);
            assert.equal(incomplete.rows[0].count, 0);
            appendFileSync(process.env.GITHUB_OUTPUT,
              `state=${candidateRows.length === 1 ? 'applied' : 'pending'}\n`);
            await client.query('ROLLBACK');
          } finally {
            try { await client.query('ROLLBACK'); } catch {}
            await client.end();
          }
          NODE
      - name: Capture read-only preflight catalogs
        shell: bash
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
          EXPECTED_USER_CLERK_IDENTITY_STATE: ${{ steps.ledger.outputs.state }}
          EXPECTED_USER_EMAIL_ADDRESS_RLS_ENABLED: "true"
          EXPECTED_USER_EMAIL_ADDRESS_RLS_FORCED: "true"
          EXPECTED_USER_EMAIL_ADDRESS_RUNTIME_DIRECT_CRUD: "false"
        run: |
          set -euo pipefail
          umask 077
          mkdir -m 700 "$RUNNER_TEMP/user-clerk-identity-pre"
          node scripts/user-email-address-authority-catalog.mjs \
            > "$RUNNER_TEMP/user-clerk-identity-pre/user-email-address.json"
          node scripts/user-clerk-identity-production-inspect.mjs \
            > "$RUNNER_TEMP/user-clerk-identity-pre/user-clerk-identity.json"
      - name: Require every predecessor applied and no unrelated migration pending
        shell: bash
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
          MIGRATION_STATE: ${{ steps.ledger.outputs.state }}
        run: |
          set -euo pipefail
          migration=20261003100000_prepare_user_clerk_identity_authority
          if [[ "$MIGRATION_STATE" == "pending" ]]; then
            holding="$RUNNER_TEMP/$migration"
            mv "prisma/migrations/$migration" "$holding"
            trap 'if [[ -d "$holding" ]]; then mv "$holding" "prisma/migrations/$migration"; fi' EXIT
            npx prisma migrate status
            mv "$holding" "prisma/migrations/$migration"
            trap - EXIT
          elif [[ "$MIGRATION_STATE" == "applied" ]]; then
            npx prisma migrate status
          else
            echo "Unexpected User Clerk identity migration state" >&2
            exit 1
          fi
      - name: Apply only reviewed User Clerk identity preparation
        if: steps.ledger.outputs.state == 'pending'
        run: npx prisma migrate deploy
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
      - name: Read back exact applied ledger
        shell: bash
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
        run: |
          set -euo pipefail
          umask 077
          node --input-type=module - <<'NODE'
          import assert from 'node:assert/strict';
          import {writeFileSync} from 'node:fs';
          import pg from 'pg';
          const migration = '20261003100000_prepare_user_clerk_identity_authority';
          const checksum = '1aaebc3f8ef52af7692a4f3701ba39549d3a285e8245976876a16d3cf0bc6bf9';
          const client = new pg.Client({connectionString: process.env.DIRECT_URL});
          try {
            await client.connect();
            await client.query('BEGIN ISOLATION LEVEL REPEATABLE READ READ ONLY');
            const rows = (await client.query(`
              SELECT checksum, finished_at, rolled_back_at, applied_steps_count
                FROM public._prisma_migrations
               WHERE migration_name = $1
            `, [migration])).rows;
            assert.equal(rows.length, 1);
            assert.equal(rows[0].checksum, checksum);
            assert.ok(rows[0].finished_at);
            assert.equal(rows[0].rolled_back_at, null);
            assert.equal(Number(rows[0].applied_steps_count), 1);
            await client.query('ROLLBACK');
            writeFileSync(
              `${process.env.RUNNER_TEMP}/user-clerk-identity-ledger.json`,
              `${JSON.stringify({status: 'passed', migration, checksum,
                appliedStepsCount: 1}, null, 2)}\n`,
              {mode: 0o600, flag: 'wx'},
            );
          } finally {
            try { await client.query('ROLLBACK'); } catch {}
            await client.end();
          }
          NODE
      - name: Capture and compare read-only postflight catalogs
        shell: bash
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
          EXPECTED_USER_CLERK_IDENTITY_STATE: applied
          EXPECTED_USER_EMAIL_ADDRESS_RLS_ENABLED: "true"
          EXPECTED_USER_EMAIL_ADDRESS_RLS_FORCED: "true"
          EXPECTED_USER_EMAIL_ADDRESS_RUNTIME_DIRECT_CRUD: "false"
        run: |
          set -euo pipefail
          umask 077
          mkdir -m 700 "$RUNNER_TEMP/user-clerk-identity-post"
          node scripts/user-email-address-authority-catalog.mjs \
            > "$RUNNER_TEMP/user-clerk-identity-post/user-email-address.json"
          node scripts/user-clerk-identity-production-inspect.mjs \
            > "$RUNNER_TEMP/user-clerk-identity-post/user-clerk-identity.json"
          node --input-type=module - <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const read = (path) => JSON.parse(readFileSync(path, 'utf8'));
          const pre = `${process.env.RUNNER_TEMP}/user-clerk-identity-pre`;
          const post = `${process.env.RUNNER_TEMP}/user-clerk-identity-post`;
          const preIdentity = read(`${pre}/user-clerk-identity.json`);
          const postIdentity = read(`${post}/user-clerk-identity.json`);
          const preEmail = read(`${pre}/user-email-address.json`);
          const postEmail = read(`${post}/user-email-address.json`);
          assert.deepEqual(postIdentity.catalog.table, preIdentity.catalog.table);
          assert.deepEqual(postEmail.result, preEmail.result);
          assert.equal(postIdentity.result.expectedState, 'applied');
          assert.equal(postIdentity.result.functionCount, 3);
          assert.equal(postIdentity.result.productionChanged, false);
          assert.equal(postIdentity.result.rowDataRead, false);
          NODE
      - name: Audit runtime grants after User Clerk identity preparation
        env:
          GRANT_AUDIT_DATABASE_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
        run: npm run audit:db-grants
      - name: Verify final Prisma migration status
        run: npx prisma migrate status
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
      - name: Preserve sanitized preflight, ledger, and postflight evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: user-clerk-identity-preparation-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/user-clerk-identity-pre/*.json
            ${{ runner.temp }}/user-clerk-identity-ledger.json
            ${{ runner.temp }}/user-clerk-identity-post/*.json
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: false
