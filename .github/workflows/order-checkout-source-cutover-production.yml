name: Order checkout source cutover (protected)

on:
  workflow_dispatch:
    inputs:
      release_commit:
        description: Exact reviewed main commit
        required: true
        type: string
      main_ci_run_id:
        description: Successful full push CI run for that exact main commit
        required: true
        type: string
      corrections_run_id:
        description: Successful Order correction run for that exact main commit
        required: true
        type: string
      confirmation:
        description: Type retire-legacy-checkout-and-drain
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: production-database-migrations
  cancel-in-progress: false

jobs:
  retire_and_drain:
    name: Retire legacy checkout creators and prove drain
    if: >-
      github.repository == 'Drewyoung910/grainline' &&
      github.ref == 'refs/heads/main' &&
      inputs.confirmation == 'retire-legacy-checkout-and-drain'
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    environment: Production
    env:
      MIGRATION_DB_ROLE: neondb_owner
      PRODUCTION_MIGRATION_CONFIRM: run-reviewed-production-migrations-from-main
      PRODUCTION_MIGRATION_DIRECT_URL_SHA256: ${{ vars.PRODUCTION_MIGRATION_DIRECT_URL_SHA256 }}
      PRODUCTION_MIGRATION_RELEASE_COMMIT: ${{ inputs.release_commit }}
      RUNTIME_DB_ROLE: grainline_app_runtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.2"
          architecture: x64
          check-latest: false
          package-manager-cache: false
          token: ""
      - run: npm ci --ignore-scripts
      - name: Bind cutover to exact main, CI and correction run
        uses: actions/github-script@v7
        env:
          REVIEWED_RELEASE_COMMIT: ${{ inputs.release_commit }}
          REVIEWED_MAIN_CI_RUN_ID: ${{ inputs.main_ci_run_id }}
          REVIEWED_CORRECTIONS_RUN_ID: ${{ inputs.corrections_run_id }}
        with:
          script: |
            const sha = process.env.REVIEWED_RELEASE_COMMIT;
            const ciValue = process.env.REVIEWED_MAIN_CI_RUN_ID;
            const correctionValue = process.env.REVIEWED_CORRECTIONS_RUN_ID;
            if (!/^[0-9a-f]{40}$/.test(sha ?? '') || sha !== context.sha ||
                !/^[1-9][0-9]{0,19}$/.test(ciValue ?? '') ||
                !/^[1-9][0-9]{0,19}$/.test(correctionValue ?? '')) {
              throw new Error('Order checkout cutover binding drifted');
            }
            const ciRunId = Number(ciValue);
            const correctionRunId = Number(correctionValue);
            if (!Number.isSafeInteger(ciRunId) || !Number.isSafeInteger(correctionRunId)) {
              throw new Error('Order checkout cutover run id is unsafe');
            }
            const [{data: main}, {data: ci}, {data: corrections}] = await Promise.all([
              github.rest.repos.getBranch({...context.repo, branch: 'main'}),
              github.rest.actions.getWorkflowRun({...context.repo, run_id: ciRunId}),
              github.rest.actions.getWorkflowRun({...context.repo, run_id: correctionRunId}),
            ]);
            if (main.commit.sha !== sha ||
                ci.name !== 'CI' || ci.event !== 'push' ||
                ci.head_branch !== 'main' || ci.head_sha !== sha ||
                ci.status !== 'completed' || ci.conclusion !== 'success' ||
                corrections.name !== 'Order Release Corrections Production' ||
                corrections.event !== 'workflow_dispatch' ||
                corrections.head_branch !== 'main' || corrections.head_sha !== sha ||
                corrections.status !== 'completed' || corrections.conclusion !== 'success') {
              throw new Error('Order checkout cutover main/run readback drifted');
            }
      - name: Verify exact terminal migration bytes
        shell: bash
        run: |
          set -euo pipefail
          latest="$(find prisma/migrations -mindepth 1 -maxdepth 1 -type d -print | LC_ALL=C sort | tail -n 1)"
          test "$latest" = "prisma/migrations/20260926012300_retire_legacy_checkout_reservation_creators"
          printf '%s  %s\n' \
            '6bd4f7d1261efd04a8dc003161f8b728483ab9437a99677355b9c6a7e0fb9924' \
            'prisma/migrations/20260926012300_retire_legacy_checkout_reservation_creators/migration.sql' \
            > "$RUNNER_TEMP/order-checkout-cutover-checksum"
          sha256sum --check --status "$RUNNER_TEMP/order-checkout-cutover-checksum"
      - name: Verify owner connection boundary
        run: node scripts/guard-production-migration-runner.mjs
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
      - name: Read exact predecessor or restart ledger state
        id: cutover_scope
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
        run: |
          node --input-type=module - <<'NODE'
          import assert from 'node:assert/strict';
          import { appendFileSync } from 'node:fs';
          import { Client } from 'pg';
          const corrections = new Map([
            ['20260926010000_correct_order_provider_terminal_reconciliation', '6e835d8da110ee53384d1afd898fe0e02a8c9679f48be24a43557173b3651987'],
            ['20260926011000_correct_order_paid_checkout_bound_reservation', '757d579c6ac61a9a3d5b434eb9421c1da2dad24d8051c08b61ce2e2850bb4b36'],
            ['20260926012000_correct_order_seller_deauthorization_fulfillment', 'de3db869562e4cdbe411efb1652f0cefb2f2a9687a079e15e84b70aaeb740263'],
            ['20260926012100_correct_order_seller_deauthorization_label', '75b2c6d00f9f7996c6140a57adbcc91f207cf96e2c495478fb21a9a633f0b29f'],
            ['20260926012200_correct_order_seller_deauthorization_projection', '4b8ed62faa14d9fa32c57c0045847357d04c16889f9a1d2e3b83633a1c482578'],
          ]);
          const cutover = '20260926012300_retire_legacy_checkout_reservation_creators';
          const cutoverDigest = '6bd4f7d1261efd04a8dc003161f8b728483ab9437a99677355b9c6a7e0fb9924';
          const client = new Client({connectionString: process.env.DIRECT_URL});
          try {
            await client.connect();
            await client.query('BEGIN READ ONLY');
            const ledger = await client.query(`
              SELECT migration_name, checksum, finished_at, rolled_back_at,
                     applied_steps_count
                FROM public._prisma_migrations
               WHERE migration_name = ANY($1::text[])
                  OR migration_name = $2
               ORDER BY migration_name
            `, [[...corrections.keys()], cutover]);
            const rowsByName = new Map();
            for (const row of ledger.rows) {
              assert.equal(rowsByName.has(row.migration_name), false);
              rowsByName.set(row.migration_name, row);
            }
            for (const [migration, digest] of corrections) {
              const row = rowsByName.get(migration);
              assert.ok(row);
              assert.equal(row.checksum, digest);
              assert.ok(row.finished_at);
              assert.equal(row.rolled_back_at, null);
              assert.equal(Number(row.applied_steps_count), 1);
            }
            const cutoverRow = rowsByName.get(cutover);
            if (cutoverRow) {
              assert.equal(cutoverRow.checksum, cutoverDigest);
              assert.ok(cutoverRow.finished_at);
              assert.equal(cutoverRow.rolled_back_at, null);
              assert.equal(Number(cutoverRow.applied_steps_count), 1);
            }
            assert.equal(
              ledger.rows.length,
              corrections.size + (cutoverRow ? 1 : 0),
            );
            appendFileSync(
              process.env.GITHUB_OUTPUT,
              `state=${cutoverRow ? 'restart' : 'predecessor'}\n`,
            );
          } finally {
            try { await client.query('ROLLBACK'); } catch {}
            await client.end();
          }
          NODE
      - name: Require no other pending migration for the selected state
        shell: bash
        env:
          CUTOVER_STATE: ${{ steps.cutover_scope.outputs.state }}
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
        run: |
          set -euo pipefail
          if [[ "$CUTOVER_STATE" == "predecessor" ]]; then
            deferred="$RUNNER_TEMP/20260926012300_retire_legacy_checkout_reservation_creators"
            restore_cutover() {
              if [[ -d "$deferred" ]]; then
                mv "$deferred" prisma/migrations/
              fi
            }
            trap restore_cutover EXIT
            mv prisma/migrations/20260926012300_retire_legacy_checkout_reservation_creators "$deferred"
            npx prisma migrate status
            restore_cutover
            trap - EXIT
          elif [[ "$CUTOVER_STATE" == "restart" ]]; then
            npx prisma migrate status
          else
            echo "Unexpected checkout cutover state" >&2
            exit 1
          fi
      - name: Apply only legacy checkout creator retirement
        if: steps.cutover_scope.outputs.state == 'predecessor'
        run: npx prisma migrate deploy
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
      - name: Verify retirement ledger and runtime function partition
        shell: bash
        run: |
          node --input-type=module - <<'NODE'
          import assert from 'node:assert/strict';
          import { Client } from 'pg';
          const migration = '20260926012300_retire_legacy_checkout_reservation_creators';
          const digest = '6bd4f7d1261efd04a8dc003161f8b728483ab9437a99677355b9c6a7e0fb9924';
          const legacy = [
            'grainline_checkout_reservation_create_cart(text,text,text,text,text)',
            'grainline_checkout_reservation_create_single(text,text,integer,text)',
            'grainline_checkout_reservation_create_cart_consistent(text,text,text,text,text,jsonb)',
            'grainline_checkout_reservation_create_single_consistent(text,text,integer,text[],text,jsonb)',
          ];
          const snapshot = [
            'grainline_checkout_reservation_create_cart_snapshot(text,text,text,text,text,jsonb)',
            'grainline_checkout_reservation_create_single_snapshot(text,text,integer,text[],text,jsonb)',
          ];
          const client = new Client({connectionString: process.env.DIRECT_URL});
          try {
            await client.connect();
            await client.query('BEGIN READ ONLY');
            const ledger = await client.query(`
              SELECT checksum, finished_at, rolled_back_at, applied_steps_count
                FROM public._prisma_migrations
               WHERE migration_name = $1
            `, [migration]);
            assert.equal(ledger.rows.length, 1);
            assert.equal(ledger.rows[0].checksum, digest);
            assert.ok(ledger.rows[0].finished_at);
            assert.equal(ledger.rows[0].rolled_back_at, null);
            assert.equal(Number(ledger.rows[0].applied_steps_count), 1);
            for (const signature of legacy) {
              const result = await client.query(`
                SELECT pg_catalog.has_function_privilege(
                  'grainline_app_runtime', $1::regprocedure, 'EXECUTE'
                ) AS runtime_execute,
                pg_catalog.has_function_privilege('public', $1::regprocedure, 'EXECUTE')
                  AS public_execute
              `, [`public.${signature}`]);
              assert.deepEqual(result.rows, [{runtime_execute: false, public_execute: false}]);
            }
            for (const signature of snapshot) {
              const result = await client.query(`
                SELECT pg_catalog.has_function_privilege(
                  'grainline_app_runtime', $1::regprocedure, 'EXECUTE'
                ) AS runtime_execute,
                pg_catalog.has_function_privilege('public', $1::regprocedure, 'EXECUTE')
                  AS public_execute
              `, [`public.${signature}`]);
              assert.deepEqual(result.rows, [{runtime_execute: true, public_execute: false}]);
            }
            const active = await client.query(`
              SELECT pg_catalog.count(*)::integer AS count
                FROM public."CheckoutStockReservation"
               WHERE "sourceSnapshot" IS NULL
                 AND status IN ('RESERVED', 'SESSION_CREATED')
            `);
            process.stdout.write(`Legacy checkout drain started with ${active.rows[0].count} active reservation(s)\n`);
          } finally {
            try { await client.query('ROLLBACK'); } catch {}
            await client.end();
          }
          NODE
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
      - name: Audit post-cutover runtime grants and global RLS catalog
        run: npm run audit:db-grants -- --require-direct-url
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
      - name: Keep predecessor live while the 31-minute checkout window and repair cadence drain
        shell: bash
        run: sleep 2820
      - name: Prove no active legacy checkout remains
        shell: bash
        run: |
          node --input-type=module - <<'NODE'
          import assert from 'node:assert/strict';
          import { Client } from 'pg';
          const migration = '20260926012300_retire_legacy_checkout_reservation_creators';
          const client = new Client({connectionString: process.env.DIRECT_URL});
          try {
            await client.connect();
            await client.query('BEGIN READ ONLY');
            const result = await client.query(`
              WITH cutover AS (
                SELECT finished_at AT TIME ZONE 'UTC' AS finished_at_utc
                  FROM public._prisma_migrations
                 WHERE migration_name = $1
                   AND finished_at IS NOT NULL
                   AND rolled_back_at IS NULL
                   AND applied_steps_count = 1
              )
              SELECT
                pg_catalog.count(*) FILTER (
                  WHERE reservation."sourceSnapshot" IS NULL
                    AND reservation.status IN ('RESERVED', 'SESSION_CREATED')
                )::integer AS active_legacy,
                pg_catalog.count(*) FILTER (
                  WHERE reservation."sourceSnapshot" IS NULL
                    AND reservation."createdAt" >= cutover.finished_at_utc
                )::integer AS legacy_created_after_cutover,
                pg_catalog.count(*) FILTER (
                  WHERE reservation."sourceSnapshot" IS NULL
                    AND reservation.status IN ('RESERVED', 'SESSION_CREATED')
                    AND reservation."expiresAt" >
                      (pg_catalog.clock_timestamp() AT TIME ZONE 'UTC')
                )::integer AS unexpired_legacy
              FROM cutover
              LEFT JOIN public."CheckoutStockReservation" AS reservation ON true
              GROUP BY cutover.finished_at_utc
            `, [migration]);
            assert.equal(result.rows.length, 1);
            assert.deepEqual(result.rows[0], {
              active_legacy: 0,
              legacy_created_after_cutover: 0,
              unexpired_legacy: 0,
            });
            process.stdout.write('Legacy checkout drain complete; promotion remains separate\n');
          } finally {
            try { await client.query('ROLLBACK'); } catch {}
            await client.end();
          }
          NODE
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
      - name: Verify final Prisma migration status
        run: npx prisma migrate status
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
