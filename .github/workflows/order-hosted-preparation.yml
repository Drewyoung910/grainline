name: Order Hosted Worker Preparation

on:
  push:
    branches: [proof/order-hosted-preparation-20260913]

permissions:
  contents: read

concurrency:
  group: order-hosted-preparation-proof
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'Drewyoung910/grainline' && github.ref == 'refs/heads/proof/order-hosted-preparation-20260913'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.2
          architecture: x64
          check-latest: false
          package-manager-cache: false
          token: ''
      - name: Check hosted preparation refusal contracts
        run: python3 -B -I tests/order_hosted_preparation_test.py
      - name: Verify hosted placement and prepare one clean worker
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -I scripts/order-hosted-preparation/hosted_prepare.py "$GITHUB_WORKSPACE" "$(command -v node)"
      - name: Retain bounded preparation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: order-hosted-preparation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/order-hosted-evidence/
          if-no-files-found: error
          retention-days: 14
          overwrite: false
          archive: true
