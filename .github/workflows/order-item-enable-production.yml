name: OrderItem ENABLE Production

on:
  workflow_dispatch:
    inputs:
      release_commit:
        description: Exact reviewed main commit
        required: true
        type: string
      main_ci_run_id:
        description: Successful full push CI run for that exact main commit
        required: true
        type: string
      authority_inspection_run_id:
        description: Successful Order child authority inspection run
        required: true
        type: string
      confirmation:
        description: Type enable-reviewed-order-item-rls
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: production-database-migrations
  cancel-in-progress: false

jobs:
  enable:
    name: Enable policyless OrderItem RLS
    if: >-
      github.repository == 'Drewyoung910/grainline' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      github.run_attempt == 1 &&
      inputs.confirmation == 'enable-reviewed-order-item-rls'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: Production
    env:
      MIGRATION_DB_ROLE: neondb_owner
      PRODUCTION_MIGRATION_CONFIRM: run-reviewed-production-migrations-from-main
      PRODUCTION_MIGRATION_DIRECT_URL_SHA256: ${{ vars.PRODUCTION_MIGRATION_DIRECT_URL_SHA256 }}
      PRODUCTION_MIGRATION_RELEASE_COMMIT: ${{ inputs.release_commit }}
      RUNTIME_DB_ROLE: grainline_app_runtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.2"
          architecture: x64
          check-latest: false
          package-manager-cache: false
          token: ""
      - run: npm ci --ignore-scripts
      - name: Bind ENABLE to exact main, CI and accepted authority inspection
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          REVIEWED_RELEASE_COMMIT: ${{ inputs.release_commit }}
          REVIEWED_MAIN_CI_RUN_ID: ${{ inputs.main_ci_run_id }}
          REVIEWED_INSPECTION_RUN_ID: ${{ inputs.authority_inspection_run_id }}
        with:
          script: |
            const sha = process.env.REVIEWED_RELEASE_COMMIT;
            const ciValue = process.env.REVIEWED_MAIN_CI_RUN_ID;
            const inspectionValue = process.env.REVIEWED_INSPECTION_RUN_ID;
            if (!/^[0-9a-f]{40}$/.test(sha ?? '') || sha !== context.sha ||
                !/^[1-9][0-9]{0,19}$/.test(ciValue ?? '') ||
                !/^[1-9][0-9]{0,19}$/.test(inspectionValue ?? '')) {
              throw new Error('OrderItem ENABLE binding drifted');
            }
            const ciRunId = Number(ciValue);
            const inspectionRunId = Number(inspectionValue);
            if (!Number.isSafeInteger(ciRunId) ||
                !Number.isSafeInteger(inspectionRunId)) {
              throw new Error('OrderItem ENABLE run id is unsafe');
            }
            const [{data: main}, {data: ci}, {data: inspection}] =
              await Promise.all([
                github.rest.repos.getBranch({...context.repo, branch: 'main'}),
                github.rest.actions.getWorkflowRun({...context.repo, run_id: ciRunId}),
                github.rest.actions.getWorkflowRun({...context.repo, run_id: inspectionRunId}),
              ]);
            if (main.commit.sha !== sha || ci.name !== 'CI' ||
                ci.event !== 'push' || ci.head_branch !== 'main' ||
                ci.head_sha !== sha || ci.status !== 'completed' ||
                ci.conclusion !== 'success' ||
                inspection.name !== 'Order Child Authority Inspection' ||
                inspection.event !== 'workflow_dispatch' ||
                inspection.head_branch !== 'main' ||
                inspection.status !== 'completed' ||
                inspection.conclusion !== 'success' ||
                !/^[0-9a-f]{40}$/.test(inspection.head_sha ?? '')) {
              throw new Error('OrderItem ENABLE main/run readback drifted');
            }
            const {data: comparison} = await github.rest.repos.compareCommits({
              ...context.repo,
              base: inspection.head_sha,
              head: sha,
            });
            if (!['ahead', 'identical'].includes(comparison.status)) {
              throw new Error('Accepted authority inspection is not an ancestor');
            }
      - name: Verify exact policyless ENABLE release
        shell: bash
        run: |
          set -euo pipefail
          latest="$(find prisma/migrations -mindepth 1 -maxdepth 1 -type d -print | LC_ALL=C sort | tail -n 1)"
          test "$latest" = "prisma/migrations/20261001030000_enable_order_item_rls"
          echo "8af35ca444c477df1cbd31c12561aadaeb9b9c61a77e73422e66dfcbd475ed39  prisma/migrations/20261001030000_enable_order_item_rls/migration.sql" | sha256sum --check --status
          node --test tests/order-item-enable-release.test.mjs tests/order-child-authority-catalog.test.mjs tests/order-direct-access-inventory.test.mjs
      - name: Verify owner connection boundary
        run: node scripts/guard-production-migration-runner.mjs
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
      - name: Capture exact predecessor or restart state
        id: preflight
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
        run: |
          node --input-type=module - <<'NODE'
          import assert from 'node:assert/strict';
          import {appendFileSync} from 'node:fs';
          import pg from 'pg';
          const predecessor = Object.freeze({
            name: '20260930040000_prepare_order_dispute_recovery',
            checksum: '555e26acc3c9d6361d629d86225b63177667363de4ac299c37696072504a9799',
          });
          const migration = Object.freeze({
            name: '20261001030000_enable_order_item_rls',
            checksum: '8af35ca444c477df1cbd31c12561aadaeb9b9c61a77e73422e66dfcbd475ed39',
          });
          const client = new pg.Client({connectionString: process.env.DIRECT_URL});
          try {
            await client.connect();
            await client.query('BEGIN ISOLATION LEVEL REPEATABLE READ READ ONLY');
            const result = await client.query(`
              SELECT migration_name, checksum, finished_at, rolled_back_at,
                     applied_steps_count
                FROM public._prisma_migrations
               WHERE migration_name = ANY($1::text[])
               ORDER BY migration_name
            `, [[predecessor.name, migration.name]]);
            const rows = new Map(result.rows.map((row) => [row.migration_name, row]));
            const accepted = (row, checksum) => row && row.checksum === checksum &&
              row.finished_at && row.rolled_back_at === null &&
              Number(row.applied_steps_count) === 1;
            assert.equal(accepted(rows.get(predecessor.name), predecessor.checksum), true);
            const candidate = rows.get(migration.name);
            if (candidate) assert.equal(accepted(candidate, migration.checksum), true);
            assert.equal(result.rows.length, candidate ? 2 : 1);
            appendFileSync(process.env.GITHUB_OUTPUT,
              `state=${candidate ? 'applied' : 'pending'}\n`);
          } finally {
            try { await client.query('ROLLBACK'); } catch {}
            await client.end();
          }
          NODE
      - name: Require every predecessor applied and no other pending migration
        shell: bash
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
          MIGRATION_STATE: ${{ steps.preflight.outputs.state }}
        run: |
          set -euo pipefail
          migration=20261001030000_enable_order_item_rls
          if [[ "$MIGRATION_STATE" == "pending" ]]; then
            holding="$RUNNER_TEMP/$migration"
            mv "prisma/migrations/$migration" "$holding"
            trap 'if [[ -d "$holding" ]]; then mv "$holding" "prisma/migrations/$migration"; fi' EXIT
            npx prisma migrate status
            mv "$holding" "prisma/migrations/$migration"
            trap - EXIT
          elif [[ "$MIGRATION_STATE" == "applied" ]]; then
            npx prisma migrate status
          else
            echo "Unexpected OrderItem ENABLE state" >&2
            exit 1
          fi
      - name: Apply only reviewed OrderItem ENABLE
        if: steps.preflight.outputs.state == 'pending'
        run: npx prisma migrate deploy
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
      - name: Read back exact ledger and authority catalog
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
        run: |
          node --input-type=module - <<'NODE'
          import assert from 'node:assert/strict';
          import {writeFileSync} from 'node:fs';
          import pg from 'pg';
          import {
            readOrderChildAuthorityCatalog,
            verifyOrderChildAuthorityCatalog,
          } from './scripts/order-child-authority-catalog.mjs';
          const migration = '20261001030000_enable_order_item_rls';
          const checksum = '8af35ca444c477df1cbd31c12561aadaeb9b9c61a77e73422e66dfcbd475ed39';
          const client = new pg.Client({connectionString: process.env.DIRECT_URL});
          try {
            await client.connect();
            await client.query('BEGIN ISOLATION LEVEL REPEATABLE READ READ ONLY');
            const ledger = await client.query(`
              SELECT checksum, finished_at, rolled_back_at, applied_steps_count
                FROM public._prisma_migrations WHERE migration_name = $1
            `, [migration]);
            assert.equal(ledger.rows.length, 1);
            assert.equal(ledger.rows[0].checksum, checksum);
            assert.ok(ledger.rows[0].finished_at);
            assert.equal(ledger.rows[0].rolled_back_at, null);
            assert.equal(Number(ledger.rows[0].applied_steps_count), 1);
            const catalog = await readOrderChildAuthorityCatalog(client);
            const result = verifyOrderChildAuthorityCatalog(
              catalog,
              process.cwd(),
              {orderItemRlsEnabled: true, orderItemRlsForced: false},
            );
            await client.query('ROLLBACK');
            writeFileSync(
              `${process.env.RUNNER_TEMP}/order-item-enable-catalog.json`,
              `${JSON.stringify({result, catalog}, null, 2)}\n`,
              {mode: 0o600, flag: 'wx'},
            );
          } finally {
            try { await client.query('ROLLBACK'); } catch {}
            await client.end();
          }
          NODE
      - name: Preserve sanitized ENABLE catalog
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: order-item-enable-catalog-${{ github.run_id }}
          path: ${{ runner.temp }}/order-item-enable-catalog.json
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: false
