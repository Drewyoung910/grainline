name: Private Table RLS Activation Production

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Reviewed combined private-table RLS activation
        required: true
        type: choice
        options:
          - maker_verification_v1
      release_commit:
        description: Exact reviewed main commit
        required: true
        type: string
      main_ci_run_id:
        description: Successful full push CI run for that exact main commit
        required: true
        type: string
      preparation_run_id:
        description: Accepted protected private-table preparation run
        required: true
        type: string
      compatible_app_commit:
        description: Exact compatible app commit already live in Production
        required: true
        type: string
      production_deployment_id:
        description: Exact live compatible Production deployment
        required: true
        type: string
      superseded_app_deployment_id:
        description: Exact predecessor blocked by the compatible deployment's Vercel skew threshold
        required: true
        type: string
      superseded_app_commit:
        description: Exact source commit of the reviewed predecessor deployment
        required: true
        type: string
      confirmation:
        description: Type activate-reviewed-private-table-rls
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: production-database-migrations
  cancel-in-progress: false

jobs:
  activate:
    name: Activate reviewed private-table RLS
    if: >-
      github.repository == 'Drewyoung910/grainline' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      github.run_attempt == 1 &&
      inputs.confirmation == 'activate-reviewed-private-table-rls'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: Production
    env:
      MIGRATION_DB_ROLE: neondb_owner
      PRIVATE_TABLE_RLS_ACTIVATION_RELEASE_ID: ${{ inputs.release_id }}
      PRODUCTION_MIGRATION_CONFIRM: run-reviewed-production-migrations-from-main
      PRODUCTION_MIGRATION_DIRECT_URL_SHA256: ${{ vars.PRODUCTION_MIGRATION_DIRECT_URL_SHA256 }}
      PRODUCTION_MIGRATION_RELEASE_COMMIT: ${{ inputs.release_commit }}
      RUNTIME_DB_ROLE: grainline_app_runtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.2"
          architecture: x64
          check-latest: false
          package-manager-cache: false
          token: ""
      - run: npm ci --ignore-scripts
      - run: npx prisma generate
      - name: Read reviewed activation binding from byte-sealed catalog
        id: catalog
        shell: bash
        run: |
          set -euo pipefail
          migration="$(node scripts/private-table-rls-activation-catalog.mjs)"
          minimum_compatible_app_commit="$(
            node scripts/private-table-rls-activation-catalog.mjs \
              --minimum-compatible-app-commit
          )"
          echo "migration=$migration" >> "$GITHUB_OUTPUT"
          echo "minimum_compatible_app_commit=$minimum_compatible_app_commit" >> "$GITHUB_OUTPUT"
      - name: Bind activation to exact main, preparation, green checks, and compatible app
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          REVIEWED_RELEASE_COMMIT: ${{ inputs.release_commit }}
          REVIEWED_MAIN_CI_RUN_ID: ${{ inputs.main_ci_run_id }}
          REVIEWED_PREPARATION_RUN_ID: ${{ inputs.preparation_run_id }}
          REVIEWED_COMPATIBLE_APP_COMMIT: ${{ inputs.compatible_app_commit }}
          REVIEWED_MINIMUM_COMPATIBLE_APP_COMMIT: ${{ steps.catalog.outputs.minimum_compatible_app_commit }}
          REVIEWED_PRODUCTION_DEPLOYMENT_ID: ${{ inputs.production_deployment_id }}
          REVIEWED_SUPERSEDED_DEPLOYMENT_ID: ${{ inputs.superseded_app_deployment_id }}
          REVIEWED_SUPERSEDED_APP_COMMIT: ${{ inputs.superseded_app_commit }}
        with:
          script: |
            const sha = process.env.REVIEWED_RELEASE_COMMIT;
            const ciValue = process.env.REVIEWED_MAIN_CI_RUN_ID;
            const preparationValue = process.env.REVIEWED_PREPARATION_RUN_ID;
            const compatibleAppCommit = process.env.REVIEWED_COMPATIBLE_APP_COMMIT;
            const minimumCompatibleAppCommit =
              process.env.REVIEWED_MINIMUM_COMPATIBLE_APP_COMMIT;
            const deploymentId = process.env.REVIEWED_PRODUCTION_DEPLOYMENT_ID;
            const supersededDeploymentId = process.env.REVIEWED_SUPERSEDED_DEPLOYMENT_ID;
            const supersededAppCommit = process.env.REVIEWED_SUPERSEDED_APP_COMMIT;
            if (!/^[0-9a-f]{40}$/.test(sha ?? '') || sha !== context.sha ||
                !/^[0-9a-f]{40}$/.test(compatibleAppCommit ?? '') ||
                !/^[0-9a-f]{40}$/.test(minimumCompatibleAppCommit ?? '') ||
                !/^[0-9a-f]{40}$/.test(supersededAppCommit ?? '') ||
                !/^dpl_[A-Za-z0-9]{20,64}$/.test(deploymentId ?? '') ||
                !/^dpl_[A-Za-z0-9]{20,64}$/.test(supersededDeploymentId ?? '') ||
                supersededDeploymentId === deploymentId ||
                !/^[1-9][0-9]{0,19}$/.test(ciValue ?? '') ||
                !/^[1-9][0-9]{0,19}$/.test(preparationValue ?? '')) {
              throw new Error('Private-table RLS activation binding drifted');
            }
            const ciRunId = Number(ciValue);
            const preparationRunId = Number(preparationValue);
            if (!Number.isSafeInteger(ciRunId) || !Number.isSafeInteger(preparationRunId)) {
              throw new Error('Private-table RLS activation run id is unsafe');
            }
            const [{data: main}, {data: ci}, {data: preparation}] = await Promise.all([
              github.rest.repos.getBranch({...context.repo, branch: 'main'}),
              github.rest.actions.getWorkflowRun({...context.repo, run_id: ciRunId}),
              github.rest.actions.getWorkflowRun({...context.repo, run_id: preparationRunId}),
            ]);
            if (main.commit.sha !== sha || ci.name !== 'CI' ||
                ci.path !== '.github/workflows/ci.yml' || ci.event !== 'push' ||
                ci.head_branch !== 'main' || ci.head_sha !== sha ||
                ci.status !== 'completed' || ci.conclusion !== 'success') {
              throw new Error('Private-table RLS activation main/CI readback drifted');
            }
            if (preparation.name !== 'Private Table Preparation Production' ||
                preparation.path !== '.github/workflows/private-table-preparation-production.yml' ||
                preparation.event !== 'workflow_dispatch' ||
                preparation.head_branch !== 'main' || preparation.run_attempt !== 1 ||
                preparation.status !== 'completed' || preparation.conclusion !== 'success' ||
                !/^[0-9a-f]{40}$/.test(preparation.head_sha ?? '')) {
              throw new Error('Accepted private-table preparation run drifted');
            }
            const preparationJobs = await github.paginate(
              github.rest.actions.listJobsForWorkflowRun,
              {...context.repo, run_id: preparationRunId, per_page: 100},
            );
            if (preparationJobs.filter((job) =>
              job.name === 'Apply reviewed private-table compatibility preparation' &&
              job.status === 'completed' && job.conclusion === 'success'
            ).length !== 1) {
              throw new Error('Accepted private-table preparation job is absent');
            }
            const [minimumToPreparation, preparationToApp, appToRelease, predecessorToApp] =
              await Promise.all([
              github.rest.repos.compareCommits({
                ...context.repo,
                base: minimumCompatibleAppCommit,
                head: preparation.head_sha,
              }),
              github.rest.repos.compareCommits({
                ...context.repo, base: preparation.head_sha, head: compatibleAppCommit,
              }),
              github.rest.repos.compareCommits({
                ...context.repo, base: compatibleAppCommit, head: sha,
              }),
              github.rest.repos.compareCommits({
                ...context.repo, base: supersededAppCommit, head: compatibleAppCommit,
              }),
            ]);
            if (!['ahead', 'identical'].includes(minimumToPreparation.data.status) ||
                !['ahead', 'identical'].includes(preparationToApp.data.status) ||
                !['ahead', 'identical'].includes(appToRelease.data.status) ||
                predecessorToApp.data.status !== 'ahead') {
              throw new Error('Preparation, compatible app, predecessor, and activation ancestry drifted');
            }
            const exactPushRuns = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              {...context.repo, branch: 'main', event: 'push', head_sha: sha, per_page: 100},
            );
            const latestByWorkflow = new Map();
            for (const run of exactPushRuns) {
              if (run.head_sha !== sha || run.head_branch !== 'main' || run.event !== 'push') continue;
              const key = run.path || run.name;
              const previous = latestByWorkflow.get(key);
              if (!previous || Number(run.id) > Number(previous.id)) latestByWorkflow.set(key, run);
            }
            const required = new Set([
              '.github/workflows/ci.yml',
              '.github/workflows/conversation-message-force-proof.yml',
              '.github/workflows/notification-rls-ephemeral-proof.yml',
              '.github/workflows/account-deletion-worker-bootstrap-proof.yml',
              '.github/workflows/order-staff-bootstrap-proof.yml',
              '.github/workflows/order-paid-repair-lock-proof.yml',
              '.github/workflows/order-account-deletion-concurrency-proof.yml',
            ]);
            const missing = [...required].filter((path) => !latestByWorkflow.has(path));
            if (missing.length !== 0) {
              throw new Error(`Required exact-main push workflows are absent: ${missing.join(', ')}`);
            }
            const unacceptable = [...latestByWorkflow.values()].filter((run) =>
              run.status !== 'completed' || run.conclusion !== 'success'
            );
            if (unacceptable.length !== 0) {
              throw new Error(`Exact-main push workflows are not all green: ${unacceptable
                .map((run) => `${run.name}:${run.status}/${run.conclusion}`).join(', ')}`);
            }
      - name: Download accepted preparation evidence
        id: preparation_evidence
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          REVIEWED_PREPARATION_RUN_ID: ${{ inputs.preparation_run_id }}
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const runValue = process.env.REVIEWED_PREPARATION_RUN_ID;
            if (!/^[1-9][0-9]{0,19}$/.test(runValue ?? '')) {
              throw new Error('Preparation evidence run id drifted');
            }
            const runId = Number(runValue);
            if (!Number.isSafeInteger(runId)) {
              throw new Error('Preparation evidence run id is unsafe');
            }
            const {data: run} = await github.rest.actions.getWorkflowRun({
              ...context.repo,
              run_id: runId,
            });
            if (run.name !== 'Private Table Preparation Production' ||
                run.path !== '.github/workflows/private-table-preparation-production.yml' ||
                run.event !== 'workflow_dispatch' || run.head_branch !== 'main' ||
                run.run_attempt !== 1 || run.status !== 'completed' ||
                run.conclusion !== 'success' ||
                !/^[0-9a-f]{40}$/.test(run.head_sha ?? '')) {
              throw new Error('Preparation evidence source run drifted');
            }
            const artifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              {...context.repo, run_id: runId, per_page: 100},
            );
            const expectedName = `private-table-preparation-production-${runId}`;
            const matches = artifacts.filter((artifact) =>
              artifact.name === expectedName && artifact.expired !== true
            );
            const maximumArtifactBytes = 5 * 1024 * 1024;
            const artifactBytes = Number(matches[0]?.size_in_bytes);
            if (matches.length !== 1 || !Number.isSafeInteger(artifactBytes) ||
                artifactBytes <= 0 || artifactBytes > maximumArtifactBytes) {
              throw new Error('Accepted preparation evidence artifact is absent or ambiguous');
            }
            const response = await github.rest.actions.downloadArtifact({
              ...context.repo,
              artifact_id: matches[0].id,
              archive_format: 'zip',
            });
            const archivePath = path.join(
              process.env.RUNNER_TEMP,
              `private-table-preparation-${runId}.zip`,
            );
            const archive = Buffer.from(response.data);
            if (archive.length <= 0 || archive.length > maximumArtifactBytes) {
              throw new Error('Accepted preparation evidence archive size drifted');
            }
            fs.writeFileSync(archivePath, archive, {
              flag: 'wx',
              mode: 0o600,
            });
            core.setOutput('archive', archivePath);
            core.setOutput('preparation_commit', run.head_sha);
      - name: Bind activation to accepted preparation evidence
        shell: bash
        env:
          PRIVATE_TABLE_PREPARATION_ACCEPTED_COMMIT: ${{ steps.preparation_evidence.outputs.preparation_commit }}
          PRIVATE_TABLE_PREPARATION_ARCHIVE: ${{ steps.preparation_evidence.outputs.archive }}
          PRIVATE_TABLE_PREPARATION_BINDING_EVIDENCE_PATH: ${{ runner.temp }}/private-table-rls-${{ github.sha }}-preparation-binding.json
        run: |
          set -euo pipefail
          directory="$RUNNER_TEMP/private-table-preparation-accepted-${GITHUB_RUN_ID}"
          actual="$RUNNER_TEMP/private-table-preparation-${GITHUB_RUN_ID}-actual.txt"
          expected="$RUNNER_TEMP/private-table-preparation-${GITHUB_RUN_ID}-expected.txt"
          install -d -m 0700 "$directory"
          unzip -Z1 "$PRIVATE_TABLE_PREPARATION_ARCHIVE" | LC_ALL=C sort > "$actual"
          printf '%s\n' \
            "private-table-preparation-${PRIVATE_TABLE_PREPARATION_ACCEPTED_COMMIT}-postflight.json" \
            "private-table-preparation-${PRIVATE_TABLE_PREPARATION_ACCEPTED_COMMIT}-preflight.json" \
            | LC_ALL=C sort > "$expected"
          cmp "$expected" "$actual"
          unzip -qq "$PRIVATE_TABLE_PREPARATION_ARCHIVE" -d "$directory"
          PRIVATE_TABLE_PREPARATION_ACCEPTED_EVIDENCE_DIRECTORY="$directory" \
            node scripts/private-table-preparation-evidence-verify.mjs
      - name: Verify reviewed private-table activation source before owner access
        shell: bash
        run: |
          set -euo pipefail
          migration="$(node scripts/private-table-rls-activation-catalog.mjs)"
          latest="$(ls -1d prisma/migrations/*/ | sed 's#/$##; s#.*/##' | LC_ALL=C sort | tail -n 1)"
          test "$latest" = "$migration"
          node --test \
            tests/private-table-rls-activation-catalog.test.mjs \
            tests/private-table-rls-activation-production.test.mjs \
            tests/reviewed-pending-migrations.test.mjs
          case "$PRIVATE_TABLE_RLS_ACTIVATION_RELEASE_ID" in
            maker_verification_v1)
              node --test \
                tests/account-export-privacy.test.mjs \
                tests/admin-action-guardrails.test.mjs \
                tests/maker-verification-preparation.test.mjs \
                tests/round10-state-machine-guardrails.test.mjs \
                tests/round9-account-deletion-pii-guardrails.test.mjs
              ;;
            *) exit 1 ;;
          esac
      - name: Verify exact compatible deployment is live and predecessor skew is closed
        env:
          REVIEWED_PRODUCTION_DEPLOYMENT_ID: ${{ inputs.production_deployment_id }}
          REVIEWED_RELEASE_COMMIT: ${{ inputs.compatible_app_commit }}
          REVIEWED_SUPERSEDED_DEPLOYMENT_ID: ${{ inputs.superseded_app_deployment_id }}
        run: node scripts/verify-order-email-free-deployment-surface.mjs
      - name: Verify owner connection boundary
        run: node scripts/guard-production-migration-runner.mjs
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
      - name: Inspect restart-safe private-table state before activation
        id: preflight
        shell: bash
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
          PRIVATE_TABLE_RLS_ACTIVATION_PHASE: preflight
          PRIVATE_TABLE_RLS_ACTIVATION_EVIDENCE_PATH: ${{ runner.temp }}/private-table-rls-${{ github.sha }}-preflight.json
        run: |
          set -euo pipefail
          state="$(node scripts/private-table-rls-activation-production-inspect.mjs)"
          case "$state" in
            ready)
              migration="$(node scripts/private-table-rls-activation-catalog.mjs)"
              echo "pending=$migration" >> "$GITHUB_OUTPUT"
              ;;
            active_unrecorded)
              migration="$(node scripts/private-table-rls-activation-catalog.mjs)"
              echo "pending=$migration" >> "$GITHUB_OUTPUT"
              ;;
            active) echo "pending=" >> "$GITHUB_OUTPUT" ;;
            *) exit 1 ;;
          esac
          echo "state=$state" >> "$GITHUB_OUTPUT"
      - name: Require only the reviewed private-table activation pending
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
          REVIEWED_PENDING_MIGRATIONS: ${{ steps.preflight.outputs.pending }}
        run: node scripts/assert-reviewed-pending-migrations.mjs
      - name: Apply reviewed private-table activation outside Prisma's ledger
        if: steps.preflight.outputs.state == 'ready'
        shell: bash
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
          PGSSLROOTCERT: system
        run: |
          set -euo pipefail
          migration="$(node scripts/private-table-rls-activation-catalog.mjs)"
          psql "$DIRECT_URL" \
            --set=ON_ERROR_STOP=on \
            --file="prisma/migrations/$migration/migration.sql"
      - name: Record the committed private-table activation in Prisma's ledger
        if: >-
          steps.preflight.outputs.state == 'ready' ||
          steps.preflight.outputs.state == 'active_unrecorded'
        shell: bash
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
        run: |
          set -euo pipefail
          migration="$(node scripts/private-table-rls-activation-catalog.mjs)"
          npx prisma migrate resolve --applied "$migration"
      - name: Read back exact private-table RLS catalog
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
          PRIVATE_TABLE_RLS_ACTIVATION_PHASE: postflight
          PRIVATE_TABLE_RLS_ACTIVATION_EVIDENCE_PATH: ${{ runner.temp }}/private-table-rls-${{ github.sha }}-postflight.json
          PRIVATE_TABLE_RLS_ACTIVATION_PREVIOUS_EVIDENCE_PATH: ${{ runner.temp }}/private-table-rls-${{ github.sha }}-preflight.json
        run: node scripts/private-table-rls-activation-production-inspect.mjs
      - name: Require no migrations pending after activation
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
          REVIEWED_PENDING_MIGRATIONS: ""
        run: |
          node scripts/assert-reviewed-pending-migrations.mjs
          npx prisma migrate status
      - name: Audit global runtime grants after activation
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
          GRANT_AUDIT_DATABASE_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
        run: npm run audit:db-grants -- --require-direct-url
      - name: Preserve sanitized private-table RLS evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: private-table-rls-production-${{ github.run_id }}
          path: ${{ runner.temp }}/private-table-rls-${{ github.sha }}-*.json
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: false
