name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: grainline_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d grainline_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Database — CI uses local Postgres service container, not the Neon pooler/direct URLs from Vercel
      DATABASE_URL: postgresql://ci:ci@localhost:5432/grainline_ci?sslmode=disable
      DIRECT_URL: postgresql://ci:ci@localhost:5432/grainline_ci?sslmode=disable
      # Clerk auth
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_WEBHOOK_SECRET: ${{ secrets.CLERK_WEBHOOK_SECRET }}
      # Stripe
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      # Cloudflare R2
      CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_R2_BUCKET_NAME: ${{ secrets.CLOUDFLARE_R2_BUCKET_NAME }}
      CLOUDFLARE_R2_PUBLIC_URL: ${{ secrets.CLOUDFLARE_R2_PUBLIC_URL }}
      R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
      NEXT_PUBLIC_CLOUDFLARE_R2_PUBLIC_URL: ${{ secrets.NEXT_PUBLIC_CLOUDFLARE_R2_PUBLIC_URL }}
      NEXT_PUBLIC_R2_PUBLIC_URL: ${{ secrets.NEXT_PUBLIC_R2_PUBLIC_URL }}
      CLOUDFLARE_R2_PUBLIC_URLS: ${{ secrets.CLOUDFLARE_R2_PUBLIC_URLS }}
      ALLOWED_R2_PUBLIC_URLS: ${{ secrets.ALLOWED_R2_PUBLIC_URLS }}
      UPLOAD_VERIFICATION_SECRET: ci-upload-verification-secret
      # Upstash Redis
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      # Shipping
      SHIPPO_API_KEY: ${{ secrets.SHIPPO_API_KEY }}
      SHIPPING_RATE_SECRET: ${{ secrets.SHIPPING_RATE_SECRET }}
      # Email
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_WEBHOOK_SECRET: ${{ secrets.RESEND_WEBHOOK_SECRET }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      UNSUBSCRIBE_SECRET: ${{ secrets.UNSUBSCRIBE_SECRET }}
      EMAIL_UNSUBSCRIBE_SECRET: ${{ secrets.EMAIL_UNSUBSCRIBE_SECRET }}
      # AI
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      # Admin / cron
      ADMIN_PIN: ${{ secrets.ADMIN_PIN }}
      ADMIN_PIN_COOKIE_SECRET: ${{ secrets.ADMIN_PIN_COOKIE_SECRET }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      HEALTH_CHECK_TOKEN: ci-health-check-token
      EMAIL_OUTBOX_DAILY_LIMIT: "100"
      # Sentry / app
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
      NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prisma generate
      - name: Verify StripeWebhookEvent activation migration tree
        env:
          SAVED_SEARCH_RLS_DEPLOY_PHASE: stripe-webhook-event-activation-reviewed
        run: npm run verify:rls-release-artifact
      - name: Verify StripeWebhookEvent activation release
        run: npm run audit:rls-stripe-webhook-event-activation-release
      - name: Verify Case FORCE proof equivalence
        run: npm run audit:rls-case-force-release
      - name: Verify Case read-mode release bytes
        run: npm run audit:rls-case-read-mode-candidate
      - name: Verify Conversation and Message authority proof equivalence
        run: npm run audit:rls-conversation-message-authority-release
      - name: Verify Conversation and Message activation proof equivalence
        run: npm run audit:rls-conversation-message-activation-release
      - name: Verify Conversation and Message FORCE release artifact
        run: npm run audit:rls-conversation-message-force-release
      - name: Verify Notification activation proof equivalence
        run: npm run audit:rls-notification-activation-release
      - name: Verify Notification FORCE release artifact
        run: npm run audit:rls-notification-force-release
      - name: Verify DirectUpload retirement proof equivalence
        run: npm run audit:rls-direct-upload-retirement-release
      - name: Verify DirectUpload activation proof equivalence
        run: npm run audit:rls-direct-upload-activation-release
      - name: Prepare CI runtime policy role
        run: psql "$DIRECT_URL" -f scripts/prepare-ci-rls-runtime-role.sql
      - name: Prove runtime-role provisioning refusals exit nonzero
        run: |
          if psql "$DIRECT_URL" -v runtime_role=ci -v migration_role=ci -f scripts/provision-runtime-db-role.sql; then
            echo "runtime-role provisioning unexpectedly accepted the migration owner as runtime"
            exit 1
          fi
      - name: Isolate the exact Case activation until authority proofs pass
        run: >-
          mv
          prisma/migrations/20260804160000_enable_case_rls
          "$RUNNER_TEMP/case-activation-release"
      - name: Isolate the exact Case FORCE release until Phase A passes
        run: >-
          mv
          prisma/migrations/20260804191000_force_case_rls
          "$RUNNER_TEMP/case-force-release"
      - name: Isolate the exact DirectUpload activation until external grants converge
        run: >-
          mv
          prisma/migrations/20260801194000_enable_direct_upload_rls
          "$RUNNER_TEMP/direct-upload-activation-release"
      - name: Isolate the exact StripeWebhookEvent activation until compatibility proofs pass
        run: >-
          mv
          prisma/migrations/20260805060000_enable_stripe_webhook_event_rls
          "$RUNNER_TEMP/stripe-webhook-event-activation-release"
      - name: Apply compatible migrations to CI Postgres
        run: npx prisma migrate deploy
      - name: Converge pre-activation production-style runtime grants
        run: psql "$DIRECT_URL" -v runtime_role=grainline_app_runtime -v migration_role=ci -f scripts/provision-runtime-db-role.sql
      - name: Converge pre-activation DirectUpload cleanup-worker grants
        run: psql "$DIRECT_URL" -v cleanup_role=grainline_direct_upload_cleanup_v2 -v runtime_role=grainline_app_runtime -v migration_role=ci -f scripts/provision-direct-upload-cleanup-role.sql
      - name: Prove DirectUpload legacy repair in ephemeral PostgreSQL
        run: npm run audit:rls-direct-upload-legacy-repair
        env:
          DIRECT_UPLOAD_LEGACY_REPAIR_PROOF_DATABASE_URL: ${{ env.DIRECT_URL }}
      - name: Restore the exact DirectUpload activation release
        run: >-
          mv
          "$RUNNER_TEMP/direct-upload-activation-release"
          prisma/migrations/20260801194000_enable_direct_upload_rls
      - name: Apply migrations to CI Postgres
        run: npx prisma migrate deploy
      - name: Converge production-style runtime grants after migrations
        run: psql "$DIRECT_URL" -v runtime_role=grainline_app_runtime -v migration_role=ci -f scripts/provision-runtime-db-role.sql
      - name: Converge activated DirectUpload cleanup-worker grants
        run: psql "$DIRECT_URL" -v cleanup_role=grainline_direct_upload_cleanup_v2 -v runtime_role=grainline_app_runtime -v migration_role=ci -f scripts/provision-direct-upload-cleanup-role.sql
      - name: Prove participant Case resolution authority in ephemeral PostgreSQL
        run: npm run audit:rls-case-participant-resolution
        env:
          CASE_PARTICIPANT_RESOLUTION_PROOF_DATABASE_URL: ${{ env.DIRECT_URL }}
      - name: Prove buyer Case-open authority in ephemeral PostgreSQL
        run: npm run audit:rls-case-open-authority
        env:
          CASE_OPEN_AUTHORITY_PROOF_DATABASE_URL: ${{ env.DIRECT_URL }}
      - name: Prove Case-reply authority in ephemeral PostgreSQL
        run: npm run audit:rls-case-reply-authority
        env:
          CASE_REPLY_AUTHORITY_PROOF_DATABASE_URL: ${{ env.DIRECT_URL }}
      - name: Prove Case-message preflight authority in ephemeral PostgreSQL
        run: npm run audit:rls-case-message-preflight
        env:
          CASE_MESSAGE_PREFLIGHT_PROOF_DATABASE_URL: ${{ env.DIRECT_URL }}
      - name: Prove Case-message page authority in ephemeral PostgreSQL
        run: npm run audit:rls-case-message-page
        env:
          CASE_MESSAGE_PAGE_PROOF_DATABASE_URL: ${{ env.DIRECT_URL }}
      - name: Prove Case recipient-read authority in ephemeral PostgreSQL
        run: npm run audit:rls-case-recipient-read
        env:
          CASE_RECIPIENT_READ_PROOF_DATABASE_URL: ${{ env.DIRECT_URL }}
      - name: Prove Case staff queue authority in ephemeral PostgreSQL
        run: npm run audit:rls-case-staff-queue
        env:
          CASE_STAFF_QUEUE_PROOF_DATABASE_URL: ${{ env.DIRECT_URL }}
      - name: Prove Case-aware Order authority in ephemeral PostgreSQL
        run: npm run audit:rls-case-order-active
        env:
          CASE_ORDER_ACTIVE_PROOF_DATABASE_URL: ${{ env.DIRECT_URL }}
      - name: Prove Case seller aggregate authority in ephemeral PostgreSQL
        run: npm run audit:rls-case-seller-aggregate
        env:
          CASE_SELLER_AGGREGATE_PROOF_DATABASE_URL: ${{ env.DIRECT_URL }}
      - name: Prove Case account-export authority in ephemeral PostgreSQL
        run: npm run audit:rls-case-account-export
        env:
          CASE_ACCOUNT_EXPORT_PROOF_DATABASE_URL: ${{ env.DIRECT_URL }}
      - name: Prove Case escalation and cron-transition authority in ephemeral PostgreSQL
        run: npm run audit:rls-case-escalation-cron
        env:
          CASE_ESCALATION_CRON_PROOF_DATABASE_URL: ${{ env.DIRECT_URL }}
      - name: Prove Case account-deletion authority in ephemeral PostgreSQL
        run: npm run audit:rls-case-account-deletion
        env:
          CASE_ACCOUNT_DELETION_PROOF_DATABASE_URL: ${{ env.DIRECT_URL }}
      - name: Prove Case invariant drafts in rollback-only PostgreSQL
        run: npm run audit:rls-case-invariant-drafts
        env:
          CASE_INVARIANT_PROOF_DATABASE_URL: ${{ env.DIRECT_URL }}
      - name: Prove Case and CaseMessage legacy inspection SQL in ephemeral PostgreSQL
        run: npm run audit:rls-case-legacy-inspection
        env:
          CASE_LEGACY_INSPECTION_PROOF_DATABASE_URL: ${{ env.DIRECT_URL }}
      - name: Prove Order/payment/shipping legacy inspection SQL in ephemeral PostgreSQL
        run: npm run audit:rls-order-payment-shipping-legacy-inspection-postgres
        env:
          ORDER_PAYMENT_SHIPPING_LEGACY_INSPECTION_PROOF_DATABASE_URL: ${{ env.DIRECT_URL }}
      - name: Prove compatible Order seller key in rollback-only PostgreSQL
        run: npm run audit:rls-order-seller-key-compatibility
        env:
          ORDER_SELLER_KEY_COMPATIBILITY_PROOF_DATABASE_URL: ${{ env.DIRECT_URL }}
      - name: Prove compatible Stripe webhook leases in rollback-only PostgreSQL
        run: npm run audit:rls-stripe-webhook-lease-compatibility
        env:
          STRIPE_WEBHOOK_LEASE_COMPATIBILITY_PROOF_DATABASE_URL: ${{ env.DIRECT_URL }}
      - name: Prove Stripe webhook maintenance authority in rollback-only PostgreSQL
        run: npm run audit:rls-stripe-webhook-maintenance-postgres
        env:
          STRIPE_WEBHOOK_MAINTENANCE_PROOF_DATABASE_URL: ${{ env.DIRECT_URL }}
      - name: Prove Order/payment/shipping compatible postflight under the runtime role
        run: npm run audit:rls-order-payment-shipping-compatible-postflight
        env:
          ORDER_PAYMENT_SHIPPING_COMPATIBLE_POSTFLIGHT_PROOF_DATABASE_URL: ${{ env.DIRECT_URL }}
      - name: Prove Conversation and Message legacy cleanup in ephemeral PostgreSQL
        run: npm run audit:rls-conversation-message-legacy-cleanup
        env:
          CONVERSATION_MESSAGE_LEGACY_CLEANUP_PROOF_DATABASE_URL: ${{ env.DIRECT_URL }}
      - name: Prove compatible Case production postflight under the runtime role
        run: npm run audit:rls-case-compatible-db-postflight
        env:
          CASE_COMPATIBLE_DB_POSTFLIGHT_PROOF_DATABASE_URL: ${{ env.DIRECT_URL }}
      - name: Restore the exact Case activation release
        run: >-
          mv
          "$RUNNER_TEMP/case-activation-release"
          prisma/migrations/20260804160000_enable_case_rls
      - name: Apply the exact Case activation release
        run: npx prisma migrate deploy
      - name: Converge activated Case runtime grants
        run: psql "$DIRECT_URL" -v runtime_role=grainline_app_runtime -v migration_role=ci -f scripts/provision-runtime-db-role.sql
      - name: Verify migration status
        run: npx prisma migrate status
      - name: Audit final runtime grants and RLS catalog
        run: GRANT_AUDIT_DATABASE_URL="$DIRECT_URL" RUNTIME_DB_ROLE=grainline_app_runtime MIGRATION_DB_ROLE=ci npm run audit:db-grants -- --allow-loopback-ci
      - name: Prove promoted Case activation under the runtime role
        run: npm run audit:rls-case-activation-postgres
        env:
          CASE_ACTIVATION_PROOF_DATABASE_URL: ${{ env.DIRECT_URL }}
      - name: Restore the exact Case FORCE release
        run: >-
          mv
          "$RUNNER_TEMP/case-force-release"
          prisma/migrations/20260804191000_force_case_rls
      - name: Apply the exact Case FORCE release
        run: npx prisma migrate deploy
      - name: Converge FORCE-hardened Case runtime grants
        run: psql "$DIRECT_URL" -v runtime_role=grainline_app_runtime -v migration_role=ci -f scripts/provision-runtime-db-role.sql
      - name: Verify FORCE migration status
        run: npx prisma migrate status
      - name: Audit FORCE-hardened runtime grants and RLS catalog
        run: GRANT_AUDIT_DATABASE_URL="$DIRECT_URL" RUNTIME_DB_ROLE=grainline_app_runtime MIGRATION_DB_ROLE=ci npm run audit:db-grants -- --allow-loopback-ci
      - name: Prove FORCE-hardened Case authority under the runtime role
        run: npm run audit:rls-case-force-postgres
        env:
          CASE_FORCE_PROOF_DATABASE_URL: ${{ env.DIRECT_URL }}
      - name: Restore the exact StripeWebhookEvent activation release
        run: >-
          mv
          "$RUNNER_TEMP/stripe-webhook-event-activation-release"
          prisma/migrations/20260805060000_enable_stripe_webhook_event_rls
      - name: Apply the exact StripeWebhookEvent activation release
        run: npx prisma migrate deploy
      - name: Converge activated StripeWebhookEvent runtime grants
        run: psql "$DIRECT_URL" -v runtime_role=grainline_app_runtime -v migration_role=ci -f scripts/provision-runtime-db-role.sql
      - name: Audit activated StripeWebhookEvent grants and RLS catalog
        run: GRANT_AUDIT_DATABASE_URL="$DIRECT_URL" RUNTIME_DB_ROLE=grainline_app_runtime MIGRATION_DB_ROLE=ci npm run audit:db-grants -- --allow-loopback-ci
      - name: Prove policyless StripeWebhookEvent activation
        run: npm run audit:rls-stripe-webhook-event-activation-postgres
        env:
          STRIPE_WEBHOOK_EVENT_ACTIVATION_PROOF_DATABASE_URL: ${{ env.DIRECT_URL }}
      - name: Re-prove Stripe webhook leases behind policyless activation
        run: npm run audit:rls-stripe-webhook-lease-compatibility
        env:
          STRIPE_WEBHOOK_LEASE_COMPATIBILITY_PROOF_DATABASE_URL: ${{ env.DIRECT_URL }}
      - name: Re-prove Stripe webhook maintenance behind policyless activation
        run: npm run audit:rls-stripe-webhook-maintenance-postgres
        env:
          STRIPE_WEBHOOK_MAINTENANCE_PROOF_DATABASE_URL: ${{ env.DIRECT_URL }}
      - name: Prove StripeWebhookEvent database-first rollback and restoration
        run: npm run audit:rls-stripe-webhook-event-activation-rollback
        env:
          STRIPE_WEBHOOK_EVENT_ACTIVATION_ROLLBACK_PROOF_DATABASE_URL: ${{ env.DIRECT_URL }}
      - name: Re-audit restored StripeWebhookEvent activation posture
        run: GRANT_AUDIT_DATABASE_URL="$DIRECT_URL" RUNTIME_DB_ROLE=grainline_app_runtime MIGRATION_DB_ROLE=ci npm run audit:db-grants -- --allow-loopback-ci
      - name: Prove Conversation and Message FORCE rollback in ephemeral PostgreSQL
        run: npm run audit:rls-conversation-message-force-rollback
        env:
          CONVERSATION_MESSAGE_FORCE_ROLLBACK_PROOF_DATABASE_URL: ${{ env.DIRECT_URL }}
      - name: Prove FORCE-hardened Conversation and Message authority in ephemeral PostgreSQL
        run: npm run audit:rls-conversation-message-recipient
        env:
          CONVERSATION_MESSAGE_RECIPIENT_RLS_PROOF_DATABASE_URL: ${{ env.DIRECT_URL }}
      - run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Security audit
        run: npm run audit:dependencies
      - name: Production build
        run: npm run build
