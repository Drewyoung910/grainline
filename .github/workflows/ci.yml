name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: grainline_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d grainline_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Database — CI uses local Postgres service container, not the Neon pooler/direct URLs from Vercel
      DATABASE_URL: postgresql://ci:ci@localhost:5432/grainline_ci?sslmode=disable
      DIRECT_URL: postgresql://ci:ci@localhost:5432/grainline_ci?sslmode=disable
      # Clerk auth
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      # Stripe
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      # Cloudflare R2
      CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_R2_BUCKET_NAME: ${{ secrets.CLOUDFLARE_R2_BUCKET_NAME }}
      CLOUDFLARE_R2_PUBLIC_URL: ${{ secrets.CLOUDFLARE_R2_PUBLIC_URL }}
      R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
      NEXT_PUBLIC_CLOUDFLARE_R2_PUBLIC_URL: ${{ secrets.NEXT_PUBLIC_CLOUDFLARE_R2_PUBLIC_URL }}
      NEXT_PUBLIC_R2_PUBLIC_URL: ${{ secrets.NEXT_PUBLIC_R2_PUBLIC_URL }}
      CLOUDFLARE_R2_PUBLIC_URLS: ${{ secrets.CLOUDFLARE_R2_PUBLIC_URLS }}
      ALLOWED_R2_PUBLIC_URLS: ${{ secrets.ALLOWED_R2_PUBLIC_URLS }}
      UPLOAD_VERIFICATION_SECRET: ci-upload-verification-secret
      # Upstash Redis
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      # Shipping
      SHIPPO_API_KEY: ${{ secrets.SHIPPO_API_KEY }}
      SHIPPING_RATE_SECRET: ${{ secrets.SHIPPING_RATE_SECRET }}
      # Email
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_WEBHOOK_SECRET: ${{ secrets.RESEND_WEBHOOK_SECRET }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      UNSUBSCRIBE_SECRET: ${{ secrets.UNSUBSCRIBE_SECRET }}
      EMAIL_UNSUBSCRIBE_SECRET: ${{ secrets.EMAIL_UNSUBSCRIBE_SECRET }}
      # AI
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      # Admin / cron
      ADMIN_PIN: ${{ secrets.ADMIN_PIN }}
      ADMIN_PIN_COOKIE_SECRET: ${{ secrets.ADMIN_PIN_COOKIE_SECRET }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      HEALTH_CHECK_TOKEN: ci-health-check-token
      EMAIL_OUTBOX_DAILY_LIMIT: "100"
      # Sentry / app
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
      NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prisma generate
      - name: Verify dormant Order staff charged-total correction
        run: >-
          node --test
          tests/order-staff-read-charged-total-correction.test.mjs
          tests/order-staff-read-authority-postgres.test.mjs
      - name: Isolate Order staff charged-total correction until its predecessors pass
        run: >-
          mv
          prisma/migrations/20260905010000_correct_order_staff_read_charged_total
          "$RUNNER_TEMP/order-staff-read-charged-total-correction"
      - name: Verify Shippo test-token credential recovery
        run: >-
          node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON
          --experimental-strip-types --test
          tests/shippo-api-credential-recovery-plan.test.mjs
          tests/shippo-api-credential-exposure-recovery.test.mjs
          tests/clerk-server-key-credential-recovery-plan.test.mjs
          tests/clerk-server-key-credential-exposure-recovery.test.mjs
      - name: Verify additive Case and Order correctness candidate
        run: >-
          node --test
          tests/case-correctness-migration.test.mjs
          tests/case-correctness-postgres.test.mjs
          tests/case-case-message-invariant-postgres-proof.test.mjs
          tests/case-order-active-authority-postgres-proof.test.mjs
          tests/case-account-deletion-authority-postgres-proof.test.mjs
      - name: Isolate Case and Order correctness until every predecessor passes
        run: >-
          mv
          prisma/migrations/20260901160000_correct_case_order_invariants
          "$RUNNER_TEMP/case-order-correctness-release"
      - name: Verify Order participant list projection correction
        run: npm run audit:order-participant-list-projection-correction
      - name: Isolate Order participant list projection correction until charged total passes
        run: >-
          mv
          prisma/migrations/20260901155000_correct_order_participant_list_projection
          "$RUNNER_TEMP/order-participant-list-projection-correction"
      - name: Verify compatible Order charged-total witness
        run: npm run audit:order-charged-total-compatibility
      - name: Isolate Order charged-total witness until label authority passes
        run: >-
          mv
          prisma/migrations/20260901150000_prepare_order_charged_total
          "$RUNNER_TEMP/order-charged-total-compatibility"
      - name: Verify compatible Order label authority release
        run: npm run audit:order-label-authority-release
      - name: Isolate Order label authority until fulfillment authority passes
        run: >-
          mv
          prisma/migrations/20260901140000_prepare_order_label_authority
          "$RUNNER_TEMP/order-label-authority-release"
      - name: Verify compatible Order fulfillment authority release
        run: npm run audit:order-fulfillment-authority-release
      - name: Isolate Order fulfillment authority until receipt Notification authority passes
        run: >-
          mv
          prisma/migrations/20260901130000_prepare_order_fulfillment_authority
          "$RUNNER_TEMP/order-fulfillment-authority-release"
      - name: Verify compatible Order receipt Notification authority release
        run: npm run audit:order-receipt-notification-authority-release
      - name: Isolate Order receipt Notification authority until checkout receipt authority passes
        run: >-
          mv
          prisma/migrations/20260901120000_prepare_order_receipt_notification_authority
          "$RUNNER_TEMP/order-receipt-notification-authority-release"
      - name: Verify compatible Order checkout receipt authority release
        run: npm run audit:order-checkout-receipt-authority-release
      - name: Isolate Order checkout receipt authority until snapshot correction passes
        run: >-
          mv
          prisma/migrations/20260901110000_prepare_order_checkout_receipt_authority
          "$RUNNER_TEMP/order-checkout-receipt-authority-release"
      - name: Isolate Order participant snapshot correction until detail projection passes
        run: >-
          mv
          prisma/migrations/20260901105000_correct_order_participant_snapshot_projection
          "$RUNNER_TEMP/order-participant-snapshot-correction-release"
      - name: Verify compatible Order participant detail projection release
        run: npm run audit:order-participant-detail-projection-release
      - name: Isolate Order participant detail projection until cursor authority passes
        run: >-
          mv
          prisma/migrations/20260901100000_prepare_order_participant_detail_projection
          "$RUNNER_TEMP/order-participant-detail-projection-release"
      - name: Verify compatible Order participant cursor authority release
        run: npm run audit:order-participant-cursor-authority-release
      - name: Isolate Order participant cursor authority until summary authority passes
        run: >-
          mv
          prisma/migrations/20260901090000_prepare_order_participant_cursor_authority
          "$RUNNER_TEMP/order-participant-cursor-authority-release"
      - name: Verify compatible Order participant summary authority release
        run: npm run audit:order-participant-summary-authority-release
      - name: Isolate Order participant summary authority until seller metrics passes
        run: >-
          mv
          prisma/migrations/20260901080000_prepare_order_participant_summary_authority
          "$RUNNER_TEMP/order-participant-summary-authority-release"
      - name: Verify compatible Order seller metrics authority release
        run: npm run audit:order-seller-metrics-authority-release
      - name: Isolate Order seller metrics authority until seller analytics passes
        run: >-
          mv
          prisma/migrations/20260901070000_prepare_order_seller_metrics_authority
          "$RUNNER_TEMP/order-seller-metrics-authority-release"
      - name: Verify compatible Order seller analytics authority release
        run: npm run audit:order-seller-analytics-authority-release
      - name: Isolate Order seller analytics authority until public aggregate authority passes
        run: >-
          mv
          prisma/migrations/20260901060000_prepare_order_seller_analytics_authority
          "$RUNNER_TEMP/order-seller-analytics-authority-release"
      - name: Verify compatible Order public aggregate authority release
        run: npm run audit:order-public-aggregate-authority-release
      - name: Isolate Order public aggregate authority until eligibility authority passes
        run: >-
          mv
          prisma/migrations/20260901050000_prepare_order_public_aggregate_authority
          "$RUNNER_TEMP/order-public-aggregate-authority-release"
      - name: Verify compatible Order eligibility authority release
        run: npm run audit:order-eligibility-authority-release
      - name: Isolate Order eligibility authority until participant export passes
        run: >-
          mv
          prisma/migrations/20260901040000_prepare_order_eligibility_authority
          "$RUNNER_TEMP/order-eligibility-authority-release"
      - name: Verify compatible Order participant export authority release
        run: npm run audit:order-participant-export-authority-release
      - name: Isolate Order participant export authority until staff authority passes
        run: >-
          mv
          prisma/migrations/20260901030000_prepare_order_participant_export_authority
          "$RUNNER_TEMP/order-participant-export-authority-release"
      - name: Verify dormant Order staff read authority release
        run: npm run audit:order-staff-read-authority-release
      - name: Isolate Order staff read authority until participant detail passes
        run: >-
          mv
          prisma/migrations/20260901020000_prepare_order_staff_read_authority
          "$RUNNER_TEMP/order-staff-read-authority-release"
      - name: Verify compatible Order participant detail authority release
        run: npm run audit:order-participant-detail-authority-release
      - name: Isolate Order participant detail authority until list authority passes
        run: >-
          mv
          prisma/migrations/20260901010000_prepare_order_participant_detail_authority
          "$RUNNER_TEMP/order-participant-detail-authority-release"
      - name: Verify compatible Order participant list authority release
        run: npm run audit:order-participant-list-authority-release
      - name: Isolate Order participant list authority until OrderPaymentEvent FORCE passes
        run: >-
          mv
          prisma/migrations/20260831233000_prepare_order_participant_list_authority
          "$RUNNER_TEMP/order-participant-list-authority-release"
      - name: Prove OrderPaymentEvent application zero-direct-access
        run: npm run audit:order-payment-event-zero-direct-access
      - name: Verify OrderPaymentEvent FORCE migration tree
        env:
          SAVED_SEARCH_RLS_DEPLOY_PHASE: order-payment-event-force-reviewed
        run: npm run verify:rls-release-artifact
      - name: Verify OrderPaymentEvent posture-only FORCE release
        run: npm run audit:order-payment-event-force-release
      - name: Isolate OrderPaymentEvent FORCE until Phase A passes
        run: >-
          mv
          prisma/migrations/20260831010000_force_order_payment_event_rls
          "$RUNNER_TEMP/order-payment-event-force-release"
      - name: Verify OrderPaymentEvent activation migration tree
        env:
          SAVED_SEARCH_RLS_DEPLOY_PHASE: order-payment-event-activation-reviewed
        run: npm run verify:rls-release-artifact
      - name: Verify OrderPaymentEvent policyless activation release
        run: npm run audit:order-payment-event-activation-release
      - name: Isolate OrderPaymentEvent activation until transition authority passes
        run: >-
          mv
          prisma/migrations/20260830030000_enable_order_payment_event_rls
          "$RUNNER_TEMP/order-payment-event-activation-release"
      - name: Verify OrderPaymentEvent transition-authority release
        run: npm run audit:order-payment-event-transition-authority-release
      - name: Isolate OrderPaymentEvent transition authority until aggregate authority passes
        run: >-
          mv
          prisma/migrations/20260830020000_prepare_order_payment_event_transition_authority
          "$RUNNER_TEMP/order-payment-event-transition-authority-release"
      - name: Verify OrderPaymentEvent aggregate-authority release
        run: npm run audit:order-payment-event-aggregate-authority-release
      - name: Isolate OrderPaymentEvent aggregate authority until read authority passes
        run: >-
          mv
          prisma/migrations/20260830010000_prepare_order_payment_event_aggregate_authority
          "$RUNNER_TEMP/order-payment-event-aggregate-authority-release"
      - name: Verify OrderPaymentEvent fixed read-authority release
        run: npm run audit:order-payment-event-read-authority-release
      - name: Isolate OrderPaymentEvent read authority until invariants pass
        run: >-
          mv
          prisma/migrations/20260829020000_prepare_order_payment_event_read_authority
          "$RUNNER_TEMP/order-payment-event-read-authority-release"
      - name: Verify OrderPaymentEvent invariant compatibility release
        run: npm run audit:order-payment-event-invariants-release
      - name: Isolate OrderPaymentEvent invariants until signed-event predecessors pass
        run: >-
          mv
          prisma/migrations/20260829010000_prepare_order_payment_event_invariants
          "$RUNNER_TEMP/order-payment-event-invariants-release"
      - name: Verify signed-dispute identity compatibility release
        run: npm run audit:order-payment-signed-dispute-identity-release
      - name: Isolate signed-dispute identity until its predecessors pass
        run: >-
          mv
          prisma/migrations/20260828020000_correct_order_payment_signed_dispute_identity
          "$RUNNER_TEMP/order-payment-signed-dispute-identity-release"
      - name: Verify signed-refund identity compatibility release
        run: npm run audit:order-payment-signed-refund-identity-release
      - name: Isolate signed-refund identity until its predecessors pass
        run: >-
          mv
          prisma/migrations/20260828010000_prepare_order_payment_signed_refund_identity
          "$RUNNER_TEMP/order-payment-signed-refund-identity-release"
      - name: Verify blocked-checkout transfer binding release
        run: npm run audit:order-payment-blocked-checkout-transfer-binding-release
      - name: Isolate blocked-checkout transfer binding until its predecessors pass
        run: >-
          mv
          prisma/migrations/20260826010000_prepare_blocked_checkout_transfer_binding
          "$RUNNER_TEMP/blocked-checkout-transfer-binding-release"
      - name: Verify blocked-checkout refund delivery compatibility release
        run: npm run audit:order-payment-blocked-checkout-refund-delivery-release
      - name: Isolate blocked-checkout refund delivery until OrderPaymentEvent predecessors pass
        run: >-
          mv
          prisma/migrations/20260825010000_prepare_blocked_checkout_refund_delivery
          "$RUNNER_TEMP/blocked-checkout-refund-delivery-release"
      - name: Verify Order refund inactive-seller recovery release
        run: npm run audit:order-refund-inactive-seller-recovery-release
      - name: Isolate Order refund inactive-seller recovery until sealed predecessors pass
        run: >-
          mv
          prisma/migrations/20260824050000_prepare_order_refund_inactive_seller_recovery
          "$RUNNER_TEMP/order-refund-inactive-seller-recovery-release"
      - name: Verify Order refund reconciliation authority release
        run: npm run audit:order-refund-reconciliation-authority-release
      - name: Isolate Order refund reconciliation until sealed predecessors pass
        run: >-
          mv
          prisma/migrations/20260824040000_prepare_order_refund_reconciliation_authority
          "$RUNNER_TEMP/order-refund-reconciliation-authority-release"
      - name: Verify Order payment signed authority release
        run: npm run audit:order-payment-signed-authority-release
      - name: Isolate Order payment signed authority until sealed predecessors pass
        run: >-
          mv
          prisma/migrations/20260824030000_prepare_order_payment_signed_authority
          "$RUNNER_TEMP/order-payment-signed-authority-release"
      - name: Verify Order refund record authority release
        run: npm run audit:order-refund-record-authority-release
      - name: Isolate Order refund record authority until sealed predecessors pass
        run: >-
          mv
          prisma/migrations/20260824020000_prepare_order_refund_record_authority
          "$RUNNER_TEMP/order-refund-record-authority-release"
      - name: Verify Order refund claim generation release
        run: npm run audit:order-refund-claim-generation-release
      - name: Isolate Order refund claim generation until sealed predecessors pass
        run: >-
          mv
          prisma/migrations/20260824010000_prepare_order_refund_claim_generation
          "$RUNNER_TEMP/order-refund-claim-generation-release"
      - name: Verify SellerPayoutEvent FORCE migration tree
        env:
          SAVED_SEARCH_RLS_DEPLOY_PHASE: seller-payout-event-force-reviewed
        run: npm run verify:rls-release-artifact
      - name: Verify SellerPayoutEvent FORCE release
        run: npm run audit:rls-seller-payout-event-force-release
      - name: Isolate SellerPayoutEvent FORCE until Phase A passes
        run: >-
          mv
          prisma/migrations/20260823220000_force_seller_payout_event_rls
          "$RUNNER_TEMP/seller-payout-event-force-release"
      - name: Verify SellerPayoutEvent activation migration tree
        env:
          SAVED_SEARCH_RLS_DEPLOY_PHASE: seller-payout-event-activation-reviewed
        run: npm run verify:rls-release-artifact
      - name: Verify SellerPayoutEvent activation release
        run: npm run audit:rls-seller-payout-event-activation-release
      - name: Isolate SellerPayoutEvent activation until authority proofs pass
        run: >-
          mv
          prisma/migrations/20260822180000_enable_seller_payout_event_rls
          "$RUNNER_TEMP/seller-payout-event-activation-release"
      - name: Isolate SellerPayoutEvent authority until all sealed predecessors pass
        run: >-
          mv
          prisma/migrations/20260815210000_prepare_seller_payout_event_authority
          "$RUNNER_TEMP/seller-payout-event-authority-release"
      - name: Verify CheckoutStockReservation FORCE migration tree
        env:
          SAVED_SEARCH_RLS_DEPLOY_PHASE: checkout-stock-reservation-force-reviewed
        run: npm run verify:rls-release-artifact
      - name: Verify CheckoutStockReservation FORCE release
        run: npm run audit:rls-checkout-stock-reservation-force-release
      - name: Isolate CheckoutStockReservation FORCE until Phase A passes
        run: >-
          mv
          prisma/migrations/20260815060001_force_checkout_stock_reservation_rls
          "$RUNNER_TEMP/checkout-stock-reservation-force-release"
      - name: Verify CheckoutStockReservation activation migration tree
        env:
          SAVED_SEARCH_RLS_DEPLOY_PHASE: checkout-stock-reservation-activation-reviewed
        run: npm run verify:rls-release-artifact
      - name: Verify CheckoutStockReservation activation release
        run: npm run audit:rls-checkout-stock-reservation-activation-release
      - name: Isolate CheckoutStockReservation activation until source consistency passes
        run: >-
          mv
          prisma/migrations/20260815060000_enable_checkout_stock_reservation_rls
          "$RUNNER_TEMP/checkout-stock-reservation-activation-release"
      - name: Verify CheckoutStockReservation source-consistency migration tree
        env:
          SAVED_SEARCH_RLS_DEPLOY_PHASE: checkout-stock-reservation-source-consistency-reviewed
        run: npm run verify:rls-release-artifact
      - name: Verify CheckoutStockReservation source-consistency release
        run: npm run audit:rls-checkout-stock-reservation-source-consistency-release
      - name: Isolate CheckoutStockReservation source consistency until authority passes
        run: >-
          mv
          prisma/migrations/20260814053000_prepare_checkout_stock_reservation_source_consistency
          "$RUNNER_TEMP/checkout-stock-reservation-source-consistency-release"
      - name: Verify sealed CheckoutStockReservation authority predecessor
        env:
          SAVED_SEARCH_RLS_DEPLOY_PHASE: checkout-stock-reservation-authority-reviewed
        run: npm run verify:rls-release-artifact
      - name: Verify CheckoutStockReservation authority release
        run: npm run audit:rls-checkout-stock-reservation-authority-release
      - name: Verify StripeWebhookEvent FORCE release
        run: npm run audit:rls-stripe-webhook-event-force-sealed-prefix
      - name: Verify Case FORCE proof equivalence
        run: npm run audit:rls-case-force-release
      - name: Verify Case read-mode release bytes
        run: npm run audit:rls-case-read-mode-candidate
      - name: Verify Conversation and Message authority proof equivalence
        run: npm run audit:rls-conversation-message-authority-release
      - name: Verify Conversation and Message activation proof equivalence
        run: npm run audit:rls-conversation-message-activation-release
      - name: Verify Conversation and Message FORCE release artifact
        run: npm run audit:rls-conversation-message-force-release
      - name: Verify Notification activation proof equivalence
        run: npm run audit:rls-notification-activation-release
      - name: Verify Notification FORCE release artifact
        run: npm run audit:rls-notification-force-release
      - name: Verify DirectUpload retirement proof equivalence
        run: npm run audit:rls-direct-upload-retirement-release
      - name: Verify DirectUpload activation proof equivalence
        run: npm run audit:rls-direct-upload-activation-release
      - name: Verify the sealed StripeWebhookEvent Phase-A predecessor
        run: npm run audit:rls-stripe-webhook-event-activation-sealed-prefix
      - name: Prepare CI runtime policy role
        run: psql "$DIRECT_URL" -f scripts/prepare-ci-rls-runtime-role.sql
      - name: Prove runtime-role provisioning refusals exit nonzero
        run: |
          if psql "$DIRECT_URL" -v runtime_role=ci -v migration_role=ci -f scripts/provision-runtime-db-role.sql; then
            echo "runtime-role provisioning unexpectedly accepted the migration owner as runtime"
            exit 1
          fi
      - name: Isolate the exact Case activation until authority proofs pass
        run: >-
          mv
          prisma/migrations/20260804160000_enable_case_rls
          "$RUNNER_TEMP/case-activation-release"
      - name: Isolate the exact Case FORCE release until Phase A passes
        run: >-
          mv
          prisma/migrations/20260804191000_force_case_rls
          "$RUNNER_TEMP/case-force-release"
      - name: Isolate the exact DirectUpload activation until external grants converge
        run: >-
          mv
          prisma/migrations/20260801194000_enable_direct_upload_rls
          "$RUNNER_TEMP/direct-upload-activation-release"
      - name: Isolate the exact StripeWebhookEvent activation until compatibility proofs pass
        run: >-
          mv
          prisma/migrations/20260805060000_enable_stripe_webhook_event_rls
          "$RUNNER_TEMP/stripe-webhook-event-activation-release"
      - name: Isolate the exact StripeWebhookEvent FORCE release until Phase A passes
        run: >-
          mv
          prisma/migrations/20260810172000_force_stripe_webhook_event_rls
          "$RUNNER_TEMP/stripe-webhook-event-force-release"
      - name: Isolate CheckoutStockReservation authority until webhook FORCE passes
        run: >-
          mv
          prisma/migrations/20260810190000_prepare_checkout_stock_reservation_authority
          "$RUNNER_TEMP/checkout-stock-reservation-authority-release"
      - name: Apply compatible migrations to CI Postgres
        run: npx prisma migrate deploy
      - name: Converge pre-activation production-style runtime grants
        run: psql "$DIRECT_URL" -v runtime_role=grainline_app_runtime -v migration_role=ci -f scripts/provision-runtime-db-role.sql
      - name: Converge pre-activation DirectUpload cleanup-worker grants
        run: psql "$DIRECT_URL" -v cleanup_role=grainline_direct_upload_cleanup_v2 -v runtime_role=grainline_app_runtime -v migration_role=ci -f scripts/provision-direct-upload-cleanup-role.sql
      - name: Prove DirectUpload legacy repair in ephemeral PostgreSQL
        run: npm run audit:rls-direct-upload-legacy-repair
        env:
          DIRECT_UPLOAD_LEGACY_REPAIR_PROOF_DATABASE_URL: ${{ env.DIRECT_URL }}
      - name: Restore the exact DirectUpload activation release
        run: >-
          mv
          "$RUNNER_TEMP/direct-upload-activation-release"
          prisma/migrations/20260801194000_enable_direct_upload_rls
      - name: Apply migrations to CI Postgres
