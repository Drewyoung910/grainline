name: UserEmailAddress Production Inspection

on:
  workflow_dispatch:
    inputs:
      release_commit:
        description: Exact reviewed main commit
        required: true
        type: string
      main_ci_run_id:
        description: Successful full push CI run for that exact main commit
        required: true
        type: string
      confirmation:
        description: Type inspect-user-email-address-preparation
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: production-database-inspections
  cancel-in-progress: false

jobs:
  inspect:
    name: Read UserEmailAddress preparation state
    if: >-
      github.repository == 'Drewyoung910/grainline' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      github.run_attempt == 1 &&
      inputs.confirmation == 'inspect-user-email-address-preparation'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: Production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.2"
          architecture: x64
          check-latest: false
          package-manager-cache: false
          token: ""
      - run: npm ci --ignore-scripts
      - name: Bind inspection to exact main and completed CI
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          REVIEWED_RELEASE_COMMIT: ${{ inputs.release_commit }}
          REVIEWED_MAIN_CI_RUN_ID: ${{ inputs.main_ci_run_id }}
        with:
          script: |
            const sha = process.env.REVIEWED_RELEASE_COMMIT;
            const value = process.env.REVIEWED_MAIN_CI_RUN_ID;
            if (!/^[0-9a-f]{40}$/.test(sha ?? '') || sha !== context.sha ||
                !/^[1-9][0-9]{0,19}$/.test(value ?? '')) {
              throw new Error('UserEmailAddress inspection binding drifted');
            }
            const runId = Number(value);
            if (!Number.isSafeInteger(runId)) throw new Error('CI run id is unsafe');
            const [{data: main}, {data: run}] = await Promise.all([
              github.rest.repos.getBranch({...context.repo, branch: 'main'}),
              github.rest.actions.getWorkflowRun({...context.repo, run_id: runId}),
            ]);
            if (main.commit.sha !== sha || run.name !== 'CI' ||
                run.event !== 'push' || run.head_branch !== 'main' ||
                run.head_sha !== sha || run.status !== 'completed' ||
                run.conclusion !== 'success') {
              throw new Error('UserEmailAddress inspection main/CI readback drifted');
            }
      - name: Verify read-only inspection source
        run: node --test tests/user-email-address-production-inspect.test.mjs
      - name: Verify owner connection boundary
        run: node scripts/guard-production-migration-runner.mjs
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
          PRODUCTION_MIGRATION_DIRECT_URL_SHA256: ${{ vars.PRODUCTION_MIGRATION_DIRECT_URL_SHA256 }}
          PRODUCTION_MIGRATION_CONFIRM: run-reviewed-production-migrations-from-main
          PRODUCTION_MIGRATION_RELEASE_COMMIT: ${{ inputs.release_commit }}
          MIGRATION_DB_ROLE: neondb_owner
          RUNTIME_DB_ROLE: grainline_app_runtime
      - name: Inspect aggregate and catalog state in an engine-read-only transaction
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DIRECT_URL }}
          PRODUCTION_MIGRATION_DIRECT_URL_SHA256: ${{ vars.PRODUCTION_MIGRATION_DIRECT_URL_SHA256 }}
          MIGRATION_DB_ROLE: neondb_owner
          RUNTIME_DB_ROLE: grainline_app_runtime
          USER_EMAIL_ADDRESS_INSPECT_RELEASE_COMMIT: ${{ inputs.release_commit }}
          USER_EMAIL_ADDRESS_INSPECT_CONFIRM: ${{ inputs.confirmation }}
          USER_EMAIL_ADDRESS_INSPECT_EVIDENCE_PATH: ${{ runner.temp }}/user-email-address-production-inspection-${{ inputs.release_commit }}.json
        run: node scripts/user-email-address-production-inspect.mjs
      - name: Preserve sanitized aggregate and catalog evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: user-email-address-production-inspection-${{ github.run_id }}
          path: ${{ runner.temp }}/user-email-address-production-inspection-${{ github.sha }}.json
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: false
