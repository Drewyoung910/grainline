name: Admin Repository Consumer Proof

on:
  workflow_dispatch:
    inputs:
      release_commit:
        description: Exact reviewed 40-character main commit
        required: true
        type: string
      review_json:
        description: Fresh nonce-bound keyed comparison from prepared inputs; no credential values or PIN hashes
        required: true
        type: string
      confirmation:
        description: Type prove-reviewed-admin-repository-consumer
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: admin-repository-consumer-proof
  cancel-in-progress: false

jobs:
  proof:
    if: github.repository == 'Drewyoung910/grainline' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # No environment: compare repository secrets without environment shadows.
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      - name: Compare only the admin repository credential pair
        run: node scripts/admin-github-consumer-proof.mjs
        env:
          ADMIN_CONSUMER_RELEASE_COMMIT: ${{ inputs.release_commit }}
          ADMIN_CONSUMER_REVIEW_JSON: ${{ inputs.review_json }}
          ADMIN_CONSUMER_CONFIRM: ${{ inputs.confirmation }}
          ADMIN_PIN: ${{ secrets.ADMIN_PIN }}
          ADMIN_PIN_COOKIE_SECRET: ${{ secrets.ADMIN_PIN_COOKIE_SECRET }}
      - name: Save only the successful admin pair comparison
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: admin-consumer-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/admin-consumer-${{ github.run_id }}-${{ github.run_attempt }}.json
          if-no-files-found: error
          retention-days: 7
